, перерыв), рассмотрение по существу (ст. 160–163: объяснения, доказательства, экспертиза, свидетели), прения (ст. 164: выступления, реплики), принятие решения (ст. 166–168: удаление в совещательную комнату, тайна совещания). Протокол — ст. 155.","full":["Судебное разбирательство — центральная стадия арбитражного процесса, в которой суд первой инстанции рассматривает дело по существу, исследует доказательства, устанавливает обстоятельства и разрешает спор путём принятия решения. Разбирательство осуществляется в судебном заседании с обязательным извещением лиц, участвующих в деле, о времени и месте заседания (ч. 1 ст. 153 АПК РФ). Значение стадии: именно здесь реализуются принципы состязательности, непосредственности, устности и гласности, проверяется обоснованность требований и возражений, формируется судебный акт, которым разрешается спор.","Срок рассмотрения. Дело должно быть рассмотрено арбитражным судом первой инстанции в срок, не превышающий шести месяцев со дня поступления заявления в суд, включая срок на подготовку дела и на принятие решения, если АПК не установлено иное (ч. 1 ст. 152 АПК РФ). По отдельным категориям (споры о сносе самовольной постройки, приведении её в соответствие с параметрами, об изъятии земельного участка из земель сельскохозяйственного назначения) установлен срок один месяц. Срок может быть продлён на основании мотивированного заявления судьи председателем суда или его заместителем до девяти месяцев в связи с особой сложностью дела или значительным числом участников (ч. 2 ст. 152 АПК РФ). Время, на которое производство приостанавливалось или разбирательство откладывалось, в срок рассмотрения не включается, но учитывается при определении разумного срока (ч. 3 ст. 152 АПК РФ).","Части судебного разбирательства:","1) подготовительная часть (ст. 153–159 АПК РФ). Председательствующий открывает заседание и объявляет, какое дело рассматривается; проверяет явку, устанавливает личность и полномочия явившихся, выясняет, извещены ли неявившиеся и причины неявки; выясняет возможность слушания дела; объявляет состав суда, сообщает, кто ведёт протокол, кто участвует в качестве эксперта и переводчика, разъясняет право заявлять отводы; разъясняет процессуальные права и обязанности; удаляет свидетелей из зала до допроса; предупреждает переводчика, эксперта и свидетелей об ответственности; определяет с учётом мнения лиц последовательность действий и продолжительность выступлений; выясняет, поддерживает ли истец иск, признаёт ли ответчик, не желают ли стороны заключить мировое соглашение или применить медиацию. Разрешаются ходатайства (ст. 159 АПК РФ), возможен перерыв (ст. 158 АПК РФ), отложение (ст. 163 АПК РФ);","2) рассмотрение дела по существу (ст. 160–163 АПК РФ). Суд заслушивает объяснения истца, ответчика и иных лиц, устанавливает обстоятельства дела, исследует письменные и вещественные доказательства, заключения экспертов, показания свидетелей, аудио- и видеозаписи, консультации специалистов. Доказательства исследуются по правилам ст. 162 АПК РФ; заявление о фальсификации доказательства рассматривается в порядке ст. 161 АПК РФ. При необходимости суд может отложить разбирательство (ст. 163 АПК РФ);","3) судебные прения (ст. 164 АПК РФ). Состоят из устных выступлений лиц, участвующих в деле, и их представителей, которые обосновывают свою позицию. Первыми выступают истец и (или) его представитель, затем третье лицо с самостоятельными требованиями, ответчик и (или) его представитель; третье лицо без самостоятельных требований — после истца или ответчика, на стороне которого участвует; прокурор и представители государственных органов, обратившиеся в суд, — первыми. Участники прений не вправе ссылаться на обстоятельства, не выяснявшиеся судом, и на доказательства, не исследованные в заседании или признанные недопустимыми. После выступлений допускаются реплики; право последней реплики принадлежит ответчику и (или) его представителю (ч. 5 ст. 164 АПК РФ);","4) принятие решения (ст. 166–168 АПК РФ). После исследования доказательств и прений председательствующий объявляет рассмотрение дела по существу законченным, и суд удаляется для принятия решения (ст. 166 АПК РФ). Решение принимается именем РФ в условиях тайны совещания судей; в помещении совещания могут находиться только судьи (ст. 167 АПК РФ). Решение объявляется в заседании, изготавливается в полном объёме в срок, установленный ст. 176 АПК РФ (как правило, не позднее пяти дней со дня объявления резолютивной части), и вступает в законную силу по истечении месячного срока на апелляционное обжалование, если не подана апелляционная жалоба.","Протокол судебного заседания (ст. 155 АПК РФ) ведётся секретарём или помощником судьи; в нём фиксируются все существенные действия, заявления, ходатайства и результаты их разрешения; лица, участвующие в деле, вправе знакомиться с протоколом и подавать замечания в течение трёх дней после его подписания. Неявка надлежаще извещённых лиц не препятствует рассмотрению дела (ст. 156 АПК РФ); суд исследует доказательства непосредственно (ст. 157 АПК РФ); при замене судьи разбирательство начинается заново."],"learn":["Ст. 152 — 6 месяцев, включая подготовку; продление до 9 месяцев; приостановление и отложение не включаются.","Ст. 153 — порядок в заседании; ст. 155 — протокол; ст. 156 — неявка не препятствует.","Части: подготовительная → рассмотрение по существу → прения → решение.","Ст. 164 — прения; последняя реплика — у ответчика.","Ст. 166–167 — окончание разбирательства, тайна совещания судей."],"norms":["Ст. 152 АПК РФ. «1. Дело должно быть рассмотрено арбитражным судом первой инстанции в срок, не превышающий шести месяцев со дня поступления заявления в арбитражный суд, включая срок на подготовку дела к судебному разбирательству и на принятие решения по делу, если настоящим Кодексом не установлено иное …»","Ст. 153 АПК РФ. «1. Разбирательство дела осуществляется в судебном заседании арбитражного суда с обязательным извещением лиц, участвующих в деле, о времени и месте заседания. 2. Судья, а при коллегиальном рассмотрении дела председательствующий в судебном заседании …»","Ст. 164 АПК РФ. «2. Судебные прения состоят из устных выступлений лиц, участвующих в деле, и их представителей. В этих выступлениях они обосновывают свою позицию по делу. 3. В судебных прениях первыми выступают истец и (или) его представитель, затем — третье лицо, заявляющее самостоятельные требования относительно предмета спора, ответчик и (или) его представитель. Третье лицо, не заявляющее самостоятельных требований относительно предмета спора, выступает после истца или после ответчика, на стороне которого оно участвует в деле …»","Ст. 166 АПК РФ. «После исследования доказательств по делу и судебных прений председательствующий в судебном заседании объявляет рассмотрение дела по существу законченным и арбитражный суд удаляется для принятия решения, о чем объявляется присутствующим в зале судебного заседания.»"]}];

упает в дело."},{"q":"По каким делам прокурор вправе обратиться в арбитражный суд с заявлением?","o":["По любым гражданским спорам между организациями","По всем спорам, где одной из сторон является гражданин","По любой категории дел по своему усмотрению","Только по категориям, прямо перечисленным в ч. 1 ст. 52 АПК РФ"],"a":3,"e":"Перечень категорий для обращения прокурора в ч. 1 ст. 52 АПК РФ является закрытым."},{"q":"С какого момента прокурор вправе вступить в дело для обеспечения законности?","o":["На любой стадии арбитражного процесса","Только после принятия решения первой инстанцией","Только до начала судебного разбирательства","Только при рассмотрении дела в апелляции"],"a":0,"e":"Ч. 5 ст. 52 АПК РФ разрешает прокурору вступить в дело на любой стадии."},{"q":"Обязан ли прокурор уплачивать государственную пошлину при обращении в арбитражный суд?","o":["Да, в общем порядке","Нет, он освобожден от госпошлины","Да, но только по имущественным искам","Нет, если дело рассматривается в первой инстанции"],"a":1,"e":"Прокурор освобожден от уплаты госпошлины (ст. 105 АПК РФ, ст. 333.35 НК РФ)."},{"q":"Что происходит с делом, если прокурор отказался от предъявленного им иска?","o":["Производство прекращается без права истца возразить","Суд обязан отменить иск прокурора","Истец вправе требовать рассмотрения дела по существу, если участвует в деле","Дело автоматически передается другому прокурору"],"a":2,"e":"Ч. 4 ст. 52 АПК РФ сохраняет за участвующим в деле истцом право на рассмотрение дела по существу."}],"18":[{"q":"Кто признается свидетелем в арбитражном процессе?","o":["Лицо, обладающее специальными знаниями по делу","Лицо, осуществляющее перевод в судебном заседании","Помощник судьи, ведущий протокол","Лицо, располагающее сведениями о фактических обстоятельствах, имеющих значение для дела"],"a":3,"e":"Ст. 56 АПК РФ определяет свидетеля через наличие сведений о фактических обстоятельствах дела."},{"q":"Чем специалист отличается от эксперта?","o":["Специалист дает конс ний лиц","Только истец при подаче иска","Только ответчик в отзыве","Прокурор независимо от категории дела"],"a":0,"e":"Предмет доказывания определяет суд на основе требований и возражений участвующих лиц."},{"q":"Кто обязан доказывать обстоятельства, на которые ссылается?","o":["Только ответчик","Каждое лицо, участвующее в деле, по своим требованиям и возражениям","Только суд","Свидетель, вызванный в заседание"],"a":1,"e":"Ч. 1 ст. 65 АПК РФ: каждое лицо доказывает обстоятельства, на которые оно ссылается."},{"q":"Что происходит с доказательством, которое не было раскрыто заблаговременно?","o":["Оно принимается судом автоматически","Оно получает заранее установленную силу","Оно направляется в вышестоящий суд","Лица не вправе на него ссылаться, и оно не исследуется"],"a":3,"e":"Ч. 4 ст. 65 АПК РФ: ссылаться можно только на заблаговременно раскрытые доказательства."}],"22":[{"q":"На какие виды делятся доказательства по характеру связи с обстоятельствами?","o":["Письменные и вещественные","Первоначальные и производные","Личные и вещественные","Прямые и косвенные"],"a":3,"e":"По связи с обстоятельствами доказательства делятся на прямые и косвенные."},{"q":"Что означает относимость доказательств?","o":["Доказательство имеет значение для рассматриваемого дела","Доказательство получено только в письменной форме","Доказательство подтверждено нотариусом","Доказательство имеет заранее установленную силу"],"a":0,"e":"Ст. 67 АПК РФ допускает только доказательства, относящиеся к рассматриваемому делу."},{"q":"Что означает допустимость доказательств?","o":["Доказательство относится к делу","Обстоятельства подтверждаются только определенными законом средствами","Доказательство является первоначальным","Доказательство оценено судом по внутреннему убеждению"],"a":1,"e":"Ст. 68 АПК РФ: факты, которые по закону требуют определенных доказательств, иными не подтверждаются."},{"q":"Какое правило оценки доказательств закреплено в ст. 71 АПК РФ?","o":["Письменные доказательства имеют приор сторонами."},{"q":"Что относится к презумпциям, влияющим на распределение бремени доказывания?","o":["Презумпция невиновности в административном споре","Презумпция вины причинителя вреда и добросовестности","Презумпция правоты истца","Презумпция обязательности заключения эксперта"],"a":1,"e":"К презумпциям относят вину причинителя вреда и добросовестность участников."}],"24":[{"q":"Что является добровольной формой получения доказательств?","o":["Истребование доказательств по запросу суда","Представление доказательств лицом, участвующим в деле","Осмотр по месту нахождения","Наложение судебного штрафа"],"a":1,"e":"Представление доказательств — добровольное действие, в отличие от их истребования судом."},{"q":"Когда лицо вправе ходатайствовать об истребовании доказательства?","o":["Всегда, независимо от возможности получить его само","Только после вынесения решения","Если оно не имеет возможности самостоятельно получить доказательство","Только через прокурора"],"a":2,"e":"Ч. 4 ст. 66 АПК РФ требует невозможности самостоятельно получить доказательство."},{"q":"Какое последствие наступает за неисполнение требования суда об истребовании доказательства?","o":["Автоматическое прекращение дела","Отмена обеспечительных мер","Вызов свидетеля","Наложение судебного штрафа"],"a":3,"e":"За неисполнение требования об истребовании доказательства суд налагает судебный штраф."},{"q":"Когда лица обязаны раскрыть доказательства перед другими участниками?","o":["До начала судебного заседания или в пределах срока, установленного судом","Только после оглашения решения","В день вступления решения в силу","Только по требованию противоположной стороны"],"a":0,"e":"Ч. 3 ст. 65 АПК РФ обязывает раскрыть доказательства до заседания или в срок суда."},{"q":"По какому принципу суд оценивает доказательства?","o":["По заранее установленной силе каждого вида","Только по письменным материалам","По внутреннему убеждению, всесторонне, полно и объективно","По количеству представленных доказательств"],"a":2,"e":"Ст. 71 АПК РФ требует внутреннего убеждения, всесторонности, полноты и объективности."}],"25":[{"q":"Что относится к письменным доказательствам?","o":["Только предметы, имеющие свойства, значимые для дела","Только показания свидетелей","Договоры, акты, справки, деловая корреспонденция и электронные документы","Только заключения экспертов"],"a":2,"e":"Ст. 75 АПК РФ относит к письменным доказательствам договоры, акты, справки, переписку и электронные документы."},{"q":"Когда суд может потребовать подлинник письменного доказательства?","o":["Всегда при поступлении любой копии","Только если документ составлен нотариусом","Только по инициативе прокурора","По ходатайству лица или при оспаривании копии"],"a":3,"e":"Подлинники истребуются по ходатайству, при расхождении копий или когда это требуется законом."},{"q":"Что является вещественным доказательством?","o":["Предмет, который своим видом, свойствами или местом нахождения помогает установить обстоятельства","Любой документ о сделке","Показания лица, присутствовавшего при событии","Консультация специалиста"],"a":0,"e":"Ст. 76 АПК РФ определяет вещественное доказательство через признаки предмета, значимые для дела."},{"q":"Где могут храниться вещественные доказательства?","o":["Только у истца","В суде или у хранителя, назначенного судом","Только в органах прокуратуры","У эксперта без передачи в суд"],"a":1,"e":"Ст. 77 АПК РФ предусматривает хранение вещественных доказательств в суде или у хранителя."},{"q":"Когда проводится осмотр и исследование доказательств по месту их нахождения?","o":["Всегда, без каких-либо условий","Только после вынесения решения","Только по заявлению прокурора","При невозможности или затруднительности доставки в суд"],"a":3,"e":"Ст. 78 АПК РФ допускает осмотр на месте при невозможности или затруднительности доставки."}],"26":[{"q":"Каким документом суд назначает экспертизу?","o":["Судебным приказом","Исполнительным листом","Протоколом осмотра","Определением"],"a":3,"e":"Ст. 82 АПК РФ: экспертиза назначается определением арбитражного суда."},{"q":"В каком случае суд может назначить экспертизу по своей инициативе?","o":["Если это предписано законом, предусмотрено договором или нужно для проверки заявления о фальсификации","Всегда по желанию суда без ограничений","Только при согласии обеих сторон","Только после апелляционного обжалования"],"a":0,"e":"Ст. 82 АПК РФ допускает инициативу суда в указанных законом случаях, включая проверку фальсификации."},{"q":"Что представляет собой комиссионная экспертиза?","o":["Экспертиза экспертами разных специальностей","Экспертиза двумя или более экспертами одной специальности","Повторная экспертиза другим экспертом","Консультация специалиста без заключения"],"a":1,"e":"Ст. 84 АПК РФ: комиссионная экспертиза проводится несколькими экспертами одной специальности."},{"q":"Чем комплексная экспертиза отличается от комиссионной?","o":["Проводится одним экспертом","Назначается только прокурором","Проводится экспертами разных специальностей","Не требует определения суда"],"a":2,"e":"Ст. 85 АПК РФ: комплексная экспертиза проводится экспертами разных специальностей."},{"q":"Когда назначается повторная экспертиза?","o":["При сомнениях в обоснованности заключения или противоречиях в выводах","При недостаточной ясности заключения","При неявке свидетеля в заседание","При отказе истца от иска"],"a":0,"e":"Ст. 87 АПК РФ: повторная экспертиза назначается при сомнениях в обоснованности или противоречиях."}],"27":[{"q":"С какой целью применяется обеспечение доказательств?","o":["Если есть основания опасаться, что представление доказательств станет невозможным или затруднительным","Для ускорения рассмотрения любого дела","Для замены судебного разбирательства","Для взыскания судебного штрафа"],"a":0,"e":"Ст. 72 АПК РФ связывает обеспечение доказательств с угрозой невозможности или затруднительности их представления."},{"q":"Какие способы обеспечения доказательств названы в теме?","o":["Только выемка документов","Допрос свидетеля, осмотр и экспертиза","Только назначение повторной экспертизы","Только истребование письменных доказательств"],"a":1,"e":"Обеспечение доказательств включает допрос свидетеля, осмотр и назначение экспертизы."},{"q":"В каком порядке обеспечиваются доказательства до предъявления иска?","o":["В порядке ст. 66 АПК РФ","В порядке ст. 73 АПК РФ","В порядке ст. 99 АПК РФ о предварительных мерах","В порядке ст. 120 АПК РФ"],"a":2,"e":"До подачи иска обеспечение доказательств производится в порядке ст. 99 АПК РФ."},{"q":"В какой срок должно быть выполнено судебное поручение?","o":["В течение трех дней","В течение месяца","В течение шести месяцев","Не позднее десяти дней со дня получения копии определения"],"a":3,"e":"Ч. 3 ст. 73 АПК РФ устанавливает десятидневный срок со дня получения копии определения."},{"q":"Что делает суд, выполнивший судебное поручение?","o":["Оставляет все материалы у себя до вступления решения в силу","Выносит определение и немедленно пересылает материалы суду-поручителю","Направляет материалы в прокуратуру","Возвращает поручение без исполнения"],"a":1,"e":"Ст. 74 АПК РФ: суд выносит определение и немедленно пересылает материалы суду-поручителю."}],"28":[{"q":"Каков максимальный размер судебного штрафа для гражданина?","o":["1 000 рублей","5 000 рублей","30 000 рублей","100 000 рублей"],"a":1,"e":"Ст. 119 АПК РФ ограничивает штраф для гражданина суммой 5 000 рублей."},{"q":"Каков максимальный размер судебного штрафа для должностного лица?","o":["5 000 рублей","10 000 рублей","30 000 рублей","100 000 рублей"],"a":2,"e":"Ст. 119 АПК РФ устанавливает для должностного лица предел 30 000 рублей."},{"q":"Каков максимальный размер судебного штрафа для организации?","o":["5 000 рублей","30 000 рублей","50 000 рублей","100 000 рублей"],"a":3,"e":"Ст. 119 АПК РФ ограничивает штраф для организации суммой 100 000 рублей."},{"q":"Как разрешается вопрос о наложении штрафа на лицо, присутствующее в судебном заседании?","o":["В том же судебном заседании","В отдельном заседании не ранее чем через месяц","Только после вступления решения в силу","Путем направления материалов прокурору"],"a":0,"e":"Ч. 1 ст. 120 АПК РФ: вопрос решается в том же судебном заседании."},{"q":"В какой срок обжалуется определение о наложении судебного штрафа?","o":["В течение трех дней","В течение семи дней","В течение десяти дней","В течение месяца"],"a":2,"e":"Определение о наложении судебного штрафа обжалуется в десятидневный срок."}],"29":[{"q":"Не позднее какого срока до начала судебного заседания арбитражный суд направляет копию судебного акта?","o":["За 10 дней","За 15 дней","За 20 дней","За 30 дней"],"a":1,"e":"По ст. 121 АПК РФ копия направляется не позднее чем за 15 дней до начала заседания или совершения действия."},{"q":"Что применяется, если лицо сменило адрес, но не сообщило об этом арбитражному суду?","o":["Судебный акт направляется по новому адресу","Судебный акт остаётся в деле без направления","Судебный акт считается вручённым по старому адресу","Извещение направляется по месту работы"],"a":2,"e":"По ст. 124 АПК РФ при перемене адреса без сообщения суду акт считается вручённым по прежнему адресу."},{"q":"Что из перечисленного подтверждает надлежащее извещение по ст. 123 АПК РФ?","o":["Возврат корреспонденции с отметкой организации почтовой связи","Устное сообщение секретаря суда","Публикация объявления в газете","Телефонный звонок без фиксации"],"a":0,"e":"Надлежащим извещением признаётся, в частности, возврат корреспонденции либо иные доказательства получения информации."},{"q":"Какое последствие влечёт неизвещение лица, участвующего в деле, о времени и месте заседания?","o":["Обязательный перенос заседания на 5 дней","Приостановление производства по делу","Возвращение искового заявления","Безусловное основание отмены судебного акта"],"a":3,"e":"Неизвещение является безусловным основанием для отмены принятого судебного акта."},{"q":"Как рассматривается дело при неявке лица, надлежащим образом извещённого о заседании?","o":["Заседание обязательно откладывается","Неявка не препятствует рассмотрению дела","Иск оставляется без рассмотрения","Производство прекращается"],"a":1,"e":"По ст. 156 АПК РФ неявка надлежаще извещённого лица не препятствует рассмотрению дела."}],"30":[{"q":"В какой срок судья единолично решает вопрос о принятии искового заявления к производству?","o":["15 дней","10 дней","5 дней","3 дня"],"a":2,"e":"По ст. 127 АПК РФ вопрос о принятии иска решается судьёй единолично в пятидневный срок."},{"q":"Каков общий срок рассмотрения дела арбитражным судом первой инстанции?","o":["3 месяца","6 месяцев","9 месяцев","12 месяцев"],"a":1,"e":"По ст. 152 АПК РФ дело рассматривается не более шести месяцев со дня поступления заявления."},{"q":"Как называются процессуальные сроки в зависимости от способа их установления?","o":["Законные и судебные","Материальные и процессуальные","Императивные и диспозитивные","Общие и исключительные"],"a":0,"e":"Процессуальные сроки делятся на установленные законом и назначенные судом, то есть законные и судебные."},{"q":"Кем определяется срок подготовки дела к судебному разбирательству?","o":["Пятью днями по закону","Одним месяцем","Двумя месяцами","Судьёй с учётом обстоятельств дела"],"a":3,"e":"По ст. 134 АПК РФ срок подготовки определяет судья с учётом обстоятельств конкретного дела."},{"q":"К какому моменту ответчик должен представить отзыв на исковое заявление?","o":["Только после судебного заседания","В течение пяти дней после принятия иска","В срок до судебного заседания","Отзыв не представляется"],"a":2,"e":"По ст. 131 АПК РФ отзыв представляется в срок, обеспечивающий ознакомление с ним до заседания."}],"31":[{"q":"С какого дня начинается течение процессуального срока?","o":["Со дня календарной даты или события","За день до календарной даты","Через три дня после события","На следующий день после даты или дня события"],"a":3,"e":"По ст. 113 АПК РФ течение срока начинается на следующий день после даты или дня наступления события."},{"q":"Какие дни не включаются в процессуальные сроки, исчисляемые днями?","o":["Нерабочие дни","Только государственные праздники","Все календарные дни","Дни, указанные судом дополнительно"],"a":0,"e":"По ст. 113 АПК РФ в сроки, исчисляемые днями, нерабочие дни не включаются."},{"q":"Что происходит, если последний день процессуального срока приходится на нерабочий день?","o":["Срок истекает в предшествующий рабочий день","Срок переносится на следующий рабочий день","Срок продлевается на 24 часа","Срок истекает в день заседания"],"a":1,"e":"По ст. 114 АПК РФ днём окончания срока считается первый следующий за нерабочим рабочий день."},{"q":"Что необходимо для восстановления пропущенного процессуального срока?","o":["Только уплата государственной пошлины","Согласие другой стороны","Уважительная причина и соблюдение предельного срока","Письменное ходатайство без обоснования"],"a":2,"e":"Срок восстанавливается при уважительности причин и если не истекли предельные сроки, установленные АПК РФ."},{"q":"Как продлевается процессуальный срок, назначенный арбитражным судом?","o":["После его истечения по инициативе суда","Автоматически при подаче любого заявления","Только вышестоящим судом","По заявлению лица до истечения срока"],"a":3,"e":"По ст. 118 АПК РФ назначенный судом срок продлевается по заявлению лица до его истечения."}],"32":[{"q":"Из чего состоят судебные расходы по ст. 101 АПК РФ?","o":["Из штрафов и пеней","Из государственной пошлины и судебных издержек","Из пошлины и судебных штрафов","Из расходов бюджета и издержек"],"a":1,"e":"Судебные расходы включают государственную пошлину и судебные издержки, связанные с рассмотрением дела."},{"q":"К какому виду судебных расходов относятся расходы на оплату услуг представителя?","o":["К государственной пошлине","К бюджетным платежам","К судебным издержкам","К судебным штрафам"],"a":2,"e":"По ст. 106 АПК РФ расходы на представителя входят в состав судебных издержек."},{"q":"Каким нормативным актом устанавливаются размеры государственной пошлины?","o":["Арбитражным процессуальным кодексом РФ","Гражданским кодексом РФ","Определением суда по каждому делу","Налоговым кодексом РФ"],"a":3,"e":"Размеры пошлины установлены ст. 333.21 НК РФ; АПК РФ лишь отсылает к налоговому законодательству."},{"q":"На основании какого законодательства предоставляются льготы по уплате государственной пошлины?","o":["Законодательства о налогах и сборах","Только Арбитражного процессуального кодекса","По усмотрению судьи","Законодательства о судебной системе"],"a":0,"e":"По ст. 105 АПК РФ льготы предоставляются в случаях и порядке, установленных законодательством о налогах и сборах."},{"q":"За счёт каких средств оплачивается экспертиза, назначенная по инициативе арбитражного суда?","o":["За счёт проигравшей стороны","За счёт средств федерального бюджета","За счёт обеих сторон поровну","За счёт экспертного учреждения"],"a":1,"e":"По ч. 3 ст. 109 АПК РФ экспертиза по инициативе суда оплачивается за счёт средств бюджета."}],"33":[{"q":"Как распределяются судебные расходы при частичном удовлетворении иска?","o":["Полностью на истца","Полностью на ответчика","Пропорционально размеру удовлетворённых требований","Поровну независимо от результата"],"a":2,"e":"По ч. 1 ст. 110 АПК РФ при частичном удовлетворении расходы распределяются пропорционально удовлетворённой части."},{"q":"В каких пределах взыскиваются расходы на оплату услуг представителя?","o":["В разумных пределах","Всегда в полном объёме","Не взыскиваются вообще","Только по установленной государством таксе"],"a":0,"e":"По ч. 2 ст. 110 АПК РФ расходы на представителя взыскиваются с другого лица в разумных пределах."},{"q":"Куда взыскивается государственная пошлина, от уплаты которой истец был освобождён?","o":["Истцу","Никуда, она не взыскивается","Представителю ответчика","С ответчика в доход федерального бюджета"],"a":3,"e":"По ч. 3 ст. 110 АПК РФ пошлина, от которой истец освобождён, взыскивается с ответчика в бюджет."},{"q":"Как распределяются расходы, если спор возник из-за нарушения дос  возможно, либо для предотвращения значительного ущерба."},{"q":"Что из перечисленного является обеспечительной мерой по ст. 91 АПК РФ?","o":["Изъятие имущества в доход государства","Лишение права занимать должность","Выселение из жилого помещения","Арест денежных средств ответчика"],"a":3,"e":"Ст. 91 АПК РФ относит к обеспечительным мерам наложение ареста на денежные средства или иное имущество."},{"q":"В каком порядке рассматривается заявление об обеспечении иска?","o":["Коллегиально с извещением сторон через 10 дней","Единолично не позднее следующего дня без извещения сторон","Только после предварительного заседания","Обязательно с участием прокурора"],"a":1,"e":"По ч. 1.1 ст. 93 АПК РФ судья рассматривает заявление единолично не позднее следующего дня без извещения сторон."},{"q":"Когда подлежит исполнению определение об обеспечении иска?","o":["Немедленно","После вступления решения в законную силу","Через 10 дней после вынесения","После рассмотрения апелляционной жалобы"],"a":0,"e":"По ст. 96 АПК РФ определение об обеспечении иска подлежит немедленному исполнению."}],"37":[{"q":"Для чего применяется встречное обеспечение по ст. 94 АПК РФ?","o":["Для ускорения рассмотрения дела","Для возмещения возможных убытков ответчика от обеспечительных мер","Для замены государственной пошлины","Для обжалования решения суда"],"a":1,"e":"Встречное обеспечение гарантирует возмещение возможных для ответчика убытков, вызванных обеспечительными мерами."},{"q":"Кто может инициировать вопрос о встречном обеспечении?","o":["Только прокурор","Только истец","Только вышестоящий суд","Ответчик ходатайством либо суд по собственной инициативе"],"a":3,"e":"По ст. 94 АПК РФ суд требует встречное обеспечение по ходатайству ответчика или предлагает его по своей инициативе."},{"q":"Какая форма встречного обеспечения прямо названа в ст. 94 АПК РФ?","o":["Депозит суда, банковская гарантия или поручительство","Только передача недвижимости","Только залог автомобиля","Только устное обещание ответчика"],"a":0,"e":"Ст. 94 АПК РФ допускает внесение средств на депозит, банковскую гарантию, поручительство или иное финансовое обеспечение."},{"q":"Каким может быть минимальный размер встречного обеспечения?","o":["Не менее четверти требований","Не менее суммы госпошлины","Не менее половины имущественных требований","Не менее полной суммы иска"],"a":2,"e":"По ст. 94 АПК РФ размер не может быть менее половины размера имущественных требований истца."},{"q":"Какой максимальный срок предоставления встречного обеспечения устанавливается судом?","o":["5 дней","15 дней","30 дней","60 дней"],"a":1,"e":"По ч. 3 ст. 94 АПК РФ срок предоставления встречного обеспечения не может превышать 15 дней."}],"38":[{"q":"Когда могут быть приняты предварительные обеспечительные меры?","o":["Только после вынесения решения","Только в апелляционной инстанции","До предъявления иска","Только после отмены обеспечительных мер"],"a":2,"e":"По ст. 99 АПК РФ предварительные меры принимаются до предъявления иска для защиты имущественных интересов."},{"q":"По какому месту подаётся заявление о предварительных обеспечительных мерах?","o":["Только по месту нахождения ответчика","По адресу заявителя, месту имущества или месту нарушения прав","Только по месту нахождения суда апелляционной инстанции","По месту заключения договора"],"a":1,"e":"Ст. 99 АПК РФ допускает подачу по адресу заявителя, месту нахождения имущества либо месту нарушения прав."},{"q":"Для кого закон делает исключение из требования о встречном обеспечении предварительных мер?","o":["Для индивидуальных предпринимателей","Для прокурора","Для государственных органов","Для Банка России"],"a":3,"e":"По ст. 99 АПК РФ встречное обеспечение обязательно, кроме случаев с Банком России."},{"q":"В какой срок после вынесения определения заявитель должен подать иск при предварительных мерах?","o":["Не позднее 15 дней","Не позднее 5 дней","Не позднее 30 дней","Не позднее 10 дней"],"a":0,"e":"Ст. 99 АПК РФ устанавливает срок подачи иска до 15 дней; при д /* ===== STUDY DATA END ===== */
function studyState(){
  if(!state.study) state.study = {topics:{}, all:{}};
  if(!state.study.topics) state.study.topics = {};
  if(!state.study.all) state.study.all = {};
  return state.study;
}
function topicStat(n){
  const t = studyState().topics[n];
  return t || {seen:0, ok:0, best:0, tries:0};
}
function studyStats(){
  const st = studyState();
  let seen = 0, ok = 0, sum = 0, tries = 0;
  for(let n=1;n<=STUDY_TOPICS.length;n++){
    const t = st.topics[n];
    if(!t) continue;
    if(t.seen) seen++;
    if(t.ok){ ok++; sum += t.best || 0; }
    tries += t.tries || 0;
  }
  return {seen, ok, total:STUDY_TOPICS.length, avg: ok ? Math.round(sum/ok) : 0, tries,
          allBest: st.all.best || 0, allTries: st.all.tries || 0};
}
function viewStudy(){
  const s = studyStats();
  const st = studyState();
  const rows = STUDY_TOPICS.map(t => {
    const x = topicStat(t.n);
    const cls = x.ok ? ' ok' : (x.seen ? ' done' : '');
    const badge = x.ok ? '✓ ' + x.best + '%' : (x.tries ? x.best + '%' : '—');
    const sub = x.tries ? `тест: ${x.best}% · попыток: ${x.tries}` : (x.seen ? 'теория прочитана' : 'не начато');
    return `<div class="strow${cls}" data-act="study-open" data-n="${t.n}">
      <div class="stnum">${t.n}</div>
      <div class="stmain"><b>${escapeHtml(t.title)}</b><span>${sub}</span></div>
      <div class="stbadge">${badge}</div>
    </div>`;
  }).join('');

  const pct = Math.round(s.ok / s.total * 100);
  return `
  <div class="hero dark" style="margin-top:18px">
    <div class="hero-top">
      <span class="eyebrow">Арбитражный процесс</span>
      <span class="pill">${s.total} вопросов</span>
    </div>
    <h2>Подготовка к зачету</h2>
    <p>К каждому вопросу — развёрнутый ответ, краткий каркас, нормы АПК и тест. Пройди тест по всем вопросам, чтобы проверить себя целиком.</p>
    <button class="btn btn-lime" data-act="quiz-all">
      <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><path d="M20 12a8 8 0 1 1-4.6-7.2"/></svg>
      Тест по всем вопросам
    </button>
  </div>

  <div class="sec-title">Прогресс</div>
  <div class="card">
    <div class="stats" style="grid-template-columns:1fr 1fr 1fr">
      <div class="stat"><b>${s.ok}<span style="display:inline;color:var(--muted);font-size:13px">/${s.total}</span></b><span>вопросов сдано</span></div>
      <div class="stat"><b>${s.avg ? s.avg + '%' : '—'}</b><span>средний балл</span></div>
      <div class="stat"><b>${s.allBest ? s.allBest + '%' : '—'}</b><span>общий тест</span></div>
    </div>
    <div class="progbar" style="margin-top:14px"><i style="width:${pct}%"></i></div>
    <div class="small muted" style="margin-top:8px">Сдано ${s.ok} из ${s.total} вопросов · тестов пройдено: ${s.tries + s.allTries}</div>
  </div>

  <div class="sec-title">Вопросы к зачету</div>
  <div class="sched">${rows}</div>
  `;
}

let ST = null;
function openStudy(n){
  const t = STUDY_TOPICS[n-1];
  if(!t) return;
  ST = n;
  const x = topicStat(n);
  if(!x.seen){
    const st = studyState();
    st.topics[n] = {...x, seen:1};
    save();
  }
  renderStudyTopic();
  $('#study').classList.add('open');
  $('#stBody').scrollTop = 0;
}
function renderStudyTopic(){
  if(!ST) return;
  const t = STUDY_TOPICS[ST-1];
  const x = topicStat(ST);
  $('#stTitle').firstChild.textContent = 'Вопрос ' + t.n;

  $('#stFoot').innerHTML = `

    </div>`;
}

/* ---------- тесты ---------- */
let QZ = null;
function shuffleArr(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t = r[i]; r[i] = r[j]; r[j] = t; }
  return r;
}
function quizTopicList(n){
  return shuffleArr((STUDY_QUIZ[n] || []).map(x=>({...x, topic:n})));
}
function quizAllList(){
  const all = [];
  Object.keys(STUDY_QUIZ).forEach(k => (STUDY_QUIZ[k] || []).forEach(x => all.push({...x, topic:+k})));
  return shuffleArr(all).slice(0, 20);
}
function startQuiz(mode, n){
  const list = mode === 'all' ? quizAllList() : quizTopicList(n);
  if(!list.length){ toast('Тест по этому вопросу ещё не готов'); return; }
  QZ = {list, i:0, res:[], mode, topic:n || 0};
  $('#quiz').classList.add('open');
  renderQuiz();
}
function renderQuiz(){
  if(!QZ) return;
  const q = QZ.list[QZ.i];
  const answered = QZ.res[QZ.i] !== undefined;
  const total = QZ.list.length;
  $('#qzTitle').firstChild.textContent = QZ.mode === 'all' ? 'Общий тест' : 'Тест по вопросу';
  $('#qzSub').textContent = 'Вопрос ' + (QZ.i+1) + ' из ' + total;
  $('#qzBar').style.width = (QZ.res.length / total * 100) + '%';
  const opts = q.o.map((o,i)=>{
    let cls = 'qopt';
    if(answered){
      if(i === q.a) cls += ' ok';
      else if(i === QZ.res[QZ.i].pick) cls += ' bad';
    }
    return `<button class="${cls}" data-act="quiz-answer" data-i="${i}" ${answered?'disabled':''}><span class="qmark">${'ABCD'[i]}</span>${o}</button>`;
  }).join('');
  let fb = '';
  if(answered){
    const ok = QZ.res[QZ.i].ok;
    fb = `<div class="note">${ok ? '<b>Верно.</b> ' : '<b>Неверно.</b> Правильный ответ: ' + q.o[q.a] + '. '}${q.e || ''}</div>`;
  }
  $('#qzBody').innerHTML = `
    <div class="wcard">
      <span class="chip">${QZ.mode === 'all' ? 'Вопрос ' + q.topic : 'Вопрос ' + QZ.topic}</span>
      <div class="qtext">${q.q}</div>
      ${opts}
      ${fb}
    </div>`;
  $('#qzFoot').innerHTML = answered
    ? `<button class="btn btn-lime" data-act="quiz-next">${QZ.i+1 >= total ? 'Показать результат' : 'Следующий вопрос'}</button>`
    : `<button class="btn btn-ghost" disabled style="opacity:.5">Выбери ответ</button>`;
}
function quizAnswer(i){
  if(!QZ || QZ.res[QZ.i] !== undefined) return;
  const q = QZ.list[QZ.i];
  QZ.res[QZ.i] = {ok: i === q.a, pick:i};
  renderQuiz();
  if(navigator.vibrate) try{ navigator.vibrate(QZ.res[QZ.i].ok ? 18 : [22,60,22]); }catch(e){}
}
function quizNext(){
  if(!QZ) return;
  if(QZ.i+1 >= QZ.list.length){ finishQuiz(); return; }
  QZ.i++;
  renderQuiz();
  $('#qzBody').scrollTop = 0;
}
function quizScoreMsg(pct){
  if(pct >= 90) return 'Отлично. Материал знаете — на зачет можно идти спокойно.';
  if(pct >= 70) return 'Хорошо. Ошибки внизу — пройдите по ним теорию ещё раз.';
  if(pct >= 50) return 'Пока средне. Перечитайте теория по ошибкам и пройдите тест ещё раз.';
  return 'Пока слабо. Лучше пройти тесты по отдельным вопросам — так проще понять, что выучить.';
}
function finishQuiz(){
  const correct = QZ.res.filter(r=>r.ok).length;
  const total = QZ.list.length;
  const pct = Math.round(correct/total*100);
  const st = studyState();
  const now = Date.now();
  if(QZ.mode === 'all'){
    st.all.best = Math.max(st.all.best || 0, pct);
    st.all.tries = (st.all.tries || 0) + 1;
    st.all.last = now;
  } else {
    const n = QZ.topic;
    const t = st.topics[n] || {seen:1, ok:0, best:0, tries:0};
    t.best = Math.max(t.best || 0, pct);
    t.tries = (t.tries || 0) + 1;
    t.last = now;
    if(pct >= 60) t.ok = 1;
    st.topics[n] = t;
  }
  save();
  const wrong = [];
  QZ.list.forEach((q,i)=>{ if(QZ.res[i] && !QZ.res[i].ok) wrong.push({q, pick:QZ.res[i].pick}); });
  $('#qzSub').textContent = 'Результат';
  $('#qzBar').style.width = '100%';
  $('#qzBody').innerHTML = `
    <div class="wcard" style="text-align:center">
      <div class="qres">${pct}%</div>
      <div class="small muted" style="margin-top:4px">${correct} из ${total} правильно</div>
      <div class="note" style="text-align:left">${quizScoreMsg(pct)}</div>
    </div>
    ${wrong.length ? `<div class="sec-title">Ошибки — повторить</div>
      <div class="sched">${wrong.map(w=>`
        <div class="wcard" style="margin-bottom:8px">
          <span class="chip">Вопрос ${w.q.topic}</span>
          <div style="font-size:14px;font-weight:600;margin:10px 0 6px">${w.q.q}</div>
          <div class="small muted">Твой ответ: ${w.q.o[w.pick]}</div>
          <div class="small" style="color:var(--accent);margin-top:4px">Правильно: ${w.q.o[w.q.a]}</div>
          ${w.q.e ? `<div class="small muted" style="margin-top:6px">${w.q.e}</div>` : ''}
          <button class="btn btn-ghost btn-sm" style="margin-top:10px" data-act="study-open" data-n="${w.q.topic}">Открыть теорию</button>
        </div>`).join('')}</div>` : `<div class="note" style="margin-top:12px">Без ошибок. Отличная работа.</div>`}`;
  $('#qzFoot').innerHTML = `
    <div class="row2">
      <button class="btn btn-ghost" data-act="quiz-again">Ещё раз</button>
      <button class="btn btn-lime" data-act="quiz-home">К списку</button>
    </div>`;
}
function closeQuiz(){ $('#quiz').classList.remove('open'); QZ = null; render(); }

const AI_STORE = 'form_ai_key';
const AI_MODELS = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest'];
let aiReturnTo = 'settings';

function aiKey(){ return String(lsGet(AI_STORE) || '').trim(); }
function aiSetKey(k){ if(k) lsSet(AI_STORE, String(k).trim()); else { try{ localStorage.removeItem(AI_STORE); }catch(e){} } }

const AI_PROMPT = `Ты нутрициолог. На фото — еда. Определи блюдо и оцени КБЖУ всей порции, которая видна.

Правила:
- Если на тарелке несколько продуктов — назови блюдо одним названием и посчитай сумму по всей порции.
- Вес оценивай в граммах по размеру тарелки, приборов и порции. Это готовая еда, не сухие продукты.
- Масло, соус, сахар, майонез, если их не видно, но они обычно есть — учитывай типичное количество и укажи это в note.
- Все цифры — на всю порцию, а не на 100 грамм.
- Название по-русски, коротко, до 40 символов.
- note — одна короткая фраза о допущениях (что принял за вес, что не видно).`;

const AI_SCHEMA = {
  type: 'OBJECT',
  properties: {
    name: { type: 'STRING' },
    grams: { type: 'NUMBER' },
    kcal: { type: 'NUMBER' },
    protein: { type: 'NUMBER' },
    fat: { type: 'NUMBER' },
    carbs: { type: 'NUMBER' },
    note: { type: 'STRING' }
  },
  required: ['name', 'grams', 'kcal', 'protein', 'fat', 'carbs']
};

function fileToJpeg(file, maxSide = 1000){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/jpeg', 0.82).split(',')[1];
        URL.revokeObjectURL(url);
        resolve({ data, mime: 'image/jpeg', preview: 'data:image/jpeg;base64,' + data });
      }catch(err){ URL.revokeObjectURL(url); reject(err); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

async function aiRecognize(file){
  if(!aiKey()){ aiKeySheet('Сначала подключи бесплатный ключ — это один раз.', 'food'); return; }
  const st = document.getElementById('aiStatus');
  const say = (txt, cls) => {
    if(!st) return;
    st.style.display = '';
    st.className = 'note' + (cls ? ' ' + cls : '');
    st.innerHTML = txt;
  };
  say('Смотрю фото… обычно 3–8 секунд.');
  let img;
  try{ img = await fileToJpeg(file); }
  catch(e){ say('Не получилось прочитать фото. Попробуй снять ещё раз или введи вручную.'); return; }

  const body = {
    contents: [{ role: 'user', parts: [{ text: AI_PROMPT }, { inline_data: { mime_type: img.mime, data: img.data } }] }],
    generationConfig: { temperature: 0.2, responseMimeType: 'application/json', responseSchema: AI_SCHEMA }
  };
  let lastErr = '';
  for(const model of AI_MODELS){
    let r;
    try{
      r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(aiKey()), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      });
    }catch(e){ lastErr = 'net'; continue; }
    const txt = await r.text();
    if(r.ok){
      try{
        const j = JSON.parse(txt);
        const raw = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0] && j.candidates[0].content.parts[0].text;
        if(!raw) throw new Error('empty');
        const data = JSON.parse(String(raw).replace(/^```(?:json)?/i, '').replace(/```$/, '').trim());
        fillFoodForm(data, img.preview);
        return;
      }catch(e){ lastErr = 'parse'; }
    } else if(r.status === 400 && /API key not valid|API_KEY_INVALID/i.test(txt)){ lastErr = 'badkey'; break; }
    else if(r.status === 429){ lastErr = 'limit'; break; }
    else if(r.status === 403){ lastErr = 'denied'; break; }
    else { lastErr = 'http' + r.status; }
  }
  const msg = lastErr === 'badkey' ? 'Ключ не подошёл. Проверь его в настройках.'
    : lastErr === 'limit' ? 'Бесплатный лимит запросов исчерпан. Попробуй позже или введи вручную.'
    : lastErr === 'denied' ? 'Google не пустил запрос с этим ключом. Проверь ключ в настройках.'
    : lastErr === 'net' ? 'Нет связи с сервисом распознавания. Проверь интернет.'
    : 'Не получилось распознать. Попробуй другое фото или введи вручную.';
  say(msg);
}

const OWNER_LOGIN = 'vargonik';

function showAuth(){
  const el = $('#auth');
  el.classList.add('on');
  el.scrollTop = 0;
  $('#aErr').textContent = '';
  $('#aLogin').value = '';

function hideAuth(){ $('#auth').classList.remove('on'); }

/* Если под vargonik прогресса ещё нет — забираем самый полный
   из старых локальных аккаунтов, чтобы ничего не потерялось. */
function seedLegacyState(){
  let best = null, bestScore = -1;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('form_data_') !== 0) continue;
      const login = k.slice(10);
      if(login === OWNER_LOGIN) continue;
      try{
        const s = normalize(JSON.parse(localStorage.getItem(k)));
        const score = (s.sessions||[]).length * 1e9 +
          Object.keys(s.days||{}).length * 1e6 +
          ((s.rev || 0) % 1e6) / 1e6;
        if(score > bestScore){ bestScore = score; best = s; }
      }catch(e){}
    }
  }catch(e){}
  if(!best){
    try{ const legacy = lsGet(LS_KEY); if(legacy) best = normalize(JSON.parse(legacy)); }catch(e){}
  }
  return best || defaultState();
}

function loginAsOwner(){
  const stored = lsGet(userKey(OWNER_LOGIN));
  currentUser = OWNER_LOGIN;
  if(stored){
    state = loadStateFor(OWNER_LOGIN);
  } else {
    state = seedLegacyState();
    saveLocal0();   // rev не трогаем: если в облаке есть свежее, оно победит
  }
  setSession(OWNER_LOGIN);
  const users = getUsers();
  users[OWNER_LOGIN] = users[OWNER_LOGIN] || {owner:true, created:Date.now()};
  setUsers(users);
  setAcct(OWNER_LOGIN, users[OWNER_LOGIN]);
  hideAuth();
  render();
  scheduleReminder();
  syncNow(true);
}

function doAuth(){
  const login = ($('#aLogin').value || '').trim().toLowerCase();

  const first = !lsGet(userKey(OWNER_LOGIN));
  loginAsOwner();

}

const SITE_BASE = (location.protocol === 'https:' || location.protocol === 'http:')
  ? location.origin + location.pathname.replace(/[^/]*$/, '')
  : '';
const ICS_HOSTED = SITE_BASE ? SITE_BASE + 'trenirovki.ics' : '';

function subscribeCalendar(){
  if(!ICS_HOSTED){

    return;
  }

function nextDateForDow(dow){
  const d = new Date(); d.setHours(0,0,0,0);
  const diff = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d;
}
function fmtICS(d){
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function exportICS(){
  const s = state.settings;
  const rows = [
    {dow:1, id:'upperA', time:s.weekdayTime},
    {dow:3, id:'lowerA', time:s.weekdayTime},
    {dow:5, id:'upperB', time:s.weekdayTime},
    {dow:0, id:'lowerB', time:s.weekendTime}
  ];
  const codes = ['SU','MO','TU','WE','TH','FR','SA'];
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Form//Training//RU\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Тренировки\r\n';
  rows.forEach(r=>{
    const p = PROGRAMS[r.id];
    const list = exList(p).filter(e => !e.id.startsWith('w-'));
    const d = nextDateForDow(r.dow);
    const [hh, mm] = r.time.split(':').map(Number);
    d.setHours(hh, mm, 0, 0);
    const end = new Date(d.getTime() + 60*60000);
    const desc = list.map((e,i)=>`${i+1}. ${e.name} — ${e.sets}×${e.reps}`).join('\\n');
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:${r.id}-${r.dow}@form-app\r\n`;
    ics += `DTSTAMP:${stamp}\r\n`;
    ics += `DTSTART:${fmtICS(d)}\r\n`;
    ics += `DTEND:${fmtICS(end)}\r\n`;
    ics += `RRULE:FREQ=WEEKLY;BYDAY=${codes[r.dow]}\r\n`;
    ics += `SUMMARY:Тренировка · ${p.name}\r\n`;
    ics += `DESCRIPTION:${desc}\r\n`;
    ics += 'LOCATION:Дом\r\n';
    ics += 'BEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:Тренировка через 15 минут\r\nEND:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trenirovki.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Файл календаря скачан');
}

/* ============================================================
   УСТАНОВКА НА IPHONE
   ============================================================ */
function isStandalone(){
  return window.navigator.standalone === true ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
}
function isIOS(){
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function installHelp(){
  closeSheet();
  openSheet(`
    <div class="grab"></div>
    <h3>На главный экран</h3>
    <p class="sub">iPhone, Safari. Делается один раз — дальше как обычное приложение.</p>
    <ol class="steps">
      <li><b>Открой сайт в Safari.</b> Не в Chrome и не в Instagram — там этой функции нет.</li>
      <li><b>Нажми «Поделиться».</b> Квадрат со стрелкой вверх внизу по центру.</li>
      <li><b>Выбери «На главный экран».</b> Прокрути список вниз, если не видно сразу.</li>
      <li><b>Нажми «Добавить».</b> Иконка появится на рабочем столе.</li>
    </ol>
    <div class="note">Запускай приложение с этой иконки. Тогда Safari не чистит данные сайта, и логин с прогрессом остаются на месте — регистрироваться заново не придётся.</div>

function maybePromptInstall(){

  if(!isIOS()) return;
  lsSet('form_install_hint', 'done');
  setTimeout(() => {
    toast('Поставь приложение на главный экран: «Поделиться» → «На главный экран»');
  }, 3500);
}

/* ============================================================
   НАПОМИНАНИЯ
   ============================================================ */
let remTimers = [];

function planTimeOf(plan){
  return plan.slot === 'weekday' ? state.settings.weekdayTime : state.settings.weekendTime;
}
function todayPlanId(){
  const p = WEEK_PLAN[new Date().getDay()];
  return p ? p.id : null;
}
function scheduleReminder(){
  remTimers.forEach(clearTimeout);
  remTimers = [];
  if(!state.settings.remind) return;
  const now = Date.now();
  for(let k=0;k<8;k++){
    const d = new Date();
    d.setDate(d.getDate() + k);
    const plan = WEEK_PLAN[d.getDay()];
    if(!plan) continue;
    const [h, m] = String(planTimeOf(plan)).split(':').map(Number);
    if(!isFinite(h)) continue;
    d.setHours(h, m || 0, 0, 0);
    const at = d.getTime();
    const delay = (at - 15*60000) - now;
    if(delay > 1000 && delay < 8*864e5){
      remTimers.push(setTimeout(() => fireReminder(at, plan.id), delay));
    }
  }
}
function fireReminder(at, progId){
  const prog = programById(progId);
  if(!prog) return;
  const d = new Date(at);
  const when = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const title = 'Через 15 минут тренировка';
  const body = `${prog.name} · ${when}`;
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification(title, {
        body: `${body}. ${prog.focus}`,
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'form-training',
        renotify: true
      });
      n.onclick = () => { try{ window.focus(); }catch(e){} startWorkout(progId); n.close(); };
    }catch(e){}
  }
  showRemindBanner(title, body, progId);
}
function showRemindBanner(title, body, progId){
  const el = $('#remind');
  if(!el) return;
  $('#remindTitle').textContent = title;
  $('#remindBody').textContent = body;
  const btn = $('#remindStart');
  btn.dataset.prog = progId || '';
  el.classList.add('on');
  beep(720, .08);
}
function hideRemindBanner(){ const el = $('#remind'); if(el) el.classList.remove('on'); }
function askNotifications(){
  if(!('Notification' in window)){ toast('Уведомления недоступны — включи подписку на календарь'); return; }
  Notification.requestPermission().then(p => {
    state.settings.remind = p === 'granted';
    save();
    if(state.settings.remind){ scheduleReminder(); toast('Напоминания включены'); }
    else toast('Разрешение не выдано');
    if($('#sheet').classList.contains('open')) settingsSheet();
  }).catch(()=>{});
}

/* ============================================================
   TOAST
   ============================================================ */
let toastT = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('on'), 2400);
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'tab'){
    state.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0);
  }
  else if(act === 'settings'){ settingsSheet(); }
  else if(act === 'close-sheet'){ closeSheet(); }
  else if(act === 'start'){ closeSheet(); startWorkout(el.dataset.prog); }
  else if(act === 'pick-program'){ pickProgramSheet(); }
  else if(act === 'close-workout'){ if(confirmLeave()) closeWorkout(); }
  else if(act === 'sched-full'){ openSchedule(); }
  else if(act === 'study-open'){
    const n = +el.dataset.n;
    if(n){ closeQuiz(); openStudy(n); }
  }
  else if(act === 'study-close'){ closeStudy(); }
  else if(act === 'study-mark'){
    const n = +el.dataset.n;
    const st = studyState();
    const t = st.topics[n] || {seen:1, ok:0, best:0, tries:0};
    t.ok = t.ok ? 0 : 1;
    st.topics[n] = t;
    save(); renderStudyTopic(); render();
    toast(t.ok ? 'Отмечено как изученное' : 'Отметка снята');
  }
  else if(act === 'quiz-topic'){ startQuiz('topic', +el.dataset.n); }
  else if(act === 'quiz-all'){ startQuiz('all'); }
  else if(act === 'quiz-answer'){ quizAnswer(+el.dataset.i); }
  else if(act === 'quiz-next'){ quizNext(); }
  else if(act === 'quiz-again'){ startQuiz(QZ.mode, QZ.topic); }
  else if(act === 'quiz-home'){ closeQuiz(); state.tab = 'study'; save(); render(); window.scrollTo(0,0); }
  else if(act === 'quiz-close'){ closeQuiz(); }
  else if(act === 'sched-close'){ closeSchedule(); }
  else if(act === 'sched-prev'){ if(SV.week > 1){ SV.week--; renderSched(); $('#scBody').scrollTop = 0; } }
  else if(act === 'sched-next'){ if(SV.week < SD_MAX){ SV.week++; renderSched(); $('#scBody').scrollTop = 0; } }
  else if(act === 'sched-mode'){
    SV.mode = SV.mode === 'all' ? 'week' : 'all';
    renderSched(); $('#scBody').scrollTop = 0;
  }
  else if(act === 'start-set'){ startSet(); }
  else if(act === 'end-set'){ endSet(); }
  else if(act === 'rest-skip'){ endRest(); }
  else if(act === 'rest-15'){
    const v = +(el.dataset.v || 15);
    W.restEnd += v*1000;
    W.restTotal = Math.max(W.restTotal, (W.restEnd - Date.now())/1000);
    updateRest();
  }
  else if(act === 'save-session'){ saveSession(); }
  else if(act === 'add-food'){ foodSheet(); }
  else if(act === 'ai-photo'){
    if(!aiKey()){ aiKeySheet('Сначала подключи бесплатный ключ — это один раз.', 'food'); return; }
    const f = document.getElementById('aiFile');
    if(f) f.click();
  }
  else if(act === 'ai-key'){ aiKeySheet('', 'settings'); }
  else if(act === 'ai-key-save'){ aiKeySave(); }
  else if(act === 'ai-key-del'){
    aiSetKey('');
    closeSheet();
    toast('Ключ удалён');
    if(aiReturnTo === 'food') foodSheet(); else settingsSheet();
  }
  else if(act === 'quick-food'){
    const f = FOODS[+el.dataset.i];
    if(!f) return;
    const nameEl = $('#fName');
    if(nameEl.value.trim()){
      nameEl.value = nameEl.value + ' + ' + f.n;
      $('#fK').value = ((+$('#fK').value||0) + f.k).toFixed(0);
      $('#fP').value = ((+$('#fP').value||0) + f.p).toFixed(1);
      $('#fF').value = ((+$('#fF').value||0) + f.f).toFixed(1);
      $('#fC').value = ((+$('#fC').value||0) + f.c).toFixed(1);
    } else {
      nameEl.value = f.n;
      $('#fK').value = f.k; $('#fP').value = f.p; $('#fF').value = f.f; $('#fC').value = f.c;
    }
    el.style.background = 'rgba(205,255,77,.18)';
  }
  else if(act === 'save-food'){ saveFood(); }
  else if(act === 'del-meal'){
    const d = dayData();
    d.meals.splice(+el.dataset.i, 1);
    save(); render();
  }
  else if(act === 'water'){
    const d = dayData();
    const i = +el.dataset.i;
    d.water = (d.water === i+1) ? i : i+1;
    save(); render();
  }
  else if(act === 'toggle-sound'){
    state.settings.sound = !state.settings.sound;
    save();
    el.classList.toggle('on', state.settings.sound);
    if(state.settings.sound) beep(880,.08);
  }
  else if(act === 'toggle-diagrams'){
    state.settings.diagrams = state.settings.diagrams === false;
    save();
    el.classList.toggle('on', state.settings.diagrams !== false);
    if(W) renderW();
    toast(state.settings.diagrams !== false ? 'Фото включены' : 'Фото скрыты');
  }
  else if(act === 'toggle-viz'){
    state.settings.diagrams = !(state.settings.diagrams !== false);
    save(); renderW();
  }
  else if(act === 'zoom-photo'){ zoomPhoto(el.dataset.src); }
  else if(act === 'export-ics'){ exportICS(); }
  else if(act === 'sync-now'){
    syncNow();
    setTimeout(() => toast(cloudState === 'ok' ? 'Синхронизировано с облаком' : cloudLabel()), 900);
  }
  else if(act === 'subscribe-ics'){ subscribeCalendar(); }
  else if(act === 'install-help'){ installHelp(); }
  else if(act === 'toggle-remind'){
    if(!state.settings.remind){ askNotifications(); }
    else {
      state.settings.remind = false;
      save(); scheduleReminder();
      el.classList.remove('on');
      toast('Напоминания выключены');
    }
  }
  else if(act === 'remind-start'){
    hideRemindBanner();
    const prog = el.dataset.prog || (todayPlanId() || 'upperA');
    closeSheet(); startWorkout(prog);
  }
  else if(act === 'remind-close'){ hideRemindBanner(); }
  else if(act === 'backup-save'){ exportBackup(); }
  else if(act === 'backup-load'){ $('#impFile').click(); }
  else if(act === 'auth-submit'){ doAuth(); }
  else if(act === 'logout'){ logout(); }
  else if(act === 'reset-study'){
    if(confirm('Сбросить прогресс подготовки к учебе: отметки, баллы и попытки?')){
      state.study = {topics:{}, all:{}};
      save(); closeSheet(); render(); toast('Прогресс подготовки сброшен');
    }
  }
  else if(act === 'reset-day'){
    state.days[dateKey()] = {meals:[], water:0};
    save(); closeSheet(); render(); toast('Питание за сегодня очищено');
  }
  else if(act === 'reset-all'){
    if(confirm('Удалить мои тренировки, питание и настройки? Аккаунт останется.')){
      state = defaultState();
      save(); closeSheet(); render(); toast('Прогресс сброшен');
    }
  }
});

function confirmLeave(){
  if(!W) return true;
  if(W.phase === 'done') return true;
  return confirm('Прервать тренировку? Прогресс этой сессии не сохранится.');
}

document.addEventListener('change', e=>{
  const id = e.target.id;
  if(id === 'sWeekday' || id === 'sWeekend'){
    const v = e.target.value;
    if(!v) return;
    if(id === 'sWeekday') state.settings.weekdayTime = v; else state.settings.weekendTime = v;
    save(); render(); scheduleReminder(); toast('Время сохранено');
  }
  if(['tK','tP','tF','tC'].includes(id)){
    const map = {tK:'kcal', tP:'p', tF:'f', tC:'c'};
    state.targets[map[id]] = Math.max(0, +e.target.value || 0);
    save(); render();
  }
  if(id === 'sBW'){
    const v = +e.target.value;
    state.settings.bodyweight = (v > 35 && v < 220) ? v : 74;
    save(); render(); toast('Вес сохранён');
  }
});

$('#backdrop').addEventListener('click', closeSheet);
$('#lbx').addEventListener('click', e => e.currentTarget.classList.remove('on'));
const loginInput = document.getElementById('aLogin');
if(loginInput) loginInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doAuth(); } });
document.addEventListener('change', e=>{
  if(e.target.id === 'impFile' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
  if(e.target.id === 'aiFile' && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    e.target.value = '';
    aiRecognize(file);
  }
});

/* boot */
(function boot(){
  const sess = (lsGet(SESSION_KEY) || cookieGet('form_session') || '').toLowerCase();
  if(sess === OWNER_LOGIN){
    currentUser = OWNER_LOGIN;
    state = loadStateFor(OWNER_LOGIN);
    setSession(OWNER_LOGIN);
    hideAuth();
    syncNow(true);
  } else {
    showAuth();
    if(!storageWorks()){
      const e = $('#aErr');
      if(e) e.textContent = 'Браузер запрещает сохранение данных. Открой сайт не в приватном режиме.';
    }
  }
  render();
  scheduleReminder();
  maybePromptInstall();

  // таймеры браузер замораживает в фоне — после возврата пересчитываем
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') scheduleReminder();
  });

  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>

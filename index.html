троля в отношении третейских судов (ст. 31), и дела о признании и приведении в исполнение решений иностранных судов (ст. 32);","7) дела о защите прав и законных интересов группы лиц (гл. 28.2 АПК), о компенсации за нарушение права на судопроизводство в разумный срок (гл. 27.1).","Споры, не относящиеся к компетенции арбитражных судов, рассматриваются судами общей юрисдикции или иными органами; при ошибке суд возвращает заявление (ст. 129 АПК). Разграничение с судами общей юрисдикции проводится по субъектному составу и характеру правоотношений. Стороны вправе передать часть споров на рассмотрение третейского суда (ст. 33 АПК), за исключением споров, прямо отнесённых законом к исключительной компетенции арбитражных судов."],"learn":["Ст. 27 АПК — общая компетенция; критерии: субъект + экономический характер.","Ст. 28 — гражданско-правовые; ст. 29 — публичные; ст. 30 — установление фактов.","Банкротство — ст. 27, 223 АПК и ФЗ № 127-ФЗ; корпоративные — ст. 225.1.","Ст. 31–32 — третейские и иностранные решения; гл. 28.2 — групповые иски.","Ст. 33 — арбитрабельность споров, передаваемых в третейский суд."],"norms":["Ст. 27 АПК РФ. «1. Арбитражный суд рассматривает дела по экономическим спорам и другие дела, связанные с осуществлением предпринимательской и иной экономической деятельности. 2. Арбитражные суды разрешают экономические споры и рассматривают иные дела с участием организаций, являющихся юридическими лицами, граждан, осуществляющих предпринимательскую деятельность без образования юридического лица и имеющих статус индивидуального предпринимателя, приобретенный в установленном законом порядке (далее — индивидуальные предприниматели), а в случаях, предусмотренных настоящим Кодексом и иными федеральными законами, с участием Российской Федерации, субъектов Российской Федерации, муниципальных образований, государственных органов, органов местного самоуправления, иных …»","Ст. 28 АПК РФ. «Арбитражные суды рассматривают в порядке искового производства возникающие из гражданских правоотношений экономические споры и другие дела, связанные с осуществлением предпринимательской и иной экономической деятельности юридическими лицами и индивидуальными предпринимателями, а в случаях …»"]},{"n":8,"title":"Понятие и виды подсудности. Передача дела, принятого арбитражным судом к своему производству, из одного суда в другой суд.","brief":"Подсудность — разграничение дел между арбитражными судами. Виды: родовая (уровень суда: суд субъекта, СИП, ВС) и территориальная (общая — по месту ответчика, по выбору истца, договорная, исключительная). Передача дела в другой суд — по ст. 39 АПК, оформляется определением, споры о подсудности недопустимы.","full":["Подсудность — разграничение компетенции между конкретными арбитражными судами (по вертикали и горизонтали). Различают родовую (по уровню судебной системы) и территориальную (по месту) подсудность.","Родовая подсудность (ст. 34 АПК): дела, относящиеся к компетенции арбитражных судов, рассматриваются по первой инстанции арбитражными судами субъектов РФ, за исключением дел, отнесённых к подсудности Суда по интеллектуальным правам и арбитражных судов округов. Арбитражные суды округов рассматривают в качестве суда первой инстанции заявления о присуждении компенсации за нарушение права на судопроизводство в разумный срок или права на исполнение судебного акта в разумный срок (ч. 3 ст. 34 АПК). СИП рассматривает по первой инстанции дела об оспаривании нормативных и ненормативных актов в сфере интеллектуальных прав, дела о предоставлении или прекращении правовой охраны результатов интеллектуальной деятельности и др. (ч. 4 ст. 34 АПК). Верховный Суд РФ судом первой инстанции по экономическим спорам не выступает.","Территориальная подсудность:","общая — по адресу или месту жительства ответчика (ст. 35);","по выбору истца (ст. 36): по месту нахождения филиала/представительства, по месту причинения вреда, по месту исполнения договора и др.;","договорная (ст. 37): стороны вправе изменить подсудность соглашением, кроме исключительной;","исключительная (ст. 38): споры о правах на недвижимость — по месту нахождения имущества; о правах на морские и воздушные суда; заявления о банкротстве — по месту нахождения должника; корпоративные споры — по месту нахождения юридического лица; споры о защите прав на результаты интеллектуальной деятельности — по месту нахождения ответчика/истца в установленных случаях.","Передача дела из одного суда в другой (ст. 39 АПК) допускается: 1) если ответчик, место нахождения которого не было известно, заявит ходатайство о передаче; 2) если установлено, что дело принято с нарушением правил подсудности; 3) если при рассмотрении дела выяснилось, что оно подлежит рассмотрению в другом суде (например, тот же спор уже рассматривается); 4) если судья не вправе рассматривать дело (отвод) и замена невозможна. Передача оформляется определением, которое может быть обжаловано; дело направляется в соответствующий суд, споры о подсудности между судами не допускаются (ч. 4 ст. 39)."],"learn":["Ст. 34 — родовая: суд субъекта (по общему правилу), СИП, ВС РФ.","Ст. 35–38 — территориальная: общая, по выбору истца, договорная, исключительная (недвижимость, банкротство, корпоративные споры).","Ст. 39 — передача: неизвестность ответчика, нарушение подсудности, отвод; оформляется определением, обжалуется.","Споры о подсудности между судами не допускаются (ч. 4 ст. 39)."],"norms":["Ст. 34 АПК РФ. «1. Дела, относящиеся к компетенции арбитражных судов, рассматриваются в первой инстанции арбитражными судами республик, краев, областей, городов федерального значения, автономной области, автономных округов (далее — арбитражные суды субъектов Российской Федерации), за исключением дел, отнесенных к подсудности Суда по интеллектуальным правам и арбитражных судов округов. 3. Арбитражные суды округов рассматривают в качестве суда первой инстанции заявления о присуждении компенсации за нарушение права на судопроизводство в разумный срок или права на исполнение судебного акта в разумный срок. 4. Суд по интеллектуальным правам в качестве суда первой инстанции рассматривает …»","Ст. 35 АПК РФ. «Иск предъявляется в арбитражный суд субъекта Российской Федерации по адресу или месту жительства ответчика.»","Ст. 39 АПК РФ. «1. Дело, принятое арбитражным судом к своему производству с соблюдением правил подсудности, должно быть рассмотрено им по существу, хотя бы в дальнейшем оно стало подсудным другому суду. 2. Арбитражный суд передает дело на рассмотрение другого арбитражного суда того же уровня в случае, если: 1) ответчик, адрес или место жительства которого не было известно ранее, заявит ходатайство о передаче дела в арбитражный суд по его адресу или месту жительства; 2) обе стороны заявили ходатайство о рассмотрении дела по месту нахождения большинства доказательств …»"]},{"n":9,"title":"Единоличное и коллегиальное рассмотрение дел в арбитражных судах.","brief":"По общему правилу — единолично. Коллегиально (три судьи): оспаривание НПА, новое рассмотрение по указанию вышестоящего суда, особая сложность по мотивированному заявлению судьи, дела СИП. С арбитражными заседателями — гражданско-правовые споры по ходатайству стороны. Проверочные инстанции — коллегиально.","full":["Сочетание единоличного и коллегиального рассмотрения — конституционный принцип (ст. 17 АПК). По общему правилу дела в арбитражном суде первой инстанции рассматриваются судьёй единолично. Это обеспечивает процессуальную экономию и оперативность.","Коллегиальное рассмотрение в первой инстанции (три судьи) обязательно (ч. 2 ст. 17 АПК):","1) по делам об оспаривании нормативных правовых актов;","2) по делам, направленным в суд первой инстанции на новое рассмотрение с указанием на коллегиальное рассмотрение;","3) по делам, решения о коллегиальном рассмотрении которых приняты председателем судебного состава в связи с их особой сложностью на основании мотивированного заявления судьи;","4) по делам, относящимся к подсудности Суда по интеллектуальным правам.","Дела о банкротстве в ч. 2 ст. 17 АПК не названы, поэтому коллегиальность по ним законом не требуется (вопрос о банкротстве в первоначальной редакции нормы был исключён).","С участием арбитражных заседателей (судья + два заседателя) рассматриваются экономические споры и иные дела, возникающие из гражданских и иных правоотношений, если какая-либо из сторон заявила ходатайство (ч. 3 ст. 17, ст. 19 АПК); не допускается по делам, указанным в ч. 2 ст. 17, по делам из административных и иных публичных правоотношений и делам особого производства.","Проверочные инстанции: апелляционные и кассационные суды рассматривают дела коллегиально в составе трёх судей (ч. 4 ст. 17 АПК); кассационные жалобы в Судебную коллегию ВС РФ рассматриваются коллегиально; Президиум ВС РФ — большинством голосов. Вопросы, не требующие разрешения по существу (принятие к производству, истребование доказательств, отложение), разрешаются судьёй единолично.","При коллегиальном рассмотрении один из судей председательствует; решения принимаются большинством голосов, никто не вправе воздержаться; судья, не согласный с решением, вправе изложить особое мнение, которое приобщается к делу, но не оглашается (ст. 20 АПК)."],"learn":["Ст. 17 АПК: общее правило — единолично; коллегия из трёх судей — по ч. 2.","Коллегиально обязательно: НПА, новое рассмотрение по указанию вышестоящего суда, особая сложность по заявлению судьи, СИП.","Арбитражные заседатели — судья + 2, только по гражданским спорам и по ходатайству.","Апелляция и кассация — коллегиально, три судьи.","Особое мнение — ст. 20 АПК: приобщается, не оглашается."],"norms":["Ст. 17 АПК РФ. «1. Дела в первой инстанции арбитражного суда рассматриваются судьей единолично, если коллегиальное рассмотрение дела не предусмотрено настоящей статьей. Коллегиальное рассмотрение дел в арбитражном суде первой инстанции осуществляется в составе трех судей или судьи и двух арбитражных заседателей. 2. В первой инстанции арбитражного суда коллегиальным составом судей рассматриваются: 2) дела об оспаривании нормативных правовых актов; 4) дела, направленные в арбитражный суд первой инстанции на новое рассмотрение с указанием на коллегиальное рассмотрение; 5) дела, решения о коллегиальном рассмотрении которых приняты председателем судебного состава в связи с их особой сложностью на основании мотивированного заявления судьи; 6) дела, относящиеся к подсудности Суда по интеллектуальным правам …»","Ст. 20 АПК РФ. «1. Вопросы, возникающие при рассмотрении дела судом в коллегиальном составе, разрешаются судьями большинством голосов. Никто из судей не вправе воздержаться от голосования. Судья — председательствующий в заседании — голосует последним …»"]},{"n":10,"title":"Понятие субъектов арбитражного процессуального права и их классификация.","brief":"Субъекты АПП — участники процессуальных отношений. Классификация: суд; лица, участвующие в деле (стороны, заявители, третьи лица, прокурор, госорганы); лица, содействующие правосудию (свидетель, эксперт, специалист, переводчик, помощник судьи, секретарь); представители. Различаются по юридическому интересу и объёму прав.","full":["Субъекты арбитражного процессуального права — участники арбитражных процессуальных отношений, наделённые процессуальными правами и обязанностями. Их классификация проводится по роли в процессе и по юридическому интересу.","1. Арбитражный суд — главный субъект; он руководит процессом, разрешает дело, совершает властные процессуальные действия. Суд действует в лице судьи, коллегии судей; помощник судьи и секретарь судебного заседания — лица, содействующие правосудию (ст. 58 АПК).","2. Лица, участвующие в деле (ст. 40 АПК): стороны (истец и ответчик), заявители и заинтересованные лица по делам особого производства и публичным делам, третьи лица (заявляющие и не заявляющие самостоятельные требования), прокурор, государственные органы и органы местного самоуправления, иные органы, обращающиеся в защиту публичных интересов, Уполномоченный по защите прав предпринимателей. Они имеют юридический интерес к исходу дела и обладают наибольшим объёмом прав (ст. 41 АПК).","3. Лица, содействующие правосудию (ст. 54 АПК): свидетель, эксперт, специалист, переводчик, помощник судьи, секретарь судебного заседания. Они не имеют юридического интереса, а выполняют вспомогательные функции и несут обязанности (явиться, дать показания, провести экспертизу).","4. Представители (гл. 6 АПК) — действуют от имени и в интересах представляемых, их полномочия производны.","Арбитражная процессуальная правосубъектность включает правоспособность (способность иметь процессуальные права и обязанности — у организаций и граждан с момента регистрации/рождения) и дееспособность (способность осуществлять их лично — с 18 лет, у организаций — через органы). Отдельные категории лиц (прокурор, госорганы) обладают специальной процессуальной правосубъектностью. Субъекты обязаны добросовестно пользоваться правами; злоупотребление влечёт отнесение расходов и иные последствия (ст. 41, 111 АПК)."],"learn":["Ст. 40 АПК — состав лиц, участвующих в деле.","Суд — главный субъект; помощник судьи и секретарь — содействующие (ст. 58).","Лица, участвующие — юридический интерес + права ст. 41.","Содействующие — свидетель, эксперт, специалист, переводчик (ст. 54–57).","Правосубъектность = правоспособность + дееспособность (ст. 43)."],"norms":["Ст. 40 АПК РФ. «Лицами, участвующими в деле, являются: стороны; заявители и заинтересованные лица — по делам особого производства, по делам о несостоятельности (банкротстве) и в иных предусмотренных настоящим Кодексом случаях; третьи лица; прокурор, государственные органы, органы местного самоуправления, иные органы и организации, граждане, обратившиеся в арбитражный суд в случаях, предусмотренных настоящим Кодексом.»","Ст. 41 АПК РФ. «1. Лица, участвующие в деле, имеют право знакомиться с материалами дела, делать выписки из них, снимать копии; заявлять отводы; представлять доказательства и знакомиться с доказательствами, представленными другими лицами, участвующими в деле, до начала судебного разбирательства; участвовать в исследовании доказательств …»"]},{"n":11,"title":"Отводы и самоотводы в арбитражном процессе.","brief":"Отвод обеспечивает беспристрастность. Основания: участие в деле ранее в ином качестве, родство, личная заинтересованность, служебная зависимость (ст. 21 АПК). Отвод заявляется до рассмотрения по существу, разрешается в совещательной комнате с вынесением определения; при удовлетворении дело передаётся другому судье/суду. Повторное участие судьи в деле недопустимо (ст. 22).","full":["Отвод — институт, обеспечивающий беспристрастность суда и иных участников процесса. Основания и порядок установлены гл. 3 АПК (ст. 21–26).","Отвод судьи (ст. 21 АПК): судья не вправе рассматривать дело и подлежит отводу, если он: 1) при предыдущем рассмотрении дела участвовал в качестве свидетеля, эксперта, специалиста, переводчика, представителя, прокурора, секретаря судебного заседания; 2) является родственником лица, участвующего в деле, или его представителя; 3) лично, прямо или косвенно, заинтересован в исходе дела либо имеются иные обстоятельства, которые могут вызвать сомнение в его беспристрастности; 4) находился или находится в служебной или иной зависимости от лица, участвующего в деле, или его представителя.","Недопустимость повторного участия (ст. 22 АПК): судья, принимавший участие в рассмотрении дела в одной инстанции, не может участвовать в рассмотрении этого дела в другой инстанции, а также в новом рассмотрении после отмены акта.","Отвод помощника судьи, секретаря, эксперта, специалиста, переводчика (ст. 23 АПК): основания — родственные отношения, личная заинтересованность, служебная зависимость, а для эксперта и переводчика — также недостаточная компетенция; эксперт не может участвовать, если он проводил ревизию или проверку, материалы которой стали поводом для обращения в суд.","Порядок (ст. 24–26 АПК): отвод заявляется до начала рассмотрения дела по существу; письменно или устно с обоснованием; при коллегиальном составе — всему составу или отдельным судьям. Вопрос разрешается в совещательной комнате с вынесением определения. Отвод судье при единоличном рассмотрении разрешает сам судья; при коллегиальном — остальные судьи в отсутствие отводимого. При удовлетворении отвода дело передаётся другому судье или в другой суд; если это невозможно — в вышестоящий суд. Самоотвод заявляется судьёй по тем же основаниям и разрешается в общем порядке. Отказ в удовлетворении отвода не препятствует повторному заявлению при наличии новых обстоятельств."],"learn":["Ст. 21 — 4 основания отвода судьи: прежнее участие в ином качестве, родство, заинтересованность, зависимость.","Ст. 22 — недопустимость повторного участия в другой инстанции.","Ст. 23 — отвод помощника, секретаря, эксперта, специалиста, переводчика.","Ст. 24–26 — порядок: до начала рассмотрения по существу, мотивированно, в совещательной комнате, определением.","Самоотвод — по тем же основаниям, разрешается в общем порядке."],"norms":["Ст. 21 АПК РФ. «1. Судья не может участвовать в рассмотрении дела и подлежит отводу, если он: 1) при предыдущем рассмотрении данного дела участвовал в нем в качестве судьи и его повторное участие в рассмотрении дела в соответствии с требованиями настоящего Кодекса является недопустимым; 2) при предыдущем рассмотрении данного дела участвовал в нем в качестве прокурора, помощника судьи, секретаря судебного заседания, представителя, эксперта, специалиста, переводчика или свидетеля; 3) при предыдущем рассмотрении данного дела участвовал в нем в качестве судьи иностранного суда, третейского суда или арбитража; 3.1) являлся судебным примирителем по данному делу; 4) является родственником лица, участвующего в деле, или его представителя …»","Ст. 24 АПК РФ. «1. При наличии оснований, указанных в статьях 21 — 23 настоящего Кодекса, судья, арбитражный заседатель, помощник судьи, секретарь судебного заседания, эксперт, специалист, переводчик обязаны заявить самоотвод. По тем же основаниям отвод может быть заявлен лицами, участвующими в деле. Отвод помощнику судьи, секретарю судебного заседания, эксперту, специалисту, переводчику может быть рассмотрен также по инициативе суда …»"]},{"n":12,"title":"Рассмотрение дел в арбитражных судах с участием арбитражных заседателей.","brief":"Арбитражные заседатели — граждане РФ от 25 лет с высшим образованием и стажем от 5 лет, утверждаемые Пленумом ВС РФ. Дело рассматривает судья и два заседателя по ходатайству стороны, заявленному не позднее чем за месяц до разбирательства с обоснованием сложности или потребности в специальных знаниях. Не применяется по публичным делам, делам особого производства и делам ч. 2 ст. 17 АПК. Заседатель имеет права судьи, но не председательствует; получает 1/4 оклада судьи за день участия.","full":["Институт арбитражных заседателей — форма участия представителей общества в отправлении правосудия, закреплённая ст. 17, 19 АПК РФ и ФЗ от 30 мая 2001 г. № 70-ФЗ «Об арбитражных заседателях арбитражных судов субъектов РФ».","Порядок. Арбитражный заседатель — гражданин РФ, наделённый полномочиями по осуществлению правосудия в арбитражном суде. Требования к кандидату: возраст не менее 25 лет, высшее профессиональное образование, стаж работы в сфере экономической, финансовой, юридической, управленческой или предпринимательской деятельности не менее пяти лет, безупречная репутация, дееспособность, отсутствие неснятой судимости. Списки арбитражных заседателей формируются арбитражными судами субъектов РФ на основе предложений организаций и утверждаются Пленумом Верховного Суда РФ.","Дело рассматривается судьёй и двумя арбитражными заседателями, если какая-либо из сторон заявит об этом ходатайство. Ходатайство должно содержать обоснование особой сложности дела и (или) необходимости использования специальных знаний в сфере экономики, финансов, управления и может быть заявлено не позднее чем за один месяц до начала судебного разбирательства, в том числе при каждом новом рассмотрении дела (ч. 1–2 ст. 19 АПК); разрешается оно в порядке ст. 159 АПК. Не допускается участие заседателей по делам, указанным в ч. 2 ст. 17 АПК, по делам из административных и иных публичных правоотношений и по делам особого производства (ч. 3 ст. 17 АПК). Кандидатуры заседателей определяются из утверждённого списка с учётом специализации путём случайной выборки. При неявке одного или двух заседателей дело может быть рассмотрено судьёй единолично, если присутствующие стороны не возражают; при возражении хотя бы одной стороны суд объявляет перерыв или откладывает разбирательство (ч. 4 ст. 19 АПК).","Правовое положение. Арбитражный заседатель пользуется правами судьи, участвует в исследовании доказательств, в совещании и голосовании, но не может председательствовать и не вправе совершать отдельные процессуальные действия (например, единолично разрешать ходатайства). Он не вправе разглашать сведения, ставшие известными при рассмотрении дела. Вознаграждение выплачивается в размере одной четверти должностного оклада судьи за каждый день участия, а также возмещаются командировочные расходы. Заседатель обязан явиться по вызову суда; неявка без уважительной причины влечёт ответственность.","Практика. Институт применяется крайне редко (менее 0,1 % дел). В 2026 г. внесён законопроект об его упразднении как невостребованного; до принятия закона институт формально сохранён."],"learn":["ФЗ № 70-ФЗ от 30.05.2001 + ст. 17, 19 АПК.","Требования: 25 лет, высшее образование, стаж 5 лет, отсутствие судимости.","Состав: судья + 2 заседателя; только по ходатайству стороны.","Не допускается: публичные дела, дела особого производства, дела ч. 2 ст. 17 (НПА, СИП и др.).","Вознаграждение — 1/4 должностного оклада судьи за день участия."],"norms":["Ст. 17 АПК РФ. «3. Арбитражный суд первой инстанции в составе судьи и двух арбитражных заседателей рассматривает экономические споры и иные дела, возникающие из гражданских и иных правоотношений, если какая-либо из сторон заявит ходатайство о рассмотрении дела с участием арбитражных заседателей. Не подлежат рассмотрению с участием арбитражных заседателей дела, предусмотренные частью 2 настоящей статьи, а также дела, возникающие из административных и иных публичных правоотношений, и дела особого производства …»","Ст. 19 АПК РФ. «1. Арбитражные заседатели могут быть привлечены к рассмотрению дел в арбитражных судах первой инстанции в соответствии с настоящим Кодексом и другими федеральными законами по ходатайству стороны в связи с особой сложностью дела и (или) необходимостью использования специальных знаний в сфере экономики, финансов, управления. 2. Ходатайство о рассмотрении дела с участием арбитражных заседателей должно содержать обоснование особой сложности дела и (или) необходимости использования специальных знаний и может быть заявлено стороной не позднее чем за один месяц до начала судебного разбирательства, в том числе при каждом новом рассмотрении дела …»"]},{"n":13,"title":"Лица, участвующие в деле. Их права и обязанности.","brief":"Лица, участвующие в деле (ст. 40 АПК): стороны, заявители, третьи лица, прокурор, госорганы, уполномоченный по защите прав предпринимателей. Они имеют юридический интерес и права ст. 41: знакомиться с материалами, представлять доказательства, заявлять отводы, задавать вопросы, обжаловать акты. Обязанности — добросовестность, явка, раскрытие доказательств, соблюдение порядка.","full":["Лица, участвующие в деле, — субъекты, имеющие юридический интерес к исходу дела и обладающие правом активно влиять на его движение. Их состав определён ст. 40 АПК: стороны, заявители и заинтересованные лица, третьи лица, прокурор, государственные органы и органы местного самоуправления, иные органы, обращающиеся в защиту публичных интересов, Уполномоченный по защите прав предпринимателей.","Права (ст. 41 АПК): знакомиться с материалами дела, делать выписки, снимать копии; представлять доказательства и знакомиться с доказательствами других лиц; заявлять отводы; участвовать в исследовании доказательств, задавать вопросы другим участникам; делать заявления, давать объяснения, приводить доводы; знакомиться с ходатайствами других лиц и возражать против них; обжаловать судебные акты; пользоваться иными процессуальными правами, предусмотренными АПК. Лица, участвующие в деле, вправе знакомиться с протоколом судебного заседания и подавать замечания (ст. 155 АПК), а также получать копии судебных актов.","Обязанности: добросовестно пользоваться процессуальными правами; соблюдать порядок в судебном заседании; исполнять процессуальные обязанности (являться по вызову, представлять документы, раскрывать доказательства до начала разбирательства — ч. 3–4 ст. 65 АПК); сообщать об изменении адреса (ст. 124 АПК); нести судебные расходы; подчиняться требованиям суда. За злоупотребление правами и неисполнение обязанностей возможны санкции: судебный штраф (ст. 119 АПК), отнесение судебных расходов (ст. 111 АПК), рассмотрение дела в отсутствие (ст. 156 АПК).","Отличие от лиц, содействующих правосудию: последние не имеют юридического интереса и не вправе заявлять требования по существу спора."],"learn":["Ст. 40 — состав лиц, участвующих в деле.","Ст. 41 — права: знакомиться, представлять доказательства, отводы, вопросы, обжалование.","Обязанности: добросовестность, явка, раскрытие доказательств (ст. 65), адрес (ст. 124).","Санкции: штраф (ст. 119), расходы (ст. 111), заочное рассмотрение (ст. 156).","Отличие от содействующих — юридический интерес к делу."],"norms":["Ст. 40 АПК РФ. «Лицами, участвующими в деле, являются: стороны; заявители и заинтересованные лица — по делам особого производства, по делам о несостоятельности (банкротстве) и в иных предусмотренных настоящим Кодексом случаях; третьи лица; прокурор, государственные органы, органы местного самоуправления, иные органы и организации, граждане, обратившиеся в арбитражный суд в случаях, предусмотренных настоящим Кодексом.»","Ст. 41 АПК РФ. «1. Лица, участвующие в деле, имеют право знакомиться с материалами дела, делать выписки из них, снимать копии; заявлять отводы; представлять доказательства и знакомиться с доказательствами, представленными другими лицами, участвующими в деле, до начала судебного разбирательства; участвовать в исследовании доказательств; задавать вопросы другим участникам арбитражного процесса, заявлять ходатайства, делать заявления, давать объяснения арбитражному суду, приводить свои доводы по всем возникающим в ходе рассмотрения дела вопросам …»"]},{"n":14,"title":"Стороны в арбитражном процессе. Процессуальное соучастие.","brief":"Стороны — истец и ответчик; их права: общие (ст. 41) и распорядительные (ст. 49 — отказ, признание, мировое соглашение, изменение иска). Соучастие (ст. 46) — несколько истцов/ответчиков при общем предмете, едином основании или однородных правах; бывает активным, пассивным, смешанным, обязательным и факультативным.","full":["Стороны — основные участники искового производства: истец (лицо, обратившееся за защитой своих прав) и ответчик (лицо, к которому предъявлено требование). Сторонами могут быть организации, индивидуальные предприниматели, а в случаях, предусмотренных АПК, — граждане и публичные образования (ст. 44 АПК). Стороны обладают равными процессуальными правами и несут равные обязанности.","Права сторон делятся на общие (ст. 41 АПК) и распорядительные (ст. 49 АПК): истец вправе изменить основание или предмет иска, увеличить или уменьшить размер требований, отказаться от иска; ответчик — признать иск полностью или частично; стороны вправе заключить мировое соглашение, передать спор в третейский суд. Суд не принимает отказ, признание и не утверждает мировое соглашение, если это противоречит закону или нарушает права других лиц. Истец вправе соединить несколько требований (ст. 130 АПК); ответчик вправе предъявить встречный иск (ст. 132 АПК).","Процессуальное соучастие (ст. 46 АПК) — участие в деле нескольких истцов или ответчиков. Основания: 1) предмет спора — общие права и обязанности нескольких лиц; 2) права и обязанности имеют одно основание; 3) предмет спора — однородные права и обязанности. Виды: активное (несколько истцов), пассивное (несколько ответчиков), смешанное. Соучастие может быть обязательным (когда без участия всех лиц невозможно рассмотреть дело — например, споры о общем имуществе, солидарные обязанности) и факультативным (по усмотрению суда). Каждый соучастник выступает самостоятельно, но поручение ведения дела одному из них оформляется доверенностью. При обязательном соучастии суд привлекает соответчика по своей инициативе; при невозможности рассмотрения дела без участия — оставляет иск без рассмотрения (ст. 148 АПК)."],"learn":["Ст. 44 — стороны: истец и ответчик (организации, ИП, в случаях — граждане).","Ст. 49 — распорядительные права: отказ, признание, мировое соглашение, изменение иска.","Ст. 46 — соучастие: 3 основания, виды (активное/пассивное/смешанное).","Обязательное соучастие — суд привлекает соответчика сам.","Ст. 130 — соединение требований; ст. 132 — встречный иск."],"norms":["Ст. 44 АПК РФ. «1. Сторонами в арбитражном процессе являются истец и ответчик. 2. Истцами являются организации и граждане, предъявившие иск в защиту своих прав и законных интересов. 3. Ответчиками являются организации и граждане, к которым предъявлен иск. 4. Стороны пользуются равными процессуальными правами.»","Ст. 46 АПК РФ. «1. Иск может быть предъявлен в арбитражный суд совместно несколькими истцами или к нескольким ответчикам (процессуальное соучастие). 2. Процессуальное соучастие допускается, если: 1) предметом спора являются общие права и (или) обязанности нескольких истцов либо ответчиков; 2) права и (или) обязанности нескольких истцов либо ответчиков имеют одно основание; 3) предметом спора являются однородные права и обязанности …»"]},{"n":15,"title":"Замена ненадлежащего ответчика, процессуальное правопреемство.","brief":"Замена ненадлежащего ответчика (ст. 47) — по ходатайству или с согласия истца, дело рассматривается с начала; при несогласии истца суд может с его согласия привлечь надлежащее лицо вторым ответчиком; если истец против и этого — дело рассматривается по предъявленному иску. Правопреемство (ст. 48) — переход прав и обязанностей при смерти, реорганизации, цессии, переводе долга; допускается на любой стадии, оформляется определением.","full":["Замена ненадлежащего ответчика (ст. 47 АПК) применяется, когда при подготовке дела или во время разбирательства в суде первой инстанции установлено, что иск предъявлен не к тому лицу, которое должно отвечать по иску. Суд может допустить замену по ходатайству или с согласия истца. Если истец не согласен на замену ответчика другим лицом, суд может с согласия истца привлечь это лицо в качестве второго ответчика (ч. 2 ст. 47 АПК). О замене или привлечении второго ответчика выносится определение, после чего рассмотрение дела производится с самого начала (ч. 3–4 ст. 47 АПК). Если истец не согласен ни на замену, ни на привлечение второго ответчика, суд рассматривает дело по предъявленному иску (ч. 5 ст. 47 АПК) — в удовлетворении требований к ненадлежащему ответчику будет отказано. Замена ненадлежащего истца законом не предусмотрена: при отсутствии права требования суд отказывает в иске.","Процессуальное правопреемство (ст. 48 АПК) — переход процессуальных прав и обязанностей от выбывшего участника к его правопреемнику. Основания: смерть гражданина (если правоотношение допускает правопреемство), реорганизация юридического лица, уступка требования (цессия), перевод долга, иные случаи перемены лиц в обязательстве. Ликвидация юридического лица и смерть гражданина по личным обязательствам правопреемства не влекут — производство прекращается. Правопреемство возможно на любой стадии процесса (в первой, апелляционной, кассационной инстанциях, при исполнении). Суд производит замену определением на основании документов, подтверждающих правопреемство; для правопреемника обязательны все процессуальные действия, совершённые до его вступления в дело. Отводы, заявленные ранее, сохраняют силу.","Различие: замена ответчика — это замена субъекта предполагаемого материального правоотношения (первоначальный ответчик выбывает из дела), правопреемство — универсальное или сингулярное преемство в существующем правоотношении."],"learn":["Ст. 47 — замена только ненадлежащего ответчика, с согласия истца; замена истца не допускается.","Ст. 48 — основания: смерть, реорганизация, уступка требования, перевод долга.","Ликвидация юрлица — правопреемства нет, производство прекращается.","Правопреемство возможно на любой стадии; действия до вступления обязательны для правопреемника."],"norms":["Ст. 47 АПК РФ. «1. В случае, если при подготовке дела к судебному разбирательству или во время судебного разбирательства в суде первой инстанции будет установлено, что иск предъявлен не к тому лицу, которое должно отвечать по иску, арбитражный суд может по ходатайству или с согласия истца допустить замену ненадлежащего ответчика надлежащим. 2. Если истец не согласен на замену ответчика другим лицом, суд может с согласия истца привлечь это лицо в качестве второго ответчика. 3. После замены ненадлежащего ответчика или вступления в дело второго ответчика рассмотрение дела производится с самого начала. 4. О замене ненадлежащего ответчика надлежащим или привлечении надлежащего ответчика в качестве второго ответчика арбитражный суд выносит определение …»","Ст. 48 АПК РФ. «1. В случаях выбытия одной из сторон в спорном или установленном судебным актом арбитражного суда правоотношении (реорганизация юридического лица, уступка требования, перевод долга, смерть гражданина и другие случаи перемены лиц в обязательствах) арбитражный суд производит замену этой стороны ее правопреемником и указывает на это в судебном акте. Правопреемство возможно на любой стадии арбитражного процесса. 2. На замену стороны ее правопреемником или на отказ в этом арбитражным судом указывается в соответствующем судебном акте, который может быть обжалован …»"]},{"n":16,"title":"Третьи лица в арбитражном процессе.","brief":"Третьи лица двух видов. Заявляющие самостоятельные требования (ст. 50) вступают до решения путём иска, платят пошлину, пользуются правами истца. Не заявляющие (ст. 51) привлекаются по ходатайству или инициативе суда, если акт повлияет на их права; имеют права стороны, кроме распорядительных.","full":["Третьи лица — участники процесса, защищающие собственные интересы в связи с рассматриваемым спором. Два вида.","Третьи лица, заявляющие самостоятельные требования относительно предмета спора (ст. 50 АПК). Они вступают в дело до принятия решения судом первой инстанции путём предъявления иска к одной или обеим сторонам. Пользуются правами и несут обязанности истца, уплачивают государственную пошлину. Их требование должно быть связано с предметом спора, но не совпадать с требованием первоначального истца (иначе — спор о том же предмете). В результате рассмотрения суд разрешает как первоначальный, так и самостоятельный иск.","Третьи лица, не заявляющие самостоятельных требований относительно предмета спора (ст. 51 АПК). Вступают в дело по ходатайству стороны или по инициативе суда, если судебный акт может повлиять на их права и обязанности по отношению к одной из сторон. Они пользуются процессуальными правами стороны, за исключением распорядительных: не вправе изменять основание и предмет иска, увеличивать размер требований, отказываться от иска, признавать иск, заключать мировое соглашение, требовать принудительного исполнения решения. Вступают до принятия решения; их неявка не препятствует рассмотрению дела. Решение по делу обязательно для них в силу свойства преюдиции (ст. 69 АПК), но они вправе обжаловать судебный акт.","Отличие от соучастников: третьи лица не являются субъектами спорного материального правоотношения (либо их связь с ним производна), у них самостоятельный интерес. Отличие от заявителей: третьи лица вступают в уже начатый процесс."],"learn":["Ст. 50 — самостоятельные требования: вступление до решения, госпошлина, права истца.","Ст. 51 — без самостоятельных требований: привлечение по ходатайству/инициативе суда.","Запрет для третьих лиц ст. 51: изменять иск, отказываться, признавать, заключать мировое соглашение.","Решение обязательно для третьих лиц (преюдиция, ст. 69), но может быть обжаловано."],"norms":["Ст. 50 АПК РФ. «1. Третьи лица, заявляющие самостоятельные требования относительно предмета спора, могут вступить в дело до принятия решения арбитражным судом первой инстанции. 2. Третьи лица, заявляющие самостоятельные требования относительно предмета спора, пользуются правами и несут обязанности истца, за исключением обязанности соблюдения претензионного или иного досудебного порядка урегулирования спора, если это предусмотрено федеральным законом для данной категории споров или договором …»","Ст. 51 АПК РФ. «1. Третьи лица, не заявляющие самостоятельных требований относительно предмета спора, могут вступить в дело на стороне истца или ответчика до принятия судебного акта, которым заканчивается рассмотрение дела в первой инстанции арбитражного суда, если этот судебный акт может повлиять на их права или обязанности по отношению к одной из сторон. Они могут быть привлечены к участию в деле также по ходатайству стороны или по инициативе суда …»"]},{"n":17,"title":"Прокурор в арбитражном процессе.","brief":"Прокурор участвует в двух формах: обращается с иском (заявлением) по закрытому перечню ч. 1 ст. 52 АПК (оспаривание актов, недействительность сделок с публичным участием, истребование публичного имущества, оборонный заказ и закупки, возмещение ущерба, антиотмывочные и иные сделки) либо вступает в дело на любой стадии в целях обеспечения законности (ч. 5 ст. 52). Пользуется правами истца или лица, участвующего в деле; госпошлину не платит.","full":["Участие прокурора регулируется ст. 52 АПК и ФЗ «О прокуратуре РФ». Прокурор не является стороной спора и не имеет материально-правового интереса; его цель — обеспечение законности и защита публичных интересов, прав организаций и граждан в сфере предпринимательской деятельности.","Формы участия:","1) обращение в арбитражный суд с заявлением (иском). Перечень таких обращений закрыт в ч. 1 ст. 52 АПК: заявления об оспаривании нормативных и ненормативных правовых актов органов государственной власти РФ, субъектов РФ и органов местного самоуправления, затрагивающих права и законные интересы организаций и граждан в сфере предпринимательской и иной экономической деятельности; иски о признании недействительными сделок, совершённых органами власти, государственными и муниципальными унитарными предприятиями, государственными учреждениями, а также юридическими лицами с долей участия РФ, субъекта РФ или муниципального образования; иски о применении последствий недействительности таких ничтожных сделок; иски об истребовании государственного и муниципального имущества из чужого незаконного владения; иски о признании недействительными сделок, совершённых с нарушением законодательства о государственном оборонном заказе и о контрактной системе в сфере закупок, и о применении последствий их недействительности; иски о возмещении ущерба, причинённого публично-правовым образованиям нарушением этого законодательства; иски о признании недействительными сделок, совершённых в целях уклонения от исполнения обязанностей по законодательству о противодействии легализации (отмыванию) доходов, о налогах и сборах, валютному и таможенному законодательству, а также законодательству о специальных экономических мерах. Обращение в Верховный Суд РФ направляет Генеральный прокурор или его заместитель, в арбитражный суд субъекта РФ — прокурор субъекта РФ, его заместитель и приравненные к ним прокуроры (ч. 2 ст. 52 АПК);","2) вступление в дело, рассматриваемое арбитражным судом, на любой стадии с процессуальными правами и обязанностями лица, участвующего в деле, в целях обеспечения законности — по категориям дел, указанным в ч. 1 ст. 52, при рассмотрении заявлений о выдаче исполнительного листа на принудительное исполнение решения третейского суда, о признании и приведении в исполнение решений иностранных судов и иностранных арбитражных решений, при выявлении обстоятельств, свидетельствующих о том, что спор инициирован в целях уклонения от исполнения обязанностей по антиотмывочному, налоговому, валютному и таможенному законодательству либо возник из мнимой или притворной сделки, а также если в рамках дела о банкротстве затрагиваются жилищные права граждан, в том числе несовершеннолетних (ч. 5 ст. 52 АПК).","Объём прав: прокурор, обратившийся в суд, пользуется процессуальными правами и несёт обязанности истца (ч. 3 ст. 52 АПК), а вступивший в дело — правами и обязанностями лица, участвующего в деле. Он вправе знакомиться с материалами, представлять доказательства, заявлять ходатайства, обжаловать судебные акты. Отказ прокурора от предъявленного им иска не лишает истца права требовать рассмотрения дела по существу, если истец участвует в деле (ч. 4 ст. 52 АПК).","Прокурор освобождён от уплаты государственной пошлины (ст. 105 АПК, ст. 333.35 НК). В случае удовлетворения иска в пользу организации или гражданина судебные расходы взыскиваются с ответчика в общем порядке."],"learn":["Ст. 52 АПК — две формы: обращение с заявлением (закрытый перечень ч. 1) и вступление в дело (ч. 5).","Обращение — только по категориям, прямо перечисленным в ч. 1 ст. 52.","Не вправе распоряжаться материальным правом (заключать мировое соглашение).","Освобождён от госпошлины (ст. 105 АПК, ст. 333.35 НК).","Отказ прокурора от иска не лишает истца права требовать рассмотрения дела по существу (ч. 4 ст. 52)."],"norms":["Ст. 52 АПК РФ. «1. Прокурор вправе обратиться в арбитражный суд: с заявлениями об оспаривании нормативных правовых актов, ненормативных правовых актов органов государственной власти Российской Федерации, органов государственной власти субъектов Российской Федерации, органов местного самоуправления, затрагивающих права и законные интересы организаций и граждан в сфере предпринимательской и иной экономической деятельности …»","Ст. 52 АПК РФ. «4. Отказ прокурора от предъявленного им иска не лишает истца права требовать рассмотрения дела по существу, если истец участвует в деле.»","Ст. 52 АПК РФ. «5. Прокурор вправе вступить в дело, рассматриваемое арбитражным судом, на любой стадии арбитражного процесса с процессуальными правами и обязанностями лица, участвующего в деле, в целях обеспечения законности: по категориям дел, указанным в части 1 настоящей статьи; при рассмотрении заявлений о выдаче исполнительного листа на принудительное исполнение решения третейского суда; при рассмотрении заявлений о признании и приведении в исполнение решений иностранных судов и иностранных арбитражных решений …»"]},{"n":18,"title":"Лица, содействующие осуществлению правосудия. Их права и обязанности.","brief":"Содействующие лица: свидетель, эксперт, специалист, переводчик, помощник судьи, секретарь (ст. 54–58 АПК). Не имеют юридического интереса. Обязанности — явка и добросовестное исполнение; за ложные показания/заключение и отказ — ответственность по ст. 307 УК; расходы возмещаются (ст. 107), за неявку — штраф.","full":["Лица, содействующие правосудию, — участники процесса, не имеющие юридического интереса к исходу дела и выполняющие вспомогательные функции. К ним относятся свидетель, эксперт, специалист, переводчик, помощник судьи, секретарь судебного заседания (ст. 54–58 АПК).","Свидетель (ст. 56 АПК) — лицо, располагающее сведениями об обстоятельствах дела. Обязан явиться по вызову и дать правдивые показания; вправе не свидетельствовать против себя, супруга и близких родственников, пользоваться письменными заметками, требовать возмещения расходов. За отказ от дачи показаний и заведомо ложные показания — ответственность по ст. 307 УК РФ. Не подлежат допросу судьи и иные лица о сведениях, ставших известными при осуществлении правосудия.","Эксперт (ст. 55 АПК) — лицо, обладающее специальными знаниями, привлечённое судом для производства экспертизы. Вправе знакомиться с материалами дела, заявлять ходатайства, отказаться от дачи заключения, если представленные материалы недостаточны. Обязан явиться по вызову, провести исследование и дать обоснованное заключение; за дачу заведомо ложного заключения несёт уголовную ответственность (ст. 307 УК).","Специалист (ст. 55.1 АПК) — лицо, обладающее специальными знаниями, привлекаемое для консультации, пояснений, оказания технической помощи; не заменяет эксперта и не даёт заключения. Обязан явиться и дать консультацию.","Переводчик (ст. 57 АПК) — лицо, свободно владеющее языком, необходимым для перевода. Обязан явиться, осуществить достоверный перевод, не разглашать сведения; за заведомо неправильный перевод несёт ответственность по ст. 307 УК.","Помощник судьи и секретарь судебного заседания (ст. 58 АПК) — обеспечивают подготовку дела, ведут протокол, но не вправе совершать действия по осуществлению правосудия. Помощник судьи не вправе выполнять функции судьи; секретарь ведёт протокол и проверяет явку.","Все содействующие лица вправе на возмещение расходов (ст. 107 АПК), а за неявку и неисполнение обязанностей несут ответственность в виде судебного штрафа (ст. 119 АПК)."],"learn":["Ст. 54–58: свидетель, эксперт, специалист, переводчик, помощник судьи, секретарь.","Свидетель — обязан явиться и говорить правду; ст. 307 УК.","Эксперт — заключение; специалист — консультация, не заключение.","Переводчик — достоверный перевод; ст. 307 УК.","Помощник и секретарь не осуществляют правосудие."],"norms":["Ст. 56 АПК РФ. «1. Свидетелем является лицо, располагающее сведениями о фактических обстоятельствах, имеющих значение для рассмотрения дела. 2. Свидетель обязан по вызову арбитражного суда явиться в суд. 3. Свидетель обязан сообщить арбитражному суду сведения по существу рассматриваемого дела, которые известны ему лично, и ответить на дополнительные вопросы арбитражного суда и лиц, участвующих в деле …»","Ст. 55 АПК РФ. «1. Экспертом в арбитражном суде является лицо, обладающее специальными знаниями по касающимся рассматриваемого дела вопросам и назначенное судом для дачи заключения в случаях и в порядке, которые предусмотрены настоящим Кодексом …»","Ст. 57 АПК РФ. «1. Переводчиком является лицо, которое свободно владеет языком, знание которого необходимо для перевода в процессе осуществления судопроизводства, и привлечено арбитражным судом к участию в арбитражном процессе в случаях и в порядке, которые предусмотрены настоящим Кодексом …»"]},{"n":19,"title":"Понятие, виды и субъекты представительства в арбитражном процессе.","brief":"Представительство — деятельность от имени и в интересах представляемого. Виды: законное (родители, опекуны), договорное (адвокаты, юристы), представительство организаций через органы, специальные (патентные поверенные, арбитражные управляющие). Представитель — дееспособное лицо с высшим юридическим образованием (кроме исключений) и надлежащими полномочиями.","full":["Представительство в арбитражном процессе — деятельность лица (представителя), совершаемая от имени и в интересах представляемого в пределах предоставленных полномочий, направленная на защиту его прав в суде. Институт регулируется гл. 6 АПК (ст. 59–63).","Виды представительства:","1) законное — представительство недееспособных и ограниченно дееспособных граждан родителями, усыновителями, опекунами, попечителями (ч. 2 ст. 59 АПК); возникает в силу закона, доверенность не требуется;","2) договорное — по соглашению с представителем (адвокатом, юристом, иным лицом); оформляется доверенностью;","3) представительство организаций — осуществляется органами юридического лица (единоличным исполнительным органом, коллегиальным органом) либо уполномоченными лицами по доверенности; от имени ликвидируемой организации выступает представитель ликвидационной комиссии (ч. 4 ст. 59 АПК);","4) специальные виды — патентные поверенные по спорам об интеллектуальной собственности, арбитражные управляющие в деле о банкротстве.","Субъекты. Представителем может быть дееспособное лицо с надлежащим образом оформленными полномочиями. По общему правилу представителями граждан (включая ИП) и организаций выступают адвокаты и иные лица, оказывающие юридическую помощь, имеющие высшее юридическое образование либо учёную степень по юридической специальности (ч. 3 ст. 59 АПК). Требование не распространяется на патентных поверенных, арбитражных управляющих, законных представителей и иных лиц, указанных в законе. Не могут быть представителями судьи, следователи, прокуроры, работники аппарата суда, а также лица, не обладающие дееспособностью (ст. 60 АПК), за исключением случаев законного представительства. Судья не вправе принимать представительство по делу, в котором он участвует.","Представительство отличается от участия в деле органов юридического лица: орган действует как часть организации, а представитель — как самостоятельный субъект, наделённый полномочиями."],"learn":["Гл. 6 АПК, ст. 59–63.","Виды: законное, договорное, через органы юрлица, специальное.","Требование: высшее юридическое образование или учёная степень (ч. 3 ст. 59).","Исключения: патентные поверенные, арбитражные управляющие, законные представители.","Ст. 60 — кто не может быть представителем (судьи, следователи, прокуроры, работники суда)."],"norms":["Ст. 59 АПК РФ. «1. Граждане вправе вести свои дела в арбитражном суде лично или через представителей. Ведение дела лично не лишает гражданина права иметь представителей. 2. Права и законные интересы недееспособных граждан защищают в арбитражном процессе их законные представители — родители, усыновители, опекуны или попечители, которые могут поручить ведение дела в арбитражном суде другому избранному ими представителю …»","Ст. 59 АПК РФ. «3. Представителями граждан, в том числе индивидуальных предпринимателей, и организаций могут выступать в арбитражном суде адвокаты и иные оказывающие юридическую помощь лица, имеющие высшее юридическое образование либо ученую степень по юридической специальности. Требования, предъявляемые к представителям, не распространяются на патентных поверенных по спорам, связанным с правовой охраной результатов интеллектуальной деятельности и средств индивидуализации, арбитражных управляющих при исполнении возложенных на них обязанностей в деле о банкротстве, а также иных лиц, указанных в федеральном законе …»"]},{"n":20,"title":"Полномочия представителя: общие и специальные. Оформление, подтверждение и проверка полномочий представителей.","brief":"Общие полномочия (ст. 41, ч. 1 ст. 62) — знакомиться с материалами, представлять доказательства, заявлять ходатайства и отводы, задавать вопросы, обжаловать. Специальные (ч. 2 ст. 62) — подписание иска и отзыва, заявления об обеспечении иска, передача дела в третейский суд, отказ, признание, изменение иска, мировое соглашение и соглашение по фактическим обстоятельствам, передоверие, пересмотр по новым и вновь открывшимся обстоятельствам, обжалование, получение денег; должны быть специально оговорены в доверенности. Оформление — ст. 61: у организации доверенность подписывает руководитель и скрепляет печатью (при наличии) — ч. 5; у индивидуального предпринимателя — подпись и печать либо удостоверение по ч. 7 — ч. 6; у гражданина — нотариальное или иное удостоверение по ч. 7; проверка — ст. 63.","full":["Полномочия представителя делятся на общие и специальные.","Общие полномочия (ст. 41, 62 АПК): знакомиться с материалами дела, делать выписки и копии, представлять доказательства, заявлять отводы и ходатайства, участвовать в исследовании доказательств, задавать вопросы, давать объяснения, приводить доводы, знакомиться с протоколом, обжаловать судебные акты. Они действуют в силу факта представительства и не требуют отдельного указания в доверенности.","Специальные полномочия (ч. 2 ст. 62 АПК) должны быть специально оговорены в доверенности или ином документе: подписание искового заявления и отзыва на исковое заявление, заявления об обеспечении иска; передача дела в третейский суд; полный или частичный отказ от исковых требований и признание иска; изменение основания или предмета иска; заключение мирового соглашения и соглашения по фактическим обстоятельствам; передача своих полномочий представителя другому лицу (передоверие); подписание заявления о пересмотре судебных актов по новым или вновь открывшимся обстоятельствам; обжалование судебного акта арбитражного суда; получение присуждённых денежных средств или иного имущества. Все остальные процессуальные действия представитель вправе совершать в силу факта представительства, если в доверенности не предусмотрено иное (ч. 1 ст. 62 АПК).","Оформление (ст. 61 АПК): полномочия руководителя организации подтверждаются документами о его статусе и факте наделения полномочиями; законных представителей — документами, удостоверяющими их статус и полномочия; адвоката — в соответствии с федеральным законом (ст. 61 ч. 3 АПК, ст. 6 ФЗ «Об адвокатской деятельности и адвокатуре»); иных лиц, оказывающих юридическую помощь, — документами о высшем юридическом образовании или учёной степени и доверенностью. Доверенность от имени организации должна быть подписана её руководителем или иным уполномоченным на это её учредительными документами лицом и скреплена печатью организации (при наличии печати) — ч. 5 ст. 61 АПК. Доверенность от имени индивидуального предпринимателя должна быть им подписана и скреплена его печатью или может быть удостоверена в соответствии с ч. 7 ст. 61 АПК, то есть нотариально или в ином установленном федеральным законом порядке (ч. 6 ст. 61 АПК); формулировки «при наличии печати» для ИП в ч. 6, в отличие от ч. 5, нет. Доверенность от имени гражданина может быть удостоверена нотариально или в ином установленном федеральным законом порядке (ч. 7 ст. 61 АПК). Полномочия представителя могут быть выражены также в заявлении представляемого, сделанном в судебном заседании, о чём указывается в протоколе.","Проверка (ст. 63 АПК): суд проверяет документы, удостоверяющие личность и полномочия представителя; копии документов приобщаются к делу. При отсутствии надлежащим образом оформленных полномочий суд не допускает представителя к участию в деле, а совершённые им действия не создают последствий для представляемого."],"learn":["Общие — ст. 41, ч. 1 ст. 62; специальные — ч. 2 ст. 62 (перечень).","Обязательно в доверенности: подписание иска и отзыва, отказ, признание, изменение иска, мировое соглашение, передоверие, обжалование, получение средств.","Ст. 61 — оформление: организация — подпись руководителя + печать (при наличии) (ч. 5); ИП — подпись и печать либо удостоверение по ч. 7 (ч. 6); гражданин — нотариус или иной установленный законом порядок (ч. 7).","Законный представитель — документы о статусе; руководитель — документы о должности.","Ст. 63 — проверка полномочий судом; без полномочий представитель не допускается."],"norms":["Ст. 62 АПК РФ. «1. Представитель вправе совершать от имени представляемого им лица все процессуальные действия, за исключением действий, указанных в части 2 настоящей статьи, если иное не предусмотрено в доверенности или ином документе. 2. В доверенности, выданной представляемым лицом, или ином документе должно быть специально оговорено право представителя на подписание искового заявления и отзыва на исковое заявление, заявления об обеспечении иска, передачу дела в третейский суд, полный или частичный отказ от исковых требований и признание иска, изменение основания или предмета иска, заключение мирового соглашения и соглашения по фактическим обстоятельствам, передачу своих полномочий представителя другому лицу (передоверие), а также право на подписание заявления о пересмотре судебных актов по новым или вновь открывшимся обстоятельствам, обжалование судебного акта арбитражного суда, получение …»","Ст. 61 АПК РФ. «4. Иные оказывающие юридическую помощь лица представляют суду документы о высшем юридическом образовании или об ученой степени по юридической специальности, а также документы, удостоверяющие их полномочия. Полномочия на ведение дела в арбитражном суде должны быть выражены в доверенности, выданной и оформленной в соответствии с федеральным законом, а в случаях, предусмотренных международным договором Российской Федерации или федеральным законом, в ином документе. Полномочия представителя также могут быть выражены в заявлении представляемого, сделанном в судебном заседании, на что указывается в протоколе судебного заседания …»","Ст. 61 АПК РФ. «5. Доверенность от имени организации должна быть подписана ее руководителем или иным уполномоченным на это ее учредительными документами лицом и скреплена печатью организации (при наличии печати). 6. Доверенность от имени индивидуального предпринимателя должна быть им подписана и скреплена его печатью или может быть удостоверена в соответствии с частью 7 настоящей статьи. 7. Доверенность от имени гражданина может быть удостоверена нотариально или в ином установленном федеральным законом порядке.»"]},{"n":21,"title":"Понятие, предмет, средства и субъекты доказывания в арбитражном процессе.","brief":"Доказывание — деятельность по установлению обстоятельств дела. Предмет — обстоятельства, имеющие значение для дела (определяет суд, ст. 65). Средства — ст. 64: письменные и вещественные доказательства, объяснения, заключения экспертов, консультации специалистов, показания свидетелей, аудио- и видеозаписи. Субъекты — суд, лица, участвующие в деле, содействующие лица.","full":["Доказывание в арбитражном процессе — регламентированная АПК деятельность суда и лиц, участвующих в деле, по установлению обстоятельств, имеющих значение для правильного разрешения дела, путём представления, исследования и оценки доказательств. Цель доказывания — установление юридической (формальной) истины: суд основывает решение на доказательствах, представленных сторонами в пределах лимитированного (3–6 месяцев) срока.","Предмет доказывания (ч. 2 ст. 65 АПК) — совокупность обстоятельств, имеющих значение для дела, которые определяются судом на основании требований и возражений сторон и с учётом норм материального права. В предмет входят: факты основания исковых требований, факты основания возражений, факты, влекущие процессуальные последствия (например, пропуск срока исковой давности, принятие обеспечительных мер). Факты, не имеющие юридического значения, и преюдициальные факты в предмет доказывания не входят.","Средства доказывания (ч. 2 ст. 64 АПК): письменные и вещественные доказательства, объяснения лиц, участвующих в деле, заключения экспертов, консультации специалистов, показания свидетелей, аудио- и видеозаписи, иные документы и материалы. Современная практика допускает электронные документы, скриншоты, данные информационных систем.","Субъекты доказывания: суд (организует процесс, определяет предмет, оказывает содействие), стороны и другие лица, участвующие в деле (представляют доказательства, оспаривают), представители, а также лица, содействующие правосудию (эксперты, свидетели, специалисты, переводчики). Суд не собирает доказательства за стороны, а лишь создаёт условия для их представления (принцип состязательности, ст. 9 АПК).","Стадии доказывания: 1) определение предмета доказывания; 2) отыскание и представление доказательств; 3) раскрытие доказательств; 4) исследование доказательств в заседании; 5) оценка доказательств и формирование выводов. Нарушение стадийности (например, представление нераскрытых доказательств) влечёт невозможность их использования (ч. 4 ст. 65 АПК)."],"learn":["Ст. 64 — средства доказывания (8 видов).","Предмет — обстоятельства, имеющие значение, по требованию и возражениям (ч. 2 ст. 65).","Суд не собирает доказательства за стороны (состязательность, ст. 9).","Стадии: определение предмета → представление → раскрытие → исследование → оценка.","Нераскрытые доказательства не исследуются (ч. 4 ст. 65)."],"norms":["Ст. 64 АПК РФ. «1. Доказательствами по делу являются полученные в предусмотренном настоящим Кодексом и другими федеральными законами порядке сведения о фактах, на основании которых арбитражный суд устанавливает наличие или отсутствие обстоятельств, обосновывающих требования и возражения лиц, участвующих в деле, а также иные обстоятельства, имеющие значение для правильного рассмотрения дела. 2. В качестве доказательств допускаются письменные и вещественные доказательства, объяснения лиц, участвующих в деле, заключения экспертов, консультации специалистов, показания свидетелей, аудио- и видеозаписи, иные документы и материалы …»","Ст. 65 АПК РФ. «1. Каждое лицо, участвующее в деле, должно доказать обстоятельства, на которые оно ссылается как на основание своих требований и возражений. Обязанность доказывания обстоятельств, послуживших основанием для принятия государственными органами, органами местного самоуправления, иными органами, должностными лицами оспариваемых актов, решений, совершения действий (бездействия), возлагается на соответствующие орган или должностное лицо …»"]},{"n":22,"title":"Понятие и классификация доказательств. Относимость и допустимость доказательств.","brief":"Доказательства — сведения о фактах, полученные в предусмотренном законом порядке (ст. 64). Классификация: прямые/косвенные, личные/вещественные, первоначальные/производные. Относимость (ст. 67) — доказательство имеет значение для дела. Допустимость (ст. 68) — факты подтверждаются только определёнными законом средствами. Заранее установленной силы нет (ст. 71).","full":["Доказательства — полученные в предусмотренном законом порядке сведения о фактах, на основании которых суд устанавливает наличие или отсутствие обстоятельств, имеющих значение для дела (ст. 64 АПК). Доказательства должны быть непосредственно связаны с обстоятельствами дела, получены законным способом и сохранять следы фактов.","Классификация доказательств:","по характеру связи с предметом доказывания: прямые (непосредственно указывают на искомый факт) и косвенные (указывают на промежуточные факты, из которых можно сделать вывод об искомом);","по источнику: личные (объяснения, показания) и вещественные (письменные доказательства, предметы);","по способу образования: первоначальные (отчёты, подлинники) и производные (копии, слепки);","по отношению к стороне: доказательства, представленные истцом, и доказательства ответчика;","по процессуальной форме: письменные (ст. 75), вещественные (ст. 76), объяснения лиц (ст. 81), заключения экспертов (ст. 86), консультации специалистов (ст. 87.1), показания свидетелей (ст. 88), аудио- и видеозаписи, иные документы и материалы (ст. 89).","Относимость доказательств (ст. 67 АПК): суд принимает только те доказательства, которые относятся к делу, то есть имеют значение для установления обстоятельств, входящих в предмет доказывания. Доказательства, не относящиеся к делу, не исследуются и не оцениваются.","Допустимость доказательств (ст. 68 АПК): обстоятельства дела, которые по закону должны быть подтверждены определёнными доказательствами, не могут подтверждаться никакими другими доказательствами. Например, требование о признании сделки, совершённой в простой письменной форме, не подтверждается свидетельскими показаниями; для подтверждения юридически значимых сведений представляются письменные документы соответствующей формы. Недопустимы доказательства, полученные с нарушением закона (ч. 3 ст. 64 АПК).","Никакие доказательства не имеют заранее установленной силы (ст. 71 АПК): суд оценивает относимость, допустимость, достоверность каждого доказательства в отдельности и их совокупности по внутреннему убеждению."],"learn":["Ст. 64 — определение; незаконно полученные не допускаются.","Прямые/косвенные, первоначальные/производные, личные/вещественные.","Относимость (ст. 67) — только значимые для дела доказательства.","Допустимость (ст. 68) — письменная форма сделки — только письменные доказательства.","Ст. 71 — оценка по внутреннему убеждению, никакая сила заранее не установлена."],"norms":["Ст. 64 АПК РФ. «1. Доказательствами по делу являются полученные в предусмотренном настоящим Кодексом и другими федеральными законами порядке сведения о фактах, на основании которых арбитражный суд устанавливает наличие или отсутствие обстоятельств, обосновывающих требования и возражения лиц, участвующих в деле, а также иные обстоятельства, имеющие значение для …»","Ст. 67 АПК РФ. «1. Арбитражный суд принимает только те доказательства, которые имеют отношение к рассматриваемому делу. 2. Арбитражный суд не принимает поступившие в суд документы, содержащие ходатайства о поддержке лиц, участвующих в деле, или оценку их деятельности, иные документы, не имеющие отношения к …»","Ст. 68 АПК РФ. «Обстоятельства дела, которые согласно закону должны быть подтверждены определенными доказательствами, не могут подтверждаться в арбитражном суде иными доказательствами.»"]},{"n":23,"title":"Распределение обязанности по доказыванию.","brief":"Общее правило (ст. 65): каждая сторона доказывает основания своих требований и возражений. Исключения: презумпции (вина причинителя вреда, добросовестность); при оспаривании актов законность доказывает орган; при административке — административный орган. Освобождение от доказывания (ст. 69): общеизвестные факты, преюдиция, признание сторон (ст. 70).","full":["Обязанность доказывания (бремя доказывания) распределяется между лицами, участвующими в деле, по правилу ст. 65 АПК: каждое лицо должно доказать те обстоятельства, на которые оно ссылается как на основании своих требований и возражений. Истец обязан доказать основание иска, ответчик — основание возражений. Бремя доказывания не может быть переложено на суд.","Исключения из общего правила — презумпции и специальные правила:","1) презумпция вины причинителя вреда: вина причинителя предполагается, потерпевший доказывает вред и причинную связь;","2) презумпция добросовестности участников гражданского оборота (ст. 10 ГК);","3) при оспаривании ненормативного акта законность его принятия и совершённых действий доказывает орган, принявший акт (ч. 5 ст. 200 АПК);","4) при привлечении к административной ответственности бремя доказывания законности возлагается на административный орган (ч. 4 ст. 205, ч. 5 ст. 210 АПК);","5) при взыскании обязательных платежей налоговый орган обосновывает основания взыскания.","Освобождение от доказывания (ст. 69 АПК): 1) обстоятельства, признанные арбитражным судом общеизвестными; 2) преюдициальные обстоятельства — установленные вступившим в законную силу судебным актом арбитражного суда по ранее рассмотренному делу, они не доказываются вновь при рассмотрении другого дела, в котором участвуют те же лица (ч. 2 ст. 69); 3) вступившее в законную силу решение суда общей юрисдикции по гражданскому делу обязательно для арбитражного суда по вопросам об установленных им обстоятельствах, имеющих отношение к лицам, участвующим в деле (ч. 3 ст. 69); 4) вступивший в законную силу приговор суда по уголовному делу обязателен по вопросам о том, имели ли место определённые действия и совершены ли они определённым лицом (ч. 4 ст. 69); 5) обстоятельства, подтверждённые нотариусом, не требуют доказывания, если подлинность нотариально оформленного документа не опровергнута или нотариальный акт не отменён (ч. 5 ст. 69); 6) обстоятельства, признанные сторонами в установленном порядке (ст. 70 АПК), — при отсутствии возражений другой стороны.","Риск последствий: лицо, не представившее доказательства, несёт риск неблагоприятных последствий — суд может рассмотреть дело по имеющимся доказательствам (ч. 2 ст. 9 АПК); нераскрытые доказательства не исследуются (ч. 4 ст. 65 АПК)."],"learn":["Ст. 65 ч. 1 — «кто ссылается — тот доказывает».","Презумпции: вины причинителя вреда, добросовестности.","Публичные споры — законность доказывает орган (ст. 200, 205, 210).","Ст. 69 — освобождение: общеизвестность, преюдиция, приговор.","Ст. 70 — факты, признанные сторонами, доказыванию не подлежат."],"norms":["Ст. 65 АПК РФ. «1. Каждое лицо, участвующее в деле, должно доказать обстоятельства, на которые оно ссылается как на основание своих требований и возражений. Обязанность доказывания обстоятельств, послуживших основанием для принятия государственными органами, органами местного самоуправления, иными органами, должностными лицами оспариваемых актов, решений, совершения действий (бездействия), возлагается на соответствующие орган или должностное лицо …»","Ст. 69 АПК РФ. «2. Обстоятельства, установленные вступившим в законную силу судебным актом арбитражного суда по ранее рассмотренному делу, не доказываются вновь при рассмотрении арбитражным судом другого дела, в котором участвуют те же лица …»"]},{"n":24,"title":"Представление, истребование, раскрытие и оценка доказательств.","brief":"Представление — добровольное (ст. 65). Истребование (ст. 66) — по ходатайству, запросом/определением; неисполнение — штраф. Раскрытие (ст. 65 ч. 3–4) — обязанность заранее ознакомить других лиц; нераскрытое не исследуется. Оценка (ст. 71) — по внутреннему убеждению, всесторонне, полно, объективно.","full":["Представление доказательств — добровольная передача доказательств лицу, уполномоченному их исследовать (суду). Доказательства представляются лицами, участвующими в деле, при первом представлении отзыва или до начала рассмотрения дела по существу (ст. 65 АПК); копии заблаговременно направляются другим лицам.","Истребование доказательств (ст. 66 АПК) — принудительный способ получения: суд по ходатайству лица, которое не может самостоятельно их получить, исстребует у организаций и граждан письменные и вещественные доказательства. Истребование оформляется запросом (ходатайством) либо определением об истребовании; лицо, у которого они находятся, обязано представить их в срок, указанный судом, направив копии другим лицам. При неисполнении обязанности представить доказательства суд вправе наложить судебный штраф (ст. 119 АПК) и может обосновать выводы исходя из пояснений другой стороны.","Раскрытие доказательств (ч. 3–4 ст. 65 АПК) — обязанность заблаговременно, до начала судебного разбирательства, ознакомить других лиц с доказательствами. Лица вправе знать об аргументах друг друга до начала процесса. Доказательства, представленные с нарушением порядка раскрытия, не исследуются судом, если лицо не обосновало невозможность их представления ранее. Суд способствует раскрытию, устанавливая сроки.","Оценка доказательств (ст. 71 АПК): суд оценивает доказательства по своему внутреннему убеждению, основанному на всестороннем, полном, объективном и непосредственном исследовании имеющихся доказательств. Оценка включает проверку относимости, допустимости, достоверности каждого доказательства, достаточности и взаимной связи в совокупности. Никакие доказательства не имеют заранее установленной силы; результаты оценки отражаются в мотивировочной части решения."],"learn":["Ст. 65 — представление и раскрытие; сроки устанавливает суд.","Ст. 66 — истребование по ходатайству; за неисполнение — штраф.","Нераскрытые доказательства не исследуются (кроме обоснованной невозможности).","Ст. 71 — внутреннее убеждение, всесторонность, полнота, объективность, непосредственность.","Заранее установленной силы у доказательств нет."],"norms":["Ст. 65 АПК РФ. «3. Каждое лицо, участвующее в деле, должно раскрыть доказательства, на которые оно ссылается как на основание своих требований и возражений, перед другими лицами, участвующими в деле, до начала судебного заседания или в пределах срока, установленного судом, если иное не установлено настоящим Кодексом. 4. Лица, участвующие в деле, вправе ссылаться только на те доказательства, с которыми другие лица, участвующие в деле, были ознакомлены заблаговременно …»","Ст. 66 АПК РФ. «4. Лицо, участвующее в деле и не имеющее возможности самостоятельно получить необходимое доказательство от лица, у которого оно находится, вправе обратиться в арбитражный суд с ходатайством об истребовании данного доказательства. В ходатайстве должно быть обозначено доказательство, указано, какие обстоятельства, имеющие значение для дела, могут быть установлены этим доказательством, указаны причины, препятствующие получению доказательства, и место его нахождения …»","Ст. 71 АПК РФ. «1. Арбитражный суд оценивает доказательства по своему внутреннему убеждению, основанному на всестороннем, полном, объективном и непосредственном исследовании имеющихся в деле доказательств. 2. Арбитражный суд оценивает относимость, допустимость, достоверность каждого доказательства в отдельности, а также достаточность и взаимную связь доказательств в их совокупности …»"]},{"n":25,"title":"Письменные и вещественные доказательства в арбитражном процессе. Порядок их исследования и осмотра по месту нахождения.","brief":"Письменные (ст. 75): документы о фактах (договоры, акты, переписка, электронные документы); подлинники требуются по ходатайству и при оспаривании копий. Вещественные (ст. 76): предметы со свойствами, имеющими значение для дела; хранятся у суда или хранителя. Осмотр по месту нахождения (ст. 78) — при невозможности доставки, по определению суда, с протоколом.","full":["Письменные доказательства (ст. 75 АПК) — документы, содержащие сведения об обстоятельствах, имеющих значение для дела: договоры, акты, справки, деловая корреспонденция, иные документы, в том числе полученные посредством электронной связи (электронные документы, скриншоты). Изготавливаются в любой форме, допускающей идентификацию информации. Суд по ходатайству лица или с его согласия вправе потребовать подлинники, если копии идентичны по содержанию и не оспариваются; подлинники представляются также в случаях, прямо предусмотренных законом. Письменные доказательства исследуются в подлиннике или в форме надлежащей копии, приобщаются к делу, о чём указывается в протоколе.","Вещественные доказательства (ст. 76 АПК) — предметы, которые по своему внешнему виду, свойствам, месту нахождения или иным признакам могут служить средством установления обстоятельств, имеющих значение для дела. Они осматриваются судом, о чём составляется протокол. Хранение вещественных доказательств обеспечивает суд или хранитель, назначенный судом (ст. 77, 80 АПК); быстро портящиеся предметы осматриваются судом с участием заинтересованных лиц и возвращаются (ст. 79).","Порядок осмотра по месту нахождения (ст. 78 АПК): если письменные или вещественные доказательства не могут быть доставлены в суд (громоздкие, находящиеся в труднодоступной местности), суд проводит осмотр и исследование по месту их нахождения с извещением лиц, участвующих в деле; их неявка не препятствует осмотру. В осмотре могут участвовать эксперты, свидетели, переводчики. Результаты осмотра заносятся в протокол, к которому могут прилагаться фото-, видеоматериалы, эскизы; лица, участвующие, вправе давать объяснения в ходе осмотра. Осмотр по месту нахождения производится на основании определения суда. В случае необходимости из материалов дела выделяются копии.","К форме и реквизитам документов применяются требования о допустимости: письменные доказательства, поступившие из-за рубежа, должны быть легализованы или апостилированы."],"learn":["Ст. 75 — письменные доказательства; электронные документы допускаются.","Ст. 76 — вещественные; хранение — ст. 77 (суд или хранитель).","Подлинники — по ходатайству, при расхождении копий, по закону.","Ст. 78 — осмотр по месту нахождения: определение, извещение, протокол.","Ст. 79 — быстро портящиеся предметы."],"norms":["Ст. 75 АПК РФ. «1. Письменными доказательствами являются содержащие сведения об обстоятельствах, имеющих значение для дела, договоры, акты, справки, деловая корреспонденция, иные документы, выполненные в форме цифровой, графической записи или иным способом, позволяющим установить достоверность документа. 2. К письменным доказательствам относятся также протоколы судебных заседаний, протоколы совершения отдельных процессуальных действий и приложения к ним …»","Ст. 76 АПК РФ. «1. Вещественными доказательствами являются предметы, которые своими внешним видом, свойствами, местом нахождения или иными признаками могут служить средством установления обстоятельств, имеющих значение для дела. 2. О приобщении вещественных доказательств к делу арбитражный суд выносит определение.»","Ст. 78 АПК РФ. «1. Арбитражный суд может провести осмотр и исследование письменных и вещественных доказательств по месту их нахождения в случае невозможности или затруднительности доставки в суд. О проведении осмотра и исследования на месте выносится определение. 2. Осмотр и исследование письменных и вещественных доказательств проводятся арбитражным судом с извещением лиц, участвующих в деле, о месте и времени осмотра и исследования. Неявка надлежащим образом извещенных лиц не препятствует проведению осмотра и исследования …»"]},{"n":26,"title":"Назначение и порядок проведения экспертизы. Виды экспертиз.","brief":"Экспертиза — исследование по вопросам, требующим специальных знаний, назначается по ходатайству/согласию лиц, по определению суда (ст. 82). Виды: комиссионная (ст. 84 — одна специальность), комплексная (ст. 85 — разные), дополнительная и повторная (ст. 87). Заключение (ст. 86) не обязательно для суда.","full":["Экспертиза — процессуальное действие, состоящее в проведении исследования по вопросам, требующим специальных знаний, и даче заключения экспертом. Регулируется ст. 82–87 АПК.","Назначение (ст. 82 АПК): проводится по ходатайству лица, участвующего в деле, или с согласия лиц; при назначении по инициативе суда — с согласия сторон. Суд может назначить экспертизу, если для разрешения дела требуются специальные знания. О назначении выносится определение, в котором указываются: основания, эксперт или экспертная организация, вопросы, сроки, предупреждение об уголовной ответственности. Лица, участвующие в деле, вправе предлагать вопросы, кандидатуры экспертов, заявлять отвод, просить о привлечении нескольких экспертов. Не могут задаваться вопросы правового характера (квалификация правоотношений относится к компетенции суда).","Порядок проведения (ст. 83 АПК): экспертиза проводится экспертами экспортной организации или поручается конкретному лицу; эксперты вправе знакомиться с материалами дела, ходатайствовать о предоставлении дополнительных материалов, участвовать в заседании, отказаться от дачи заключения при недостаточности материала. Лица, участвующие в деле, вправе присутствовать при проведении экспертизы, если это не мешает исследованию.","Виды экспертиз:","простая (один эксперт, одна область знаний);","комиссионная (ст. 84 АПК) — не менее двух экспертов одной специальности, заключение подписывается всеми, при разногласиях каждый излагает мнение отдельно;","комплексная (ст. 85 АПК) — эксперты разных специальностей, каждый исследует в пределах своих знаний, вывод о факте делается совместно;","дополнительная (ст. 87 АПК) — при недостаточной ясности или полноте заключения, поручается тому же или другому эксперту;","повторная (ст. 87 АПК) — при сомнениях в обоснованности заключения или противоречиях, поручается другому эксперту, на неё могут быть поставлены те же вопросы.","Заключение эксперта (ст. 86 АПК): письменный документ с описанием исследований, выводов (в том числе вероятных), подписывается экспертом, заверяется печатью. Заключение не является обязательным для суда и оценивается наряду с другими доказательствами. Расходы на экспертизу оплачиваются лицом, заявившим ходатайство, либо распределяются по правилам ст. 110 АПК; при назначении по инициативе суда — из бюджета либо на депозит судом."],"learn":["Ст. 82 — назначение определением; вопросы правового характера недопустимы.","Ст. 83 — порядок: знакомство с делом, ходатайства, отказ при недостаточности.","Комиссионная (ст. 84) — 2+ эксперта одной специальности.","Комплексная (ст. 85) — разные специальности.","Дополнительная / повторная — ст. 87; заключение необязательно для суда."],"norms":["Ст. 82 АПК РФ. «1. Для разъяснения возникающих при рассмотрении дела вопросов, требующих специальных знаний, арбитражный суд назначает экспертизу по ходатайству лица, участвующего в деле, или с согласия лиц, участвующих в деле. В случае, если назначение экспертизы предписано законом или предусмотрено договором либо необходимо для проверки заявления о фальсификации представленного доказательства либо если необходимо проведение дополнительной или повторной экспертизы, арбитражный суд может назначить экспертизу по своей инициативе. 2. Круг и содержание вопр

осов, по которым должна быть проведена экспертиза, определяются арбитражным судом …»","Ст. 86 АПК РФ. «3. Заключение эксперта оглашается в судебном заседании и исследуется наряду с другими доказательствами по делу. По ходатайству лица, участвующего в деле, или по инициативе арбитражного суда эксперт может быть вызван в судебное заседание. Эксперт после оглашения его заключения вправе дать по нему необходимые пояснения, а также обязан ответить на дополнительные вопросы лиц, участвующих в деле, и суда …»","Ст. 87 АПК РФ. «1. При недостаточной ясности или полноте заключения эксперта, а также при возникновении вопросов в отношении ранее исследованных обстоятельств дела может быть назначена дополнительная экспертиза, проведение которой поручается тому же или другому эксперту. 2. В случае возникновения сомнений в обоснованности заключения эксперта или наличия противоречий в выводах эксперта или комиссии экспертов по тем же вопросам может быть назначена повторная экспертиза, проведение которой поручается другому эксперту или другой комиссии экспертов.»"]},{"n":27,"title":"Обеспечение доказательств. Судебные поручения и порядок их выполнения.","brief":"Обеспечение доказательств (ст. 72) — фиксация доказательств при угрозе их исчезновения: допрос свидетеля, осмотр, экспертиза; по правилам обеспечения иска, до предъявления иска — в порядке ст. 99 АПК. Судебное поручение (ст. 73–74) — получение доказательств в другом субъекте РФ по определению суда; выполняется в 10-дневный срок, суд извещает лиц, составляет протокол и немедленно пересылает материалы.","full":["Обеспечение доказательств (ст. 72 АПК) — действия по фиксации доказательств, когда имеются основания опасаться, что представление их впоследствии станет невозможным или затруднительным (угроза уничтожения, порчи, выезда свидетеля за границу и т.п.).","Порядок: заявление об обеспечении доказательств подаётся в арбитражный суд, в производстве которого находится дело; в нём указываются доказательства, которые необходимо обеспечить, обстоятельства, для подтверждения которых они нужны, и причины обращения (ч. 2 ст. 72 АПК). Обеспечение производится по правилам об обеспечении иска (ч. 3 ст. 72 АПК); до предъявления иска меры по обеспечению доказательств принимаются в порядке ст. 99 АПК — по месту нахождения заявителя, месту нахождения денежных средств и иного имущества либо по месту нарушения прав заявителя. Обеспечение осуществляется путём допроса свидетеля, осмотра письменных и вещественных доказательств, назначения экспертизы; по результатам составляется протокол. Расходы по обеспечению несёт заявитель; они относятся к судебным издержкам.","Судебное поручение (ст. 73 АПК) — институт, обеспечивающий получение доказательств, находящихся на территории другого субъекта РФ, когда их невозможно получить в порядке ст. 66 АПК: арбитражный суд, рассматривающий дело, поручает соответствующему арбитражному суду совершить определённые процессуальные действия (осмотр, допрос, истребование). Поручение оформляется определением, в котором кратко излагается содержание дела, указываются обстоятельства, подлежащие выяснению, и доказательства, которые должен получить суд; копия определения направляется суду-исполнителю. Определение обязательно для суда, которому дано поручение, и должно быть выполнено не позднее чем в десятидневный срок со дня получения его копии (ч. 3 ст. 73 АПК).","Выполнение поручения (ст. 74 АПК) осуществляется в судебном заседании с извещением лиц; протокол и собранные материалы немедленно направляются в суд, выдавший поручение; их получение приобщается к делу. АПК также предусмотрены запросы третейских судов о содействии в получении доказательств (ст. 74.1 АПК)."],"learn":["Ст. 72 — цель: угроза утраты; способы: допрос, осмотр, экспертиза; по правилам обеспечения иска.","До подачи иска — в порядке ст. 99 АПК (предварительные меры).","Ст. 73 — судебное поручение: определение, обязательное для исполняющего суда, срок — 10 дней.","Ст. 74 — выполнение в заседании, материалы немедленно направляются суду-поручителю."],"norms":["Ст. 72 АПК РФ. «1. Лица, участвующие в деле, имеющие основания опасаться, что представление в арбитражный суд необходимых доказательств станет невозможным или затруднительным, могут обратиться с заявлением об обеспечении этих доказательств. 2. Заявление об обеспечении доказательств подается в арбитражный суд, в производстве которого находится дело …»","Ст. 73 АПК РФ. «1. Арбитражный суд, рассматривающий дело, в случае невозможности получения доказательств, находящихся на территории другого субъекта Российской Федерации, в порядке, предусмотренном статьей 66 настоящего Кодекса, вправе поручить соответствующему арбитражному суду произвести определенные процессуальные действия.»","Ст. 73 АПК РФ. «3. Определение о судебном поручении обязательно для арбитражного суда, которому дано поручение, и должно быть выполнено не позднее чем в десятидневный срок со дня получения копии определения.»","Ст. 74 АПК РФ. «2. О выполнении судебного поручения выносится определение, которое со всеми материалами, собранными при выполнении судебного поручения, немедленно пересылается в арбитражный суд, направивший судебное поручение. При невозможности выполнения судебного поручения по причинам, не зависящим от суда, на это указывается в определении …»"]},{"n":28,"title":"Судебные штрафы: понятие, размеры, порядок наложения.","brief":"Судебные штрафы — процессуальная ответственность за неисполнение обязанностей и неуважение к суду (ст. 119–120). Размеры: граждане — до 5 000 ₽, должностные лица — до 30 000 ₽, организации — до 100 000 ₽. Наложение — по результатам заседания, определением; обжалуется в 10 дней; взыскание — через исполнительный лист в доход бюджета.","full":["Судебный штраф — мера процессуальной ответственности имущественного характера, налагаемая арбитражным судом на участников процесса и иных лиц за неисполнение процессуальных обязанностей, злоупотребление правами или неуважение к суду. Регулируется ст. 119–120 АПК.","Основания: неявка в судебное заседание без уважительных причин; неисполнение обязанности представить доказательства (ст. 66 АПК); несообщение об изменении адреса (ст. 124 АПК); неисполнение обязанности известить о месте нахождения имущества (ст. 225.6 АПК — корпоративные споры); неуважение к суду (ч. 5 ст. 119 АПК); иные случаи, прямо предусмотренные АПК. Штрафы налагаются только в случаях, предусмотренных кодексом.","Размеры (ч. 1 ст. 119 АПК): на граждан — не более 5 000 рублей; на должностных лиц — не более 30 000 рублей; на организации — не более 100 000 рублей; если иное не предусмотрено статьёй. Законом установлены отдельные фиксированные размеры для корпоративных споров (ст. 225.4, 225.6, 225.12 АПК): например, на руководителя — 30 000 рублей, на организацию — 100 000 рублей. Штрафы, наложенные на должностных лиц госорганов, взыскиваются из их личных средств и поступают в доход федерального бюджета.","Порядок наложения (ст. 120 АПК): вопрос о наложении штрафа на лицо, присутствующее в заседании, разрешается в том же заседании, на не присутствующее — в другом заседании с извещением этого лица (неявка надлежаще извещённого лица не препятствует рассмотрению). По результатам выносится определение; его копия направляется лицу, на которое наложен штраф, в пятидневный срок. Определение приводится в исполнение немедленно в порядке, установленном для исполнения решения; исполнительный лист направляется судебному приставу-исполнителю. Определение может быть обжаловано в десятидневный срок со дня получения копии, подача жалобы не приостанавливает исполнение (ч. 6–7 ст. 120 АПК). Суммы штрафов взыскиваются в доход федерального бюджета."],"learn":["Ст. 119: три категории — до 5 000 / 30 000 / 100 000 ₽.","Основания — только прямо предусмотренные АПК (неявка, неистребование, адрес, неуважение к суду).","Ст. 120 — порядок: рассмотрение в заседании, определение.","Исполнение — исполнительный лист, взыскание в доход бюджета.","Штрафы с должностных лиц госорганов взыскиваются из личных средств."],"norms":["Ст. 119 АПК РФ. «1. Судебные штрафы налагаются арбитражным судом в случаях, предусмотренных настоящим Кодексом. Размер судебного штрафа, налагаемого на граждан, не может превышать пять тысяч рублей, на должностных лиц — тридцать тысяч рублей, на организации — сто тысяч рублей, если иное не предусмотрено настоящей статьей. 2. Размер судебного штрафа, налагаемого арбитражным судом в случае, предусмотренном частью 4 статьи 225.4 настоящего Кодекса, составляет тридцать тысяч рублей …»","Ст. 120 АПК РФ. «1. Вопрос о наложении судебного штрафа на лицо, присутствующее в судебном заседании, разрешается в том же судебном заседании арбитражного суда. 2. Вопрос о наложении судебного штрафа на лицо, не присутствующее в судебном заседании, разрешается в другом судебном заседании арбитражного суда. 3. Лицо, в отношении которого рассматривается вопрос о наложении судебного штрафа, извещается о времени и месте судебного заседания с указанием оснований проведения судебного заседания …»"]},{"n":29,"title":"Судебные извещения в арбитражном процессе.","brief":"Извещение — о времени и месте заседания (ст. 121–124). Способы: заказное письмо с уведомлением, вручение под расписку, телефонограмма, факс, электронная почта, единый портал госуслуг, система ЭДО; информация размещается на сайте суда за 15 дней. Надлежащее извещение (ст. 123) — вручение, возврат корреспонденции либо иные доказательства получения информации. Неизвещение — безусловное основание отмены акта.","full":["Судебные извещения — процессуальные акты (определения, повестки), направляемые арбитражным судом лицам, участвующим в деле, о времени и месте судебного заседания, совершении отдельных процессуальных действий (ст. 121 АПК). Цель — обеспечить реализацию права на участие в процессе.","Способы извещения (ст. 121–122 АПК): копия судебного акта направляется заказным письмом с уведомлением о вручении либо вручается адресату или его представителю под расписку; в случаях, не терпящих отлагательства, допускаются телефонограмма, телеграмма, факсимильная связь, электронная почта и иные средства связи, обеспечивающие фиксацию извещения. Судебный акт в электронном виде направляется посредством единого портала государственных и муниципальных услуг либо системы электронного документооборота участника процесса. Информация о принятии заявления к производству и о времени и месте судебного заседания размещается судом на официальном сайте в сети «Интернет» не позднее чем за пятнадцать дней до начала заседания (ч. 1 ст. 121 АПК).","Надлежащее извещение (ст. 123 АПК) — важнейшая гарантия. Лицо считается извещённым надлежащим образом, если к началу заседания суд располагает сведениями о получении адресатом копии определения о принятии заявления к производству либо иными доказательствами получения информации о начавшемся процессе (ч. 1 ст. 123). Гражданин считается извещённым, если извещение вручено ему лично или проживающему совместно с ним совершеннолетнему лицу под расписку; юридическому лицу — если вручено уполномоченному на получение корреспонденции лицу (ч. 2–3 ст. 123). Лицо также считается извещённым, если: адресат отказался от получения копии акта и отказ зафиксирован; несмотря на почтовое извещение, адресат не явился за корреспонденцией; копия не вручена в связи с отсутствием адресата по указанному адресу; извещение вручено уполномоченному лицу филиала или представительства; извещение вручено представителю; имеются доказательства вручения или направления извещения; имеется подтверждение доставки через единый портал госуслуг или систему электронного документооборота (ч. 4 ст. 123). Если адрес или место жительства ответчика неизвестны, надлежащим извещением считается направление извещения по последнему известному адресу (ч. 5 ст. 123).","Самостоятельное отслеживание информации (ч. 6 ст. 121 АПК): лица, участвующие в деле, после получения первого судебного акта обязаны самостоятельно предпринимать меры по получению информации о движении дела и несут риск наступления неблагоприятных последствий несовершения таких действий. Смена адреса: лицо обязано сообщить об изменении наименования, адреса, иных реквизитов до окончания производства (ст. 124 АПК); при несообщении судебный акт, направленный по известному адресу, считается вручённым.","Последствия: рассмотрение дела в отсутствие надлежаще извещённого лица допускается (ст. 156 АПК); при отсутствии сведений об извещении рассмотрение дела откладывается; ненадлежащее извещение является безусловным основанием для отмены судебного акта вышестоящей инстанцией."],"learn":["Ст. 121–124 АПК — правовая база.","Способы: письмо с уведомлением, под расписку, телефонограмма, факс, e-mail, единый портал госуслуг, ЭДО.","Надлежащее извещение (ст. 123): вручение, возврат корреспонденции, отказ от получения, доставка через ЕПГУ/ЭДО.","Ст. 124 — при перемене адреса без сообщения — акт считается вручённым по старому адресу.","Ст. 156 — рассмотрение в отсутствие надлежаще извещённого лица; неявка — не препятствие."],"norms":["Ст. 121 АПК РФ. «1. Лица, участвующие в деле, и иные участники арбитражного процесса извещаются арбитражным судом о принятии искового заявления или заявления к производству и возбуждении производства по делу, о времени и месте судебного заседания или совершения отдельного процессуального действия путем направления копии судебного акта в порядке, установленном настоящим Кодексом, не позднее чем за пятнадцать дней до начала судебного заседания или совершения отдельного процессуального действия, если иное не предусмотрено настоящим Кодексом …»","Ст. 123 АПК РФ. «1. Лица, участвующие в деле, и иные участники арбитражного процесса считаются извещенными надлежащим образом, если к началу судебного заседания, совершения отдельного процессуального действия арбитражный суд располагает сведениями о получении адресатом копии определения о принятии искового заявления или заявления к производству и возбуждении производства по делу, направленной ему в порядке, установленном настоящим Кодексом, или иными доказательствами получения лицами, участвующими в деле …»","Ст. 123 АПК РФ. «4. Лица, участвующие в деле, и иные участники арбитражного процесса также считаются извещенными надлежащим образом арбитражным судом, если: 1) адресат отказался от получения копии судебного акта и этот отказ зафиксирован организацией почтовой связи или арбитражным судом; 2) несмотря на почтовое извещение, адресат не явился за получением копии судебного акта, направленной арбитражным судом в установленном порядке, о чем организация почтовой связи уведомила арбитражный суд …»"]},{"n":30,"title":"Процессуальные сроки: понятие, значение и виды.","brief":"Процессуальный срок — период для совершения процессуальных действий (ст. 113). Виды: законные/судебные, для суда/для лиц, по цели и исчислению. Ключевые: принятие иска — 5 дней (ст. 127), рассмотрение дела — 6 мес., включая подготовку (до 9 при сложности, ст. 152), подготовка — срок, определяемый судьёй (ст. 134), отзыв — в срок до заседания (ст. 131).","full":["Процессуальный срок — установленный АПК или назначенный арбитражным судом период времени, в течение которого совершается процессуальное действие либо наступают правовые последствия (ст. 113 АПК). Значение сроков: обеспечение своевременного рассмотрения дел, гарантия прав участников, дисциплина процесса, реализация принципа разумного срока (ст. 6.1 АПК).","Виды процессуальных сроков:","1) по способу установления: законные (установленные АПК и иными федеральными законами) и судебные (назначаемые судом в пределах своих полномочий);","2) по субъектам: сроки совершения действий судом (5 дней на принятие иска — ст. 127; 6 месяцев на рассмотрение дела, включая подготовку, — ст. 152) и сроки, установленные для лиц, участвующих в деле (на подачу отзыва — в срок, обеспечивающий возможность ознакомления, ст. 131; на обжалование — месяц, на устранение недостатков — срок, установленный судом);","3) по цели: организационные (подготовка, извещение) и юридико-фактические (сроки, истечение которых влечёт утрату права — например, срок на обжалование);","4) по характеру исчисления: исчисляемые днями, месяцами, годами.","Важнейшие законные сроки: принятие искового заявления — 5 дней (ст. 127); рассмотрение дела первой инстанцией — не более 6 месяцев со дня поступления заявления, включая подготовку дела и принятие решения, продление до 9 месяцев при особой сложности или значительном числе участников (ст. 152); рассмотрение апелляционной жалобы — 2 месяца, кассационной — 2 месяца; подготовка дела проводится в срок, определяемый судьёй с учётом обстоятельств дела (ст. 134); отзыв представляется в срок, обеспечивающий возможность ознакомления с ним до заседания (ст. 131).","Соблюдение сроков — обязанность участников: суд обязан совершать процессуальные действия в установленные сроки, а лица, участвующие в деле, — в сроки, установленные законом или судом; иначе наступают последствия (пропуск срока обжалования влечёт отказ, просрочка представления доказательств — их неисследование). Сроки носят пресекательный характер, но могут быть восстановлены и продлены в предусмотренных случаях (ст. 117–118 АПК)."],"learn":["Ст. 113–115 — установление, исчисление, последствия пропуска.","Законные / судебные сроки; сроки суда и сроки лиц, участвующих в деле.","5 дней — принятие иска (ст. 127); 6 месяцев — рассмотрение, включая подготовку (ст. 152); подготовка — срок, определяемый судьёй (ст. 134).","Сроки пресекательные, но восстанавливаемые.","Просрочка обжалования — отказ в восстановлении при неуважительности."],"norms":["Ст. 113 АПК РФ. «1. Процессуальные действия совершаются в сроки, установленные настоящим Кодексом или иными федеральными законами, а в случаях, если процессуальные сроки не установлены, они назначаются арбитражным судом. 2. Сроки совершения процессуальных действий определяются точной календарной датой, указанием на событие, которое обязательно должно наступить, или периодом, в течение которого действие может быть совершено. 3. Процессуальные сроки исчисляются годами, месяцами и днями. В сроки, исчисляемые днями, не включаются нерабочие дни …»","Ст. 152 АПК РФ. «1. Дело должно быть рассмотрено арбитражным судом первой инстанции в срок, не превышающий шести месяцев со дня поступления заявления в арбитражный суд, включая срок на подготовку дела к судебному разбирательству и на принятие решения по делу, если настоящим Кодексом не установлено иное …»"]},{"n":31,"title":"Исчисление, приостановление, восстановление и продление процессуальных сроков.","brief":"Исчисление: начало — следующий день после даты или события; в сроки в днях не включаются нерабочие дни; при нерабочем последнем дне — перенос; месяцы истекают в соответствующее число. Приостановление (ст. 116) — при приостановлении производства; течение продолжается после возобновления. Восстановление (ст. 117) — по уважительной причине, при соблюдении предельных сроков (ст. 259, 276, 291.2, 308.1, 312), одновременно с действием; продление (ст. 118) — назначенного судом срока до истечения.","full":["Исчисление процессуальных сроков (ст. 113–114 АПК). Сроки исчисляются годами, месяцами и днями; в сроки, исчисляемые днями, не включаются нерабочие дни (ч. 3 ст. 113). Течение срока начинается на следующий день после календарной даты или дня наступления события, которыми определено его начало (ч. 4 ст. 113). Срок, исчисляемый годами, истекает в соответствующий месяц и число последнего года; исчисляемый месяцами — в соответствующее число последнего месяца, а если в этом месяце такого числа нет — в последний день месяца; исчисляемый днями — в последний день срока (ч. 1–3 ст. 114). Если последний день приходится на нерабочий день, днём окончания считается первый следующий за ним рабочий день (ч. 4 ст. 114). Процессуальное действие может быть совершено до 24 часов последнего дня; документы, сданные на почту или переданные уполномоченному лицу до этого времени, считаются поданными в срок (ч. 5–6 ст. 114). Если действие должно быть совершено непосредственно в суде, срок истекает в час окончания рабочего дня (ч. 7 ст. 114).","Приостановление сроков (ст. 116 АПК): течение всех неистёкших процессуальных сроков приостанавливается одновременно с приостановлением производства по делу (ст. 143–144 АПК). Со дня возобновления производства течение сроков продолжается.","Восстановление сроков (ст. 117 АПК): пропущенный срок восстанавливается по ходатайству лица, участвующего в деле, если суд признает причины пропуска уважительными и не истекли предусмотренные ст. 259, 276, 291.2, 308.1 и 312 АПК предельные допустимые сроки. Ходатайство подаётся в суд, в котором должно быть совершено действие, и одновременно с ним совершается само пропущенное действие (подаётся заявление, жалоба, представляются документы). Ходатайство рассматривается в пятидневный срок в судебном заседании без извещения лиц; об отказе выносится определение, которое может быть обжаловано.","Продление сроков (ст. 118 АПК): назначенные арбитражным судом процессуальные сроки могут быть продлены судом по заявлению лица, участвующего в деле, по правилам ст. 117 АПК. Продление возможно до истечения срока (в отличие от восстановления — после его истечения) и касается только сроков, назначенных судом; законные сроки продлеваются лишь в случаях, прямо предусмотренных АПК. Определение об отказе в продлении может быть обжаловано."],"learn":["Ст. 113 ч. 3–4 — сроки в днях без нерабочих дней; начало — со следующего дня.","Ст. 114 — окончание сроков; нерабочий день → следующий рабочий; до 24:00.","Ст. 116 — приостановление при приостановлении производства, продолжение после возобновления.","Ст. 117 — восстановление: уважительность + предельные сроки + совершение действия; 5 дней.","Ст. 118 — продление назначенного судом срока до истечения."],"norms":["Ст. 113 АПК РФ. «3. Процессуальные сроки исчисляются годами, месяцами и днями. В сроки, исчисляемые днями, не включаются нерабочие дни. 4. Течение процессуального срока, исчисляемого годами, месяцами или днями, начинается на следующий день после календарной даты или дня наступления события, которыми определено начало процессуального срока.»","Ст. 114 АПК РФ. «1. Процессуальный срок, исчисляемый годами, истекает в соответствующий месяц и число последнего года установленного срока. 2. Процессуальный срок, исчисляемый месяцами, истекает в соответствующее число последнего месяца установленного срока. Если окончание процессуального срока, исчисляемого месяцами, приходится на месяц, который соответствующего числа не имеет, срок истекает в последний день этого месяца. 3. Процессуальный срок, исчисляемый днями, истекает в последний день установленного срока. 4. В случаях, если последний день процессуального срока приходится на нерабочий день, днем окончания срока считается первый следующий за ним рабочий день.»","Ст. 117 АПК РФ. «2. Арбитражный суд восстанавливает пропущенный процессуальный срок, если признает причины пропуска уважительными и если не истекли предусмотренные статьями 259, 276, 291.2, 308.1 и 312 настоящего Кодекса предельные допустимые сроки для восстановления. 3. Ходатайство о восстановлении пропущенного процессуального срока подается в арбитражный суд, в котором должно быть совершено процессуальное действие …»","Ст. 118 АПК РФ. «1. Назначенные арбитражным судом процессуальные сроки могут быть им продлены по заявлению лица, участвующего в деле, по правилам, предусмотренным статьей 117 настоящего Кодекса. 2. Определение арбитражного суда об отказе в продлении назначенного им процессуального срока может быть обжаловано.»"]},{"n":32,"title":"Понятие и виды судебных расходов. Освобождение от судебных расходов.","brief":"Судебные расходы (ст. 101 АПК) = государственная пошлина + судебные издержки. Пошлина — обязательный платёж в бюджет, её размеры установлены ст. 333.21 НК РФ; издержки (ст. 106) — выплаты экспертам, свидетелям, переводчикам, расходы на представителя, осмотр доказательств и иные расходы. Освобождение от пошлины — по ст. 105 АПК и гл. 25.3 НК (отдельные органы, прокурор, ЦБ и др.); возможны отсрочка, рассрочка, уменьшение размера. От издержек стороны не освобождаются, но экспертиза по инициативе суда оплачивается из бюджета.","full":["Судебные расходы — денежные затраты, связанные с рассмотрением и разрешением дела в арбитражном суде. Согласно ст. 101 АПК РФ судебные расходы состоят из государственной пошлины и судебных издержек, связанных с рассмотрением дела арбитражным судом.","Государственная пошлина — обязательный платёж, взимаемый в доход федерального бюджета при обращении в арбитражный суд. Порядок её уплаты, основания и размеры устанавливаются законодательством о налогах и сборах (ст. 102 АПК РФ, гл. 25.3 НК РФ, прежде всего ст. 333.21 НК РФ). Пошлина уплачивается до подачи заявления (если не предоставлены отсрочка, рассрочка или уменьшение размера), зачисляется в бюджет и не зависит от фактического результата рассмотрения дела.","Судебные издержки — денежные суммы, подлежащие выплате экспертам, специалистам, свидетелям, переводчикам; расходы на проведение осмотра доказательств на месте; расходы на оплату услуг адвокатов и иных лиц, оказывающих юридическую помощь (представителей); расходы юридического лица на уведомление о корпоративном споре, если такое уведомление обязательно по закону; иные расходы, понесённые лицами, участвующими в деле, в связи с рассмотрением дела (ст. 106 АПК РФ). В отличие от пошлины, издержки возмещают конкретным лицам (экспертам, свидетелям, представителям) и они не поступают в бюджет.","Виды судебных расходов, выделяемые в теории: 1) по субъекту несения — расходы истца, ответчика, третьих лиц; 2) по цели — расходы на ведение дела (представитель) и расходы на обеспечение доказательств (экспертиза, вызов свидетеля); 3) по порядку возмещения — возмещаемые по общему правилу пропорционально и относимые на сторону независимо от результата (ст. 111 АПК РФ); 4) по стадиям — расходы в первой, апелляционной, кассационной инстанциях и при исполнении.","Освобождение от судебных расходов. АПК РФ прямо говорит о льготах по уплате государственной пошлины (ст. 105 АПК РФ): они предоставляются в случаях и порядке, установленных законодательством о налогах и сборах. НК РФ освобождает от уплаты пошлины отдельные категории лиц — государственные органы, органы местного самоуправления и иные органы, выступающие по делам, рассматриваемым арбитражными судами, в защиту государственных или общественных интересов; прокуроров; Центральный банк РФ и ряд иных субъектов (ст. 333.35, 333.37 НК РФ). Кроме полного освобождения закон допускает отсрочку, рассрочку уплаты и уменьшение размера пошлины (ст. 333.41 НК РФ), а также возврат излишне уплаченной суммы (ст. 333.40 НК РФ).","От освобождения от пошлины следует отличать освобождение от возмещения судебных издержек: стороны от них не освобождаются, но расходы, связанные с оплатой экспертизы, назначенной по инициативе суда, оплачиваются за счёт средств федерального бюджета (ч. 3 ст. 109 АПК РФ). Судебные расходы могут быть возложены на лицо, злоупотребляющее процессуальными правами, независимо от результата дела (ст. 111 АПК РФ)."],"learn":["Ст. 101 АПК — два элемента: пошлина + издержки.","Ст. 102, 333.21 НК — пошлина: порядок и размеры.","Ст. 106 АПК — состав издержек: эксперты, свидетели, переводчики, представитель, осмотр, уведомление о корпоративном споре.","Ст. 105 АПК, ст. 333.35, 333.37, 333.41 НК — льготы, отсрочка, рассрочка, уменьшение.","Ч. 3 ст. 109 АПК — экспертиза по инициативе суда за счёт бюджета."],"norms":["Ст. 101 АПК РФ. «Судебные расходы состоят из государственной пошлины и судебных издержек, связанных с рассмотрением дела арбитражным судом.»","Ст. 106 АПК РФ. «К судебным издержкам, связанным с рассмотрением дела в арбитражном суде, относятся денежные суммы, подлежащие выплате экспертам, специалистам, свидетелям, переводчикам, расходы, связанные с проведением осмотра доказательств на месте, расходы на оплату услуг адвокатов и иных лиц, оказывающих юридическую помощь (представителей), расходы юридического лица на уведомление о корпоративном споре в случае, если федеральным законом предусмотрена обязанность такого уведомления, и другие расходы, понесенные лицами, участвующими в деле, в связи с рассмотрением дела в арбитражном суде.»","Ст. 105 АПК РФ. «Льготы по уплате государственной пошлины предоставляются в случаях и порядке, которые установлены законодательством Российской Федерации о налогах и сборах.»"]},{"n":33,"title":"Распределение судебных расходов между лицами, участвующими в деле.","brief":"Расходы распределяются по принципу «проигравший платит»: с проигравшей стороны, при частичном удовлетворении — пропорционально (ст. 110 АПК). Представительские расходы — в разумных пределах и только фактически понесённые. Пошлина, от которой истец освобождён, взыскивается с ответчика в бюджет. Специальные правила — ст. 111: нарушение досудебного порядка, злоупотребление правами, уменьшение чрезмерных расходов. Вопрос решается в решении или определении (ст. 112).","full":["Общее правило — «проигравший платит»: судебные расходы, понесённые лицами, участвующими в деле, в пользу которых принят судебный акт, взыскиваются арбитражным судом со стороны (ч. 1 ст. 110 АПК РФ). Если иск удовлетворён частично, расходы относятся на лиц, участвующих в деле, пропорционально размеру удовлетворённых требований. При отказе в иске полностью расходы несёт истец; при удовлетворении — ответчик.","Расходы на оплату услуг представителя взыскиваются с другого лица, участвующего в деле, в разумных пределах (ч. 2 ст. 110 АПК РФ). Разумность определяется судом с учётом объёма и сложности дела, времени, затраченного представителем, количества судебных заседаний, сложившейся в регионе стоимости аналогичных услуг, необходимости соблюдения баланса интересов сторон. Возмещаются только фактически понесённые и документально подтверждённые расходы.","Государственная пошлина, от уплаты которой истец был освобождён, взыскивается с ответчика в доход федерального бюджета пропорционально удовлетворённым требованиям, если ответчик не освобождён от пошлины (ч. 3 ст. 110 АПК РФ). При наличии соглашения лиц, участвующих в деле, о распределении расходов суд относит их в соответствии с этим соглашением (ч. 4 ст. 110 АПК РФ).","Расходы, понесённые в связи с рассмотрением апелляционной и кассационной жалоб, распределяются по тем же правилам (ч. 5 ст. 110 АПК РФ). Судебные издержки третьих лиц, не заявляющих самостоятельных требований, участвовавших на стороне, в пользу которой принят акт, могут быть возмещены, если их фактическое поведение способствовало принятию этого акта (ч. 5.1 ст. 110 АПК РФ). Если третье лицо обжаловало акт и жалоба оставлена без удовлетворения, издержки, связанные с её рассмотрением, могут быть взысканы с этого третьего лица (ч. 5.2 ст. 110 АПК РФ).","Специальные правила (ст. 111 АПК РФ): если спор возник вследствие нарушения лицом претензионного или иного досудебного порядка (нарушение срока ответа на претензию, оставление её без ответа), суд относит на это лицо расходы независимо от результатов рассмотрения дела; суд вправе отнести все расходы на лицо, злоупотребляющее процессуальными правами или не выполняющее обязанностей, если это привело к срыву заседания, затягиванию процесса или воспрепятствовало принятию законного акта; по заявлению лица, на которое возлагаются расходы, суд может уменьшить их размер при доказанности чрезмерности (ч. 3 ст. 111 АПК РФ).","Вопросы распределения расходов разрешаются в судебном акте, которым заканчивается рассмотрение дела, или отдельным определением; определение может быть обжаловано (ст. 112 АПК РФ). Неоплаченные расходы на экспертизу взыскиваются с лиц, участвующих в деле, пропорционально удовлетворённым требованиям, в пользу эксперта или экспертного учреждения (ч. 6 ст. 110 АПК РФ)."],"learn":["Ч. 1 ст. 110 — расходы с проигравшей стороны; частичный иск — пропорционально.","Ч. 2 ст. 110 — представительские расходы в разумных пределах.","Ч. 3 ст. 110 — пошлина, от которой истец освобождён, — с ответчика в бюджет.","Ч. 5.1–5.2 ст. 110 — издержки третьих лиц.","Ст. 111 — расходы независимо от результата при нарушении досудебного порядка и злоупотреблении; уменьшение чрезмерности.","Ст. 112 — определение о расходах, обжалуется."],"norms":["Ст. 110 АПК РФ. «1. Судебные расходы, понесенные лицами, участвующими в деле, в пользу которых принят судебный акт, взыскиваются арбитражным судом со стороны. В случае, если иск удовлетворен частично, судебные расходы относятся на лиц, участвующих в деле, пропорционально размеру удовлетворенных исковых требований. 2. Расходы на оплату услуг представителя, понесенные лицом, в пользу которого принят судебный акт, взыскиваются арбитражным судом с другого лица, участвующего в деле, в разумных пределах …»","Ст. 111 АПК РФ. «1. В случае, если спор возник вследствие нарушения лицом, участвующим в деле, претензионного или иного досудебного порядка урегулирования спора, предусмотренного федеральным законом или договором, в том числе нарушения срока представления ответа на претензию, оставления претензии без ответа, арбитражный суд относит на это лицо судебные расходы независимо от результатов рассмотрения дела …»"]},{"n":34,"title":"Государственная пошлина: виды, размеры, порядок уплаты.","brief":"Госпошлина — федеральный сбор, уплачивается до подачи заявления; размеры — ст. 333.21 НК РФ. Основные ставки: имущественный иск — прогрессивная шкала от 10 000 ₽ до 725 000 ₽ + 0,5 % (максимум 10 млн); неимущественный иск — 15 000 ₽ для граждан, 50 000 ₽ для организаций; ненормативный акт — 10 000 / 50 000 ₽; банкротство — 10 000 / 100 000 ₽; апелляция — 10 000 / 30 000 ₽; кассация — 20 000 / 50 000 ₽; ВС РФ — 30 000 / 80 000 ₽; обеспечение иска — 30 000 ₽. Возможны отсрочка, рассрочка, уменьшение, возврат.","full":["Государственная пошлина — обязательный федеральный сбор, взимаемый при обращении в арбитражный суд, а также при совершении отдельных процессуальных действий. Отношения по уплате пошлины регулируются гл. 25.3 НК РФ; АПК РФ отсылает к налоговому законодательству (ст. 102, 103, 104, 105 АПК РФ).","Виды пошлины по делам в арбитражных судах (ст. 333.21 НК РФ):","1) по имущественным искам, подлежащим оценке, — по прогрессивной шкале от цены иска: до 100 000 ₽ — 10 000 ₽; от 100 001 до 1 000 000 ₽ — 10 000 ₽ плюс 5 % суммы свыше 100 000 ₽; от 1 000 001 до 10 000 000 ₽ — 55 000 ₽ плюс 3 % суммы свыше 1 000 000 ₽; от 10 000 001 до 50 000 000 ₽ — 325 000 ₽ плюс 1 % суммы свыше 10 000 000 ₽; свыше 50 000 000 ₽ — 725 000 ₽ плюс 0,5 % суммы свыше 50 000 000 ₽, но не более 10 000 000 ₽;","2) по спорам о заключении, изменении, расторжении договоров без требования о возврате исполненного или о присуждении имущества, а также о признании сделок недействительными без применения последствий — 15 000 ₽ для физических лиц и 50 000 ₽ для организаций;","3) заявление о вынесении судебного приказа — 50 % пошлины по имущественному иску, но не менее 8 000 ₽;","4) имущественные иски, не подлежащие оценке, и неимущественные иски — 15 000 ₽ для физических лиц, 50 000 ₽ для организаций;","5) заявления об оспаривании нормативных актов в сфере интеллектуальной собственности — 10 000 ₽ для физических лиц, 60 000 ₽ для организаций; об оспаривании актов, содержащих разъяснения и обладающих нормативными свойствами, — также 10 000 / 60 000 ₽;","6) заявления о признании ненормативного акта недействительным, решений и действий (бездействия) органов и должностных лиц незаконными — 10 000 ₽ для физических лиц, 50 000 ₽ для организаций;","7) заявление о признании должника банкротом — 10 000 ₽ для физических лиц, 100 000 ₽ для организаций (должник при подаче собственного заявления пошлину не платит);","8) обособленные споры в деле о банкротстве — 50 % пошлины, определяемой по существу требования;","9) заявление об установлении фактов, имеющих юридическое значение, — 30 000 ₽;","10) заявление третьего лица с самостоятельными требованиями — по правилам имущественного или неимущественного иска;","11) заявление о правопреемстве (кроме универсального) — 5 000 ₽ для физических лиц, 25 000 ₽ для организаций;","12) заявления о выдаче исполнительного листа на решение третейского суда, о признании и приведении в исполнение иностранного решения — 30 % пошлины по имущественному иску от подтверждённой суммы; об отмене решения третейского суда — по правилам имущественного иска;","13) отдельные заявления (дубликат исполнительного листа, восстановление срока, отсрочка, разъяснение акта) — 10 000 ₽; пересмотр по новым или вновь открывшимся обстоятельствам — 30 000 ₽; обеспечение иска, замена или отмена обеспечения — 30 000 ₽;","14) компенсация за нарушение права на судопроизводство в разумный срок — 300 ₽ для физических лиц, 6 000 ₽ для организаций;","15) апелляционная жалоба — 10 000 ₽ для физических лиц, 30 000 ₽ для организаций; кассационная жалоба — 20 000 / 50 000 ₽; кассационная или надзорная жалоба в Верховный Суд РФ — 30 000 / 80 000 ₽.","Порядок уплаты. Пошлина уплачивается до подачи заявления (жалобы) по реквизитам соответствующего суда; факт уплаты подтверждается платёжным документом, который прилагается к заявлению (п. 2 ч. 1 ст. 126 АПК РФ). При неуплате или неполной уплате заявление оставляется без движения, а при неустранении недостатка возвращается (ст. 128, п. 2 ст. 129 АПК РФ). Закон допускает отсрочку, рассрочку, уменьшение размера пошлины (ст. 333.41 НК РФ), а также освобождение отдельных категорий лиц (ст. 333.35, 333.37 НК РФ). Излишне уплаченная пошлина возвращается или зачитывается в порядке ст. 333.40 НК РФ; вопрос о возврате решается судом, в том числе в определении о возвращении заявления или прекращении производства.","Цена иска определяется по правилам ст. 103 АПК РФ: по искам о взыскании денежных средств — исходя из взыскиваемой суммы; об истребовании имущества — исходя из его стоимости; в цену включаются неустойка, штраф, пени и проценты; цена иска из нескольких требований — сумма всех требований. Цена иска указывается заявителем, при неправильном указании определяется судом. По искам о признании права пошлина уплачивается как по неимущественному требованию (ч. 2 ст. 103 АПК РФ)."],"learn":["Ст. 333.21 НК — все размеры; ст. 333.22 НК — особенности.","Имущественный иск — шкала: 10 тыс. → 55 тыс. → 325 тыс. → 725 тыс. + 0,5 %, максимум 10 млн.","Неимущественный — 15 000 / 50 000 ₽; ненормативный акт — 10 000 / 50 000 ₽.","Обеспечение иска — 30 000 ₽; апелляция — 10 000 / 30 000 ₽; кассация — 20 000 / 50 000 ₽.","Ст. 103 АПК — цена иска; ст. 333.41 НК — отсрочка, рассрочка, уменьшение."],"norms":["Ст. 102 АПК РФ. «Основания и порядок уплаты государственной пошлины, а также порядок предоставления отсрочки или рассрочки уплаты государственной пошлины устанавливаются в соответствии с законодательством Российской Федерации о налогах и сборах.»","Ст. 104 АПК РФ. «Основания и порядок возврата или зачета государственной пошлины устанавливаются в соответствии с законодательством Российской Федерации о налогах и сборах.»","Ст. 103 АПК РФ. «1. Цена иска определяется: 1) по искам о взыскании денежных средств, исходя из взыскиваемой суммы; 2) по искам о признании не подлежащим исполнению исполнительного или иного документа, по которому взыскание производится в бесспорном (безакцептном) порядке, исходя из оспариваемой денежной суммы; 3) по искам об истребовании имущества, исходя из стоимости истребуемого имущества; 4) по искам об истребовании земельного участка, исходя из стоимости земельного участка. В цену иска включаются также указанные в исковом заявлении суммы неустойки (штраф, пени) и проценты. Цена иска, состоящего из нескольких самостоятельных требований, определяется суммой всех требований …»"]},{"n":35,"title":"Судебные издержки: понятие, состав, порядок оплаты.","brief":"Судебные издержки (ст. 106 АПК) — выплаты экспертам, специалистам, свидетелям, переводчикам, расходы на осмотр доказательств, представителя, уведомление о корпоративном споре и иные необходимые расходы. Оплата: возмещение проезда и суточных (ст. 107), депозит на экспертизу и свидетелей (ст. 108), выплаты по исполнении обязанностей (ст. 109). Распределяются по ст. 110 — с проигравшей стороны, представительские — в разумных пределах.","full":["Судебные издержки — денежные суммы, подлежащие выплате участникам процесса и иные затраты, связанные с рассмотрением дела, помимо государственной пошлины. Их открытый перечень дан в ст. 106 АПК РФ: суммы, подлежащие выплате экспертам, специалистам, свидетелям, переводчикам; расходы, связанные с проведением осмотра доказательств на месте; расходы на оплату услуг адвокатов и иных лиц, оказывающих юридическую помощь (представителей); расходы юридического лица на уведомление о корпоративном споре, если федеральным законом предусмотрена обязанность такого уведомления; другие расходы, понесённые лицами, участвующими в деле, в связи с рассмотрением дела.","Состав издержек принято классифицировать: 1) выплаты содействующим лицам — экспертам, специалистам, свидетелям, переводчикам (проезд, наём жилья, суточные, вознаграждение); 2) расходы на представителя; 3) расходы на обеспечение доказательств — осмотр на месте, хранение вещественных доказательств; 4) обязательные уведомления (корпоративный спор); 5) иные необходимые расходы (почтовые, на копирование, если они вызваны требованиями процесса).","Порядок оплаты. Экспертам, специалистам, свидетелям и переводчикам возмещаются расходы на проезд, наём жилого помещения и суточные (ч. 1 ст. 107 АПК РФ). Эксперты и специалисты получают вознаграждение за работу по поручению суда, если она не входит в их служебные обязанности; размер вознаграждения эксперту определяется судом по согласованию с лицами, участвующими в деле, и по соглашению с экспертом (ч. 2 ст. 107 АПК РФ). Переводчик получает вознаграждение по соглашению с судом (ч. 3 ст. 107 АПК РФ). Работающим свидетелям сохраняется средний заработок за время отсутствия в связи с явкой в суд, а не состоящим в трудовых отношениях выплачивается компенсация (ч. 4 ст. 107 АПК РФ).","Денежные суммы, подлежащие выплате экспертам и свидетелям, вносятся на депозитный счёт арбитражного суда лицом, заявившим ходатайство, в срок, установленный судом; если ходатайство заявлено обеими сторонами — в равных частях (ч. 1 ст. 108 АПК РФ). При невнесении сумм суд вправе отклонить ходатайство о назначении экспертизы или вызове свидетеля, если дело может быть рассмотрено на основе других доказательств (ч. 2 ст. 108 АПК РФ). Выплаты производятся по выполнении обязанностей; суммы экспертам и свидетелям выплачиваются с депозита, а оплата переводчика и специалиста, привлечённых судом, а также выплаты при назначении экспертизы или вызове свидетеля по инициативе суда — за счёт средств федерального бюджета (ст. 109 АПК РФ).","Распределение издержек производится по правилам ст. 110 АПК РФ: с проигравшей стороны, при частичном удовлетворении — пропорционально; представительские расходы — в разумных пределах. Неоплаченные расходы на экспертизу взыскиваются в пользу эксперта или экспертного учреждения с лиц, участвующих в деле, пропорционально удовлетворённым требованиям (ч. 6 ст. 110 АПК РФ). Издержки третьих лиц возмещаются по правилам ч. 5.1–5.2 ст. 110 АПК РФ."],"learn":["Ст. 106 АПК — открытый перечень издержек.","Ст. 107 — проезд, жильё, суточные, вознаграждение эксперта и переводчика.","Ст. 108 — депозит; при невнесении суд вправе отклонить ходатайство.","Ст. 109 — выплаты по исполнении; экспертиза по инициативе суда — из бюджета.","Ст. 110 — распределение; представительские — в разумных пределах."],"norms":["Ст. 106 АПК РФ. «К судебным издержкам, связанным с рассмотрением дела в арбитражном суде, относятся денежные суммы, подлежащие выплате экспертам, специалистам, свидетелям, переводчикам, расходы, связанные с проведением осмотра доказательств на месте, расходы на оплату услуг адвокатов и иных лиц, оказывающих юридическую помощь (представителей), расходы юридического лица на уведомление о корпоративном споре в случае, если федеральным законом предусмотрена обязанность такого уведомления, и другие расходы, понесенные лицами, участвующими в деле, в связи с рассмотрением дела в арбитражном суде.»","Ст. 107 АПК РФ. «1. Экспертам, специалистам, свидетелям и переводчикам возмещаются понесенные ими в связи с явкой в арбитражный суд расходы на проезд, расходы на наем жилого помещения и дополнительные расходы, связанные с проживанием вне места постоянного жительства (суточные) …»","Ст. 108 АПК РФ. «1. Денежные суммы, подлежащие выплате экспертам и свидетелям, вносятся на депозитный счет арбитражного суда лицом, заявившим соответствующее ходатайство, в срок, установленный арбитражным судом. Если указанное ходатайство заявлено обеими сторонами, требуемые денежные суммы вносятся сторонами на депозитный счет арбитражного суда в равных частях …»"]},{"n":36,"title":"Понятие, виды и основания применения обеспечительных мер.","brief":"Обеспечительные меры (ст. 90 АПК) — срочные временные меры для обеспечения иска или имущественных интересов заявителя. Основания: невозможность или затруднительность исполнения акта, угроза значительного ущерба; допускаются на любой стадии, должны быть соразмерны. Виды (ст. 91): арест имущества и денег, запрет действий, возложение обязанности, передача имущества на хранение, приостановление безакцептного взыскания и реализации имущества, иные меры. Заявление рассматривается в день поступления/на следующий день без извещения (ст. 92–93); исполнение немедленное (ст. 96); отмена — ст. 97; убытки — ст. 98.","full":["Обеспечительные меры — срочные временные меры, принимаемые арбитражным судом по заявлению лица, участвующего в деле, а в случаях, предусмотренных АПК, и иного лица, направленные на обеспечение иска или имущественных интересов заявителя (ч. 1 ст. 90 АПК РФ). Их цель — сохранить возможность реального исполнения будущего судебного акта и предотвратить причинение значительного ущерба заявителю.","Основания применения (ч. 2 ст. 90 АПК РФ): 1) непринятие мер может затруднить или сделать невозможным исполнение судебного акта, в том числе если исполнение предполагается за пределами РФ; 2) необходимость предотвращения причинения значительного ущерба заявителю. Обеспечительные меры допускаются на любой стадии процесса — при подаче иска, в ходе подготовки, разбирательства, а также при отложении разбирательства в целях урегулирования спора. Меры должны быть соразмерны заявленному требованию (ч. 2 ст. 91 АПК РФ).","Виды обеспечительных мер (ст. 91 АПК РФ): 1) наложение ареста на денежные средства (в том числе будущие поступления на счёт) или иное имущество ответчика, находящееся у него или других лиц; 2) запрещение ответчику и другим лицам совершать определённые действия, касающиеся предмета спора; 3) возложение на ответчика обязанности совершить действия для предотвращения порчи или ухудшения состояния спорного имущества; 4) передача спорного имущества на хранение истцу или другому лицу; 5) приостановление взыскания по оспариваемому исполнительному или иному документу, взыскание по которому производится в бесспорном (безакцептном) порядке; 6) приостановление реализации имущества при предъявлении иска об освобождении имущества от ареста. Суд может принять иные меры и несколько мер одновременно.","Порядок. Заявление подаётся одновременно с иском или в процессе производства до принятия судебного акта, которым заканчивается рассмотрение дела по существу; ходатайство может быть включено в исковое заявление (ст. 92 АПК РФ). В заявлении указываются суд, стороны, предмет спора, размер имущественных требований, обоснование причины обращения, конкретная мера и перечень документов. Заявление рассматривается судьёй единолично не позднее следующего дня после поступления без извещения сторон (ч. 1.1 ст. 93 АПК РФ). По результатам выносится определение об обеспечении иска или об отказе; копии направляются лицам, участвующим в деле, и органам, регистрирующим имущество. Определение об обеспечении приводится в исполнение немедленно, на его основании выдаётся исполнительный лист (ст. 96 АПК РФ).","Прекращение мер. Обеспечение иска может быть отменено по ходатайству лица, участвующего в деле, в пятидневный срок (ст. 97 АПК РФ); возможна замена одной меры другой (ст. 95 АПК РФ). При удовлетворении иска меры сохраняются до фактического исполнения акта; при отказе в иске, оставлении иска без рассмотрения или прекращении производства — до вступления акта в законную силу (ч. 4–5 ст. 96 АПК РФ). Лицо, по заявлению которого приняты меры, при отказе в иске обязано возместить убытки или выплатить компенсацию (ст. 98 АПК РФ)."],"learn":["Ст. 90 — понятие, два основания, любая стадия.","Ст. 91 — перечень мер + соразмерность (ч. 2).","Ст. 92–93 — заявление и рассмотрение единолично не позднее следующего дня без извещения.","Ст. 95–96 — замена мер и немедленное исполнение.","Ст. 97–98 — отмена мер и ответственность за убытки."],"norms":["Ст. 90 АПК РФ. «1. Арбитражный суд по заявлению лица, участвующего в деле, а в случаях, предусмотренных настоящим Кодексом, и иного лица может принять срочные временные меры, направленные на обеспечение иска или имущественных интересов заявителя (обеспечительные меры), в том числе в случае отложения судебного разбирательства в целях урегулирования спора. 2. Обеспечительные меры допускаются на любой стадии арбитражного процесса, если непринятие этих мер может затруднить или сделать невозможным исполнение судебного акта, в том числе если исполнение судебного акта предполагается за пределами Российской Федерации, а также в целях предотвращения причинения значительного ущерба заявителю …»","Ст. 91 АПК РФ. «1. Обеспечительными мерами могут быть: 1) наложение ареста на денежные средства (в том числе денежные средства, которые будут поступать на банковский счет) или иное имущество, принадлежащие ответчику и находящиеся у него или других лиц; 2) запрещение ответчику и другим лицам совершать определенные действия, касающиеся предмета спора; 3) возложение на ответчика обязанности совершить определенные действия в целях предотвращения порчи, ухудшения состояния спорного имущества; 4) передача спорного имущества на хранение истцу или другому лицу; 5) приостановление взыскания по оспариваемому истцом исполнительному или иному документу, взыскание по которому производится в бесспорном (безакцептном) порядке …»","Ст. 93 АПК РФ. «1.1. Рассмотрение заявления об обеспечении иска арбитражным судом, в производстве которого находится дело, осуществляется судьей единолично не позднее следующего дня после дня поступления заявления в суд без извещения сторон …»"]},{"n":37,"title":"Понятие, основания и порядок предоставления встречного обеспечения.","brief":"Встречное обеспечение (ст. 94 АПК) — гарантия возмещения убытков ответчика от обеспечительных мер. Суд может потребовать его по ходатайству ответчика или предложить по инициативе. Формы: депозит, банковская гарантия, поручительство, иное финансовое обеспечение. Размер — в пределах требований истца с процентами, но не менее половины; срок предоставления — до 15 дней. При неисполнении — отказ в обеспечении; ответчик может предоставить встречное обеспечение взамен ареста.","full":["Встречное обеспечение — предоставление лицом, ходатайствующим об обеспечении иска, гарантий возмещения возможных для ответчика убытков от принятия обеспечительных мер. Институт закреплён в ст. 94 АПК РФ и служит балансу интересов сторон: истец получает защиту, ответчик — источник компенсации на случай, если иск окажется необоснованным.","Основания. Арбитражный суд, допуская обеспечение иска, по ходатайству ответчика может потребовать от заявителя предоставить встречное обеспечение либо предложить его по собственной инициативе (ч. 1 ст. 94 АПК РФ). Встречное обеспечение может быть предоставлено и самим ответчиком взамен мер по обеспечению иска о взыскании денежной суммы путём внесения на депозитный счёт суда денежных средств в размере требований истца (ч. 2 ст. 94 АПК РФ).","Формы: внесение денежных средств на депозитный счёт арбитражного суда; банковская гарантия; поручительство; иное финансовое обеспечение на ту же сумму.","Размер: устанавливается в пределах имущественных требований истца, указанных в заявлении, а также суммы процентов от этих требований; не может быть менее половины размера имущественных требований (ч. 1 ст. 94 АПК РФ).","Порядок. О встречном обеспечении суд выносит определение не позднее следующего дня после поступления заявления об обеспечении иска; в определении указываются размер обеспечения и срок его предоставления, который не может превышать пятнадцать дней со дня вынесения определения; копия направляется лицам, участвующим в деле, не позднее следующего дня (ч. 3 ст. 94 АПК РФ). Определение может быть обжаловано. После вынесения определения о встречном обеспечении суд не рассматривает заявление об обеспечении иска до представления документа, подтверждающего его предоставление (ч. 4 ст. 94 АПК РФ). По представлении документа или по истечении срока суд не позднее следующего дня рассматривает заявление по правилам ст. 93 АПК РФ (ч. 5).","Последствия. Неисполнение определения о встречном обеспечении в установленный срок может быть основанием для отказа в обеспечении иска (ч. 6 ст. 94 АПК РФ). Представление ответчиком документа о встречном обеспечении является основанием для отказа в обеспечении иска или для его отмены (ч. 7). Правила ст. 94, кроме ч. 2 и 7, не применяются к заявлениям Банка России о предварительных обеспечительных мерах и об обеспечении по делам о привлечении контролирующих лиц к субсидиарной ответственности (ч. 8)."],"learn":["Ст. 94 АПК — понятие и основания встречного обеспечения.","Формы: депозит суда, банковская гарантия, поручительство, иное финансовое обеспечение.","Размер — в пределах требований + проценты, не менее 1/2 требований.","Срок — не более 15 дней; определение обжалуется.","Ч. 2, 7 — встречное обеспечение ответчика взамен ареста; основание для отказа/отмены мер."],"norms":["Ст. 94 АПК РФ. «1. Арбитражный суд, допуская обеспечение иска, по ходатайству ответчика может потребовать от обратившегося с заявлением об обеспечении иска лица или предложить ему по собственной инициативе предоставить обеспечение возмещения возможных для ответчика убытков (встречное обеспечение) путем внесения на депозитный счет суда денежных средств в размере, предложенном судом, либо предоставления банковской гарантии, поручительства или иного финансового обеспечения на ту же сумму. Размер встречного обеспечения может быть установлен в пределах имущественных требований истца, указанных в его заявлении, а также суммы процентов от этих требований. Размер встречного обеспечения не может быть менее половины размера имущественных требований …»","Ст. 94 АПК РФ. «3. О встречном обеспечении арбитражный суд выносит определение не позднее следующего дня после дня поступления в суд заявления об обеспечении иска. В определении указываются размер встречного обеспечения и срок его предоставления, который не может превышать пятнадцать дней со дня вынесения определения. Копия определения направляется лицам, участвующим в деле, не позднее следующего дня после дня вынесения определения. Определение о встречном обеспечении может быть обжаловано …»"]},{"n":38,"title":"Понятие и порядок применения предварительных обеспечительных мер.","brief":"Предварительные обеспечительные меры (ст. 99 АПК) — меры до предъявления иска для защиты имущественных интересов заявителя. Подаются по адресу заявителя, месту нахождения имущества или месту нарушения прав. Требуется встречное обеспечение (кроме Банка России); в определении устанавливается срок подачи иска — до 15 дней (при обязательном досудебном порядке — 5 дней после его истечения). При неподаче иска меры отменяются; после подачи действуют как меры по обеспечению иска. Убытки — по ст. 98.","full":["Предварительные обеспечительные меры — меры, принимаемые арбитражным судом по заявлению организации или гражданина до предъявления иска и направленные на обеспечение имущественных интересов заявителя (ч. 1 ст. 99 АПК РФ). Их цель — защитить имущественное положение будущего истца в период, когда иск ещё не подан (например, предотвратить вывод активов должником).","Особенности правового режима:","1) применяются по правилам гл. 8 АПК о обеспечительных мерах с особенностями ст. 99 АПК РФ (ч. 2);","2) заявление подаётся по адресу заявителя, либо по месту нахождения денежных средств или иного имущества, в отношении которого испрашиваются меры, либо по месту нарушения прав заявителя (ч. 3). По корпоративным спорам (ст. 225.1 АПК) — по адресу юридического лица, а если спор вытекает из деятельности держателя реестра ценных бумаг — по месту нахождения эмитента (ч. 3.1);","3) при подаче заявления заявитель представляет документ, подтверждающий встречное обеспечение в размере указанной в заявлении суммы (ч. 4). При его отсутствии суд вправе предложить встречное обеспечение и оставляет заявление без движения по ст. 128 АПК до представления документа. Для заявления Банка России о предварительных мерах по ч. 1.1 встречное обеспечение не требуется;","4) об обеспечении имущественных интересов выносится определение. Если по требованию обязателен досудебный порядок, в определении устанавливаются срок направления претензии (не более 15 дней) и срок подачи иска (не более 5 дней со дня истечения срока досудебного урегулирования); если досудебный порядок не обязателен — срок подачи иска не более 15 дней со дня вынесения определения (ч. 5). Для Банка России — срок не более 30 дней;","5) должник вправе ходатайствовать о замене предварительных мер встречным обеспечением по ч. 2 ст. 94 АПК РФ (ч. 6);","6) иск подаётся в суд, вынесший определение, или в иной суд; заявитель сообщает суду о направлении претензии и о подаче иска в другой суд (ч. 7);","7) если заявитель не представил доказательства направления претензии либо подачи иска в установленный срок, обеспечение отменяется тем же судом с вынесением определения (ч. 8);","8) после подачи иска в срок предварительные меры действуют как меры по обеспечению иска (ч. 9);","9) лица, чьи права нарушены предварительными мерами, вправе требовать от заявителя возмещения убытков или компенсации по ст. 98 АПК РФ, если иск не был подан в срок или в иске отказано (ч. 10).","Порядок рассмотрения заявления — по ст. 93 АПК РФ: судья единолично, не позднее следующего дня после поступления заявления, без извещения сторон; по результатам — определение об обеспечении или об отказе, которое может быть обжаловано. Меры исполняются немедленно (ст. 96 АПК РФ)."],"learn":["Ст. 99 АПК — предварительные меры до иска.","Подсудность — адрес заявителя, место имущества, место нарушения прав.","Встречное обеспечение обязательно (кроме Банка России).","Срок подачи иска — до 15 дней (при досудебном порядке — 5 дней после его истечения).","Неподача иска → отмена мер; после подачи — действуют как обеспечение иска."],"norms":["Ст. 99 АПК РФ. «1. Арбитражный суд по заявлению организации или гражданина вправе принять предварительные обеспечительные меры, направленные на обеспечение имущественных интересов заявителя до предъявления иска. Заявление об обеспечении имущественных интересов, подаваемое в электронном виде, должно быть подписано усиленной квалифицированной электронной подписью.»","Ст. 99 АПК РФ. «3. Заявление об обеспечении имущественных интересов подается в арбитражный суд по адресу заявителя, либо по месту нахождения денежных средств или иного имущества, в отношении которых заявитель ходатайствует о принятии мер по обеспечению имущественных интересов, либо по месту нарушения прав заявителя …»","Ст. 99 АПК РФ. «5. Об обеспечении имущественных интересов арбитражный суд выносит определение. В случае, если по требованию, в связи с которым подано заявление об обеспечении имущественных интересов, в силу закона обязательно соблюдение претензионного или иного досудебного порядка урегулирования спора, в определении устанавливаются срок для направления претензии (требования) другой стороне, не превышающий пятнадцати дней со дня вынесения определения, и срок для подачи искового заявления по такому требованию, не превышающий пяти дней со дня истечения установленного законом или договором срока для принятия сторонами мер по досудебному урегулированию в соответствии с частью 5 статьи 4 настоящего Кодекса …»"]},{"n":39,"title":"Порядок предъявления иска в арбитражный суд.","brief":"Иск подаётся с соблюдением компетенции и подсудности, требований ст. 125–126 АПК: форма и содержание, госпошлина, документы, направление копий другим лицам. Судья единолично в 5 дней решает вопрос о принятии и выносит определение о возбуждении производства (ст. 127). Несоблюдение требований влечёт оставление без движения (ст. 128), возвращение (ст. 129) или отказ в принятии (ст. 127.1); несоблюдение досудебного порядка — возвращение или оставление без рассмотрения.","full":["Предъявление иска — обращение в арбитражный суд с требованием о защите нарушенного или оспариваемого права. Порядок включает соблюдение компетенции и подсудности, требований к форме и содержанию заявления, уплату госпошлины, направление копий другим лицам и представление необходимых документов.","1. Компетенция и подсудность. Заявление подаётся в арбитражный суд, к компетенции которого отнесён спор (ст. 27–33 АПК РФ), с соблюдением родовой (ст. 34) и территориальной (ст. 35–38) подсудности. Нарушение правил подсудности влечёт возвращение заявления (п. 1 ч. 1 ст. 129 АПК РФ).","2. Форма и содержание (ст. 125 АПК РФ). Исковое заявление подаётся на бумажном носителе или в электронном виде, в том числе в форме электронного документа; подписывается истцом или его представителем. Заявление в электронном виде, содержащее ходатайство об обеспечении иска, должно быть подписано усиленной квалифицированной электронной подписью. В заявлении указываются: наименование суда; сведения об истце (для гражданина — ФИО, дата и место рождения, место жительства, место работы или дата регистрации в качестве ИП, один из идентификаторов, контакты; для организации — наименование, адрес, ИНН, контакты); сведения об ответчике (для гражданина — ФИО, дата и место рождения, место жительства, место работы, идентификатор; для организации — наименование, адрес, ИНН, ОГРН); требования к ответчику со ссылкой на законы и иные нормативные акты, а при нескольких ответчиках — к каждому; обстоятельства, на которых основаны требования, и подтверждающие доказательства; цена иска, если он подлежит оценке; расчёт взыскиваемой или оспариваемой суммы; сведения о соблюдении претензионного или иного досудебного порядка; сведения о действиях, направленных на примирение, если они предпринимались; сведения о мерах по обеспечению имущественных интересов до предъявления иска; перечень прилагаемых документов. Могут указываться иные сведения и ходатайства.","3. Документы (ст. 126 АПК РФ). Прилагаются: уведомление о вручении или иные документы, подтверждающие направление копий заявления и приложений другим лицам; документ об уплате госпошлины либо о праве на льготу, либо ходатайство об отсрочке, рассрочке, уменьшении размера; документы, подтверждающие обстоятельства требований; доверенность или иные документы о полномочиях подписанта, а также копии документов о высшем юридическом образовании или учёной степени представителя либо документов о статусе адвоката, патентного поверенного, арбитражного управляющего, единоличного органа; копия определения об обеспечении имущественных интересов до иска; документы о соблюдении досудебного порядка (если он обязателен); документы о примирительных действиях; проект договора при требовании о понуждении заключить договор; выписка из ЕГРЮЛ или ЕГРИП (либо иной документ), полученная не ранее чем за 30 дней до обращения.","4. Направление копий. Истец обязан направить другим лицам, участвующим в деле, копии заявления и приложений, которые у них отсутствуют, заказным письмом с уведомлением или в электронном виде через единый портал госуслуг либо систему электронного документооборота (ч. 3 ст. 125 АПК РФ).","5. Принятие к производству. Вопрос решается судьёй единолично в пятидневный срок со дня поступления заявления (ч. 1 ст. 127 АПК РФ). Суд обязан принять заявление, поданное с соблюдением требований к форме и содержанию; о принятии выносится определение, которым возбуждается производство, указываются действия по подготовке дела, сроки их совершения и контактные данные суда; копии направляются лицам не позднее следующего дня (ч. 2–5 ст. 127 АПК РФ).","6. Досудебный порядок. Если для категории спора он обязателен (ч. 5 ст. 4 АПК РФ), истец должен приложить доказательства его соблюдения; несоблюдение влечёт возвращение заявления (п. 5 ч. 1 ст. 129 АПК РФ) либо оставление иска без рассмотрения (п. 2 ч. 1 ст. 148 АПК РФ)."],"learn":["Ст. 125 АПК — форма, содержание, направление копий.","Ст. 126 АПК — прилагаемые документы; выписка ЕГРЮЛ/ЕГРИП не старше 30 дней.","Ст. 127 АПК — принятие единолично в 5 дней, определение о возбуждении дела.","Ст. 128, 129, 127.1 — оставление без движения, возвращение, отказ в принятии.","Ч. 5 ст. 4, п. 5 ч. 1 ст. 129, п. 2 ч. 1 ст. 148 — досудебный порядок."],"norms":["Ст. 125 АПК РФ. «1. Исковое заявление подается в арбитражный суд на бумажном носителе или в электронном виде, в том числе в форме электронного документа. Исковое заявление подписывается истцом или его представителем. Исковое заявление, подаваемое в электронном виде, содержащее ходатайство об обеспечении иска, должно быть подписано усиленной квалифицированной электронной подписью.»","Ст. 125 АПК РФ. «2. В исковом заявлении должны быть указаны: 1) наименование арбитражного суда, в который подается исковое заявление; 2) сведения об истце: для гражданина — фамилия, имя, отчество (при наличии), дата и место рождения, место жительства или место пребывания, место работы или дата и место государственной регистрации в качестве индивидуального предпринимателя и один из …»","Ст. 127 АПК РФ. «1. Вопрос о принятии искового заявления к производству арбитражного суда решается судьей единолично в пятидневный срок со дня поступления искового заявления в арбитражный суд …»"]},{"n":40,"title":"Процессуально-правовые последствия несоблюдения порядка предъявления искового заявления.","brief":"Последствия несоблюдения порядка: отказ в принятии (ст. 127.1 — тождественный спор, неподведомственность, третейское решение), оставление без движения (ст. 128 — нарушения ст. 125–126, срок на устранение), возвращение (ст. 129 — неподсудность, приказное производство, неустранение недостатков, отсутствие досудебного порядка, подпись без полномочий), оставление без рассмотрения (ст. 148 — досудебный порядок, тождественный спор, повторная неявка), прекращение производства (ст. 150 — дело не подлежит рассмотрению, отказ от иска, мировое соглашение, ликвидация).","full":["Несоблюдение установленного порядка предъявления иска влечёт различные процессуальные последствия в зависимости от характера нарушения и момента его обнаружения. Основные варианты: отказ в принятии заявления, оставление без движения, возвращение заявления, оставление иска без рассмотрения, прекращение производства.","1. Отказ в принятии искового заявления (ст. 127.1 АПК РФ). Судья отказывает, если: заявление подлежит рассмотрению в порядке конституционного или уголовного судопроизводства либо не подлежит рассмотрению в судах; имеется вступивший в законную силу судебный акт арбитражного суда, суда общей юрисдикции или компетентного иностранного суда, принятый по спору между теми же лицами, о том же предмете и по тем же основаниям (кроме случаев отказа в признании и приведении в исполнение иностранного решения), а также определение о прекращении производства в связи с отказом от иска или утверждением мирового соглашения либо об отказе в принятии заявления; имеется ставшее обязательным для сторон решение третейского суда по тому же спору (кроме случаев отказа в выдаче исполнительного листа или отмены решения). Об отказе выносится определение с решением вопроса о возврате пошлины; копия с заявлением и документами направляется не позднее пяти дней. Отказ препятствует повторному обращению с такими же требованиями (ч. 4 ст. 127.1 АПК РФ); определение может быть обжаловано.","2. Оставление заявления без движения (ст. 128 АПК РФ). Применяется, если заявление подано с нарушением требований ст. 125 и 126 АПК РФ (нет подписи, не указаны необходимые сведения, не приложены документы, не уплачена пошлина и т.п.). Суд выносит определение, в котором указывает основания и срок для устранения недостатков; копия направляется истцу не позднее следующего дня. Если недостатки устранены в срок, заявление считается поданным в день первоначального поступления и принимается к производству (ч. 3). Если не устранены — заявление возвращается по ст. 129 АПК РФ (ч. 4).","3. Возвращение искового заявления (ст. 129 АПК РФ). Основания: дело неподсудно данному арбитражному суду или подсудно суду общей юрисдикции; требования подлежат рассмотрению в порядке приказного производства; до принятия заявления истец заявил ходатайство о его возвращении; не устранены недостатки, послужившие основанием для оставления без движения; не соблюдён обязательный претензионный или иной досудебный порядок; заявление не подписано или подписано лицом без полномочий. Суд также возвращает заявление, если отклонено ходатайство об отсрочке, рассрочке или уменьшении пошлины. О возвращении выносится определение с решением вопроса о возврате пошлины; копия направляется истцу не позднее следующего дня (или после истечения срока на устранение недостатков). Определение может быть обжаловано; при его отмене заявление считается поданным в день первоначального обращения (ч. 4–5). Возвращение не препятствует повторному обращению после устранения обстоятельств (ч. 6).","4. Оставление иска без рассмотрения (ст. 148 АПК РФ). Применяется, в частности, если: в производстве суда, третейского суда или иного органа имеется дело по спору между теми же лицами, о том же предмете и по тем же основаниям; истцом не соблюдён обязательный досудебный порядок; заявление подписано лицом без полномочий; в деле отсутствует ответчик, надлежаще извещённый о месте нахождения (при отсутствии сведений); истец повторно не явился в заседание, в том числе по вызову для дачи объяснений, и не заявил ходатайство о рассмотрении в его отсутствие, а ответчик не требует рассмотрения по существу; стороны заключили соглашение о передаче спора в третейский суд и др. Оставление без рассмотрения не препятствует повторному обращению (ст. 149 АПК РФ).","5. Прекращение производства (ст. 150 АПК РФ) — если дело не подлежит рассмотрению в арбитражном суде (например, спор неподведомственен), имеется вступивший в силу акт по тождественному спору, истец отказался от иска и отказ принят судом, стороны заключили мировое соглашение и оно утверждено, организация-сторона ликвидирована и т.п. Повторное обращение исключается.","6. Иные последствия: при неуплате пошлины — оставление без движения; при неподсудности — возвращение; при отсутствии полномочий представителя — заявление возвращается или оставляется без рассмотрения; при нарушении правил о соединении требований суд может разъединить их (ст. 130 АПК РФ). Обжалование определений об отказе в принятии, возвращении, оставлении без движения — в апелляционном порядке."],"learn":["Ст. 127.1 — отказ в принятии; повторное обращение не допускается.","Ст. 128 — оставление без движения; срок на устранение; затем возврат.","Ст. 129 — возвращение: неподсудность, приказное производство, досудебный порядок, подпись.","Ст. 148 — оставление без рассмотрения; ст. 150 — прекращение производства.","Ст. 130 — соединение и разъединение требований."],"norms":["Ст. 127.1 АПК РФ. «1. Судья отказывает в принятии искового заявления, заявления, если: 1) исковое заявление, заявление подлежат рассмотрению в порядке конституционного или уголовного судопроизводства либо не подлежат рассмотрению в судах; 2) имеются вступивший в законную силу принятый по спору между теми же лицами, о том же предмете и по тем же основаниям судебный акт арбитражного суда, суда общей юрисдикции или компетентного суда иностранного государства, за исключением случаев, если арбитражный суд отказал в признании и приведении в исполнение решения иностранного суда …»","Ст. 128 АПК РФ. «1. Арбитражный суд, установив при рассмотрении вопроса о принятии искового заявления к производству, что оно подано с нарушением требований, установленных статьями 125 и 126 настоящего Кодекса, выносит определение об оставлении заявления без движения …»","Ст. 129 АПК РФ. «1. Арбитражный суд возвращает исковое заявление, если при рассмотрении вопроса о принятии заявления установит, что: 1) дело неподсудно данному арбитражному суду или подсудно суду общей юрисдикции; 2.1) заявленные требования подлежат рассмотрению в порядке приказного производства; 3) до вынесения определения о принятии искового заявления к производству арбитражного суда от истца поступило ходатайство о возвращении заявления …»","Ст. 148 АПК РФ. «1. Арбитражный суд оставляет исковое заявление без рассмотрения, если после его принятия к производству установит, что: 1) в производстве арбитражного суда, суда общей юрисдикции, третейского суда имеется дело по спору между теми же лицами, о том же предмете и по тем же основаниям …»"]},{"n":41,"title":"Подготовка дела к судебному разбирательству: понятие, задачи и сроки.","brief":"Подготовка дела (ст. 133 АПК) — обязательная стадия после принятия иска; проводится судьёй единолично. Задачи: определить правоотношение, законодательство и обстоятельства; состав участников; содействовать представлению доказательств; примирить стороны. Содержание — ст. 135 (собеседование, раскрытие доказательств, истребование, экспертиза, обеспечение, состав лиц). Срок определяется судьёй, завершается предварительным заседанием (ст. 136) и вынесением определения о назначении дела (ст. 137).","full":["Подготовка дела к судебному разбирательству — обязательная стадия арбитражного процесса, следующая за принятием заявления к производству, в ходе которой судья единолично создаёт условия для правильного и своевременного рассмотрения дела. Проводится по каждому делу (ч. 2 ст. 133 АПК РФ).","Задачи подготовки (ч. 1 ст. 133 АПК РФ): 1) определение характера спорного правоотношения, подлежащего применению законодательства и обстоятельств, имеющих значение для правильного рассмотрения дела; 2) разрешение вопроса о составе лиц, участвующих в деле, и других участников процесса; 3) оказание содействия лицам, участвующим в деле, в представлении необходимых доказательств; 4) примирение сторон.","Содержание подготовки (ст. 135 АПК РФ): вызов сторон и проведение собеседования для выяснения существа требований и возражений, предложение раскрыть доказательства и представить дополнительные в определённый срок, разъяснение прав и последствий их несовершения, определение по согласованию со сторонами сроков представления доказательств и проведения предварительного заседания; разъяснение права на рассмотрение с участием арбитражных заседателей, права передать спор в третейский суд, обратиться к медиатору или судебному примирителю, использование иных примирительных процедур, содействие заключению мирового соглашения; истребование доказательств по ходатайству сторон, а в предусмотренных АПК случаях — по инициативе суда, разрешение вопросов о назначении экспертизы, вызове экспертов и свидетелей, привлечении переводчика и специалиста, осмотре доказательств на месте; разрешение ходатайств об обеспечении иска, встречном обеспечении, обеспечении доказательств, направление судебных поручений; рассмотрение вопросов о вступлении в дело других лиц, замене ненадлежащего ответчика, соединении и разъединении требований, принятии встречного иска, проведении выездного заседания; иные действия.","Оформление и сроки. После принятия заявления суд выносит определение о подготовке дела к судебному разбирательству, в котором указывает сторонам на возможность заявить ходатайство об арбитражных заседателях, обратиться к посреднику, медиатору, судебному примирителю, а также на действия, которые надлежит совершить, и сроки их совершения (ч. 1 ст. 134 АПК РФ). Подготовка проводится в срок, определяемый судьёй с учётом обстоятельств конкретного дела и необходимости совершения процессуальных действий, и завершается проведением предварительного судебного заседания, если АПК не установлено иное (ч. 2 ст. 134 АПК РФ). Закон не устанавливает для подготовки фиксированного срока: он определяется судьёй; общий шестимесячный срок рассмотрения дела включает и подготовку (ч. 1 ст. 152 АПК РФ).","Предварительное судебное заседание (ст. 136 АПК РФ) проводится единолично с извещением сторон и иных заинтересованных лиц; при неявке надлежаще извещённых лиц проводится в их отсутствие. Суд разрешает ходатайства, определяет достаточность доказательств, выясняет мнение сторон о возможности урегулирования спора и примирительных процедурах, рассматривает вопросы, разрешаемые при подготовке. Стороны вправе представлять доказательства, заявлять ходатайства, излагать доводы. По ходатайству лиц суд может объявить перерыв не более чем на пять дней для представления дополнительных доказательств (ч. 4 ст. 136 АПК РФ). После завершения рассмотрения вопросов суд с учётом мнения сторон решает вопрос о готовности дела (ч. 5).","Завершение. Признав дело подготовленным, судья выносит определение о назначении дела к судебному разбирательству, в котором указывает на окончание подготовки, разрешение вопросов о привлечении третьих лиц, принятии встречного иска, соединении или разъединении требований, привлечении арбитражных заседателей, время и место заседания (ст. 137 АПК РФ). Если в предварительном заседании присутствуют лица, участвующие в деле, либо они извещены и не заявили возражений против рассмотрения в их отсутствие, суд вправе завершить предварительное заседание и открыть заседание первой инстанции (ч. 4 ст. 137 АПК РФ), кроме случаев обязательного коллегиального рассмотрения.","Значение стадии: обеспечивает правильное и своевременное рассмотрение дела, определяет предмет доказывания и состав участников, способствует примирению и процессуальной экономии."],"learn":["Ст. 133 — задачи подготовки (4 задачи).","Ст. 134 — определение о подготовке; срок определяет судья, завершение — предварительное заседание.","Ст. 135 — действия судьи: собеседование, доказательства, экспертиза, обеспечение, состав лиц.","Ст. 136 — предварительное заседание; перерыв до 5 дней.","Ст. 137 — определение о назначении дела; возможность открыть заседание сразу."],"norms":["Ст. 133 АПК РФ. «1. Задачами подготовки дела к судебному разбирательству являются определение характера спорного правоотношения и подлежащего применению законодательства, обстоятельств, имеющих значение для правильного рассмотрения дела; разрешение вопроса о составе лиц, участвующих в деле, и других участников арбитражного процесса; оказание содействия лицам, участвующим в деле, в представлении необходимых доказательств; примирение сторон. 2. Подготовка дела к судебному разбирательству проводится судьей единолично по каждому находящемуся в производстве арбитражного суда первой инстанции делу в целях обеспечения его правильного и своевременного рассмотрения.»","Ст. 134 АПК РФ. «2. Подготовка дела к судебному разбирательству проводится в срок, определяемый судьей с учетом обстоятельств конкретного дела и необходимости совершения соответствующих процессуальных действий, и завершается проведением предварительного судебного заседания, если в соответствии с настоящим Кодексом не установлено иное.»","Ст. 137 АПК РФ. «1. Судья, признав дело подготовленным, выносит определение о назначении дела к судебному разбирательству. 2. В определении о назначении дела к судебному разбирательству указывается на окончание подготовки дела к судебному разбирательству и разрешение вопросов о привлечении к делу третьих лиц …»"]},{"n":42,"title":"Судебное разбирательство: понятие, значение, части и сроки.","brief":"Судебное разбирательство — центральная стадия, заседание с извещением лиц (ст. 153 АПК). Срок — 6 месяцев со дня поступления заявления, включая подготовку и решение; продление до 9 месяцев при особой сложности (ст. 152). Части: подготовительная (ст. 153–159: явка, состав суда, права, отводы, ходатайства

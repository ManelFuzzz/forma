<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Форма">
<meta name="description" content="Тренировки 4 раза в неделю, таймеры подходов и отдыха, КБЖУ и прогресс. Работает как приложение.">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Форма — тренировки и питание</title>
<style>
:root{
  --bg:#07080A; --card:#101215; --card2:#15181C;
  --line:rgba(255,255,255,.075);
  --text:#F2F4F1; --muted:#858C94;
  --accent:#CDFF4D; --accent-soft:rgba(205,255,77,.12);
  --blue:#7CC6FF; --orange:#FFB86B;
  --r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  font-variant-numeric:tabular-nums;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 55% at 50% -8%,rgba(205,255,77,.10),transparent 62%);
}
.app{max-width:520px;margin:0 auto;padding:0 18px 118px;position:relative;z-index:1}
/* ---------- top ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 0 6px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
h1{font-size:33px;line-height:1.04;letter-spacing:-.035em;margin:7px 0 0;font-weight:600}
.icon-btn{width:42px;height:42px;flex:0 0 auto;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;cursor:pointer}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:20px;margin-top:18px;
  background:linear-gradient(152deg,#DEFF74 0%,#C2F63A 52%,#A7E51D 100%);color:#0A0C06;
}
.hero.dark{background:linear-gradient(160deg,#14171B,#0D0F11);color:var(--text);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(46px);top:-70px;right:-50px;pointer-events:none}
.hero.dark::after{background:rgba(205,255,77,.10)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.hero-top .eyebrow{color:rgba(10,12,6,.62)}
.hero.dark .eyebrow{color:var(--muted)}
.pill{font-size:11.5px;font-weight:650;padding:5px 10px;border-radius:999px;background:rgba(10,12,6,.14);letter-spacing:.02em}
.hero.dark .pill{background:rgba(255,255,255,.07);color:#C6CDD4}
.hero h2{font-size:26px;line-height:1.1;letter-spacing:-.03em;margin:14px 0 6px;font-weight:650;position:relative}
.hero p{margin:0 0 18px;font-size:13.5px;line-height:1.45;color:rgba(10,12,6,.66);position:relative;max-width:88%}
.hero.dark p{color:var(--muted)}
/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;
  border-radius:16px;height:54px;padding:0 20px;font:inherit;font-size:16px;font-weight:600;
  cursor:pointer;transition:transform .12s ease,opacity .2s;width:100%;letter-spacing:-.01em;
}
.btn:active{transform:scale(.975)}
.btn-lime{background:var(--accent);color:#0A0C06}
.btn-dark{background:#0A0C06;color:#DEFF74}
.hero.dark .btn-dark{background:var(--accent);color:#0A0C06}
.btn-ghost{background:rgba(255,255,255,.055);color:var(--text);border:1px solid var(--line)}
.btn-sm{height:44px;font-size:14px;border-radius:13px;width:auto;padding:0 16px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* ---------- generic ---------- */
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px;font-size:12px;letter-spacing:.075em;text-transform:uppercase;color:var(--muted);font-weight:650}
.card{background:linear-gradient(180deg,#121417,#0C0D0F);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.small{font-size:12.5px;line-height:1.5}
/* ---------- schedule rows ---------- */
.sched{display:flex;flex-direction:column;gap:8px}
.srow{
  display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:18px;
  background:#0E1013;border:1px solid var(--line);
}
.srow.today{background:linear-gradient(180deg,rgba(205,255,77,.10),rgba(205,255,77,.04));border-color:rgba(205,255,77,.28)}
.sday{width:34px;flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.06);color:#B9C0C8}
.srow.today .sday{background:var(--accent);color:#0A0C06}
.smain{flex:1;min-width:0}
.smain b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.smain span{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stime{font-size:12.5px;color:var(--muted);font-weight:600;flex:0 0 auto}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;vertical-align:1px}
/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:#0E1013;border:1px solid var(--line);border-radius:18px;padding:14px 12px}
.stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.3}
/* ---------- nutrition ---------- */
.ring-kcal{display:flex;align-items:center;gap:18px}
.kcal-num{font-size:38px;font-weight:600;letter-spacing:-.04em;line-height:1}
.kcal-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.macro{display:grid;grid-template-columns:56px 1fr 64px;gap:12px;align-items:center;font-size:12.5px;padding:8px 0}
.macro .lbl{color:#C2C9D0;font-weight:600}
.macro .val{text-align:right;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.075);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .35s ease}
.b-p{background:var(--accent)} .b-f{background:var(--orange)} .b-c{background:var(--blue)}
.meals{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.meal{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#0E1013;border:1px solid var(--line);border-radius:16px}
.meal-main{flex:1;min-width:0}
.meal-main b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-main span{font-size:11.5px;color:var(--muted)}
.meal-kcal{font-size:14px;font-weight:600;letter-spacing:-.01em}
.del{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#7A8189;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.del:active{color:#FF7A7A;border-color:rgba(255,122,122,.4)}
.del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.water{display:flex;gap:6px;margin-top:12px}
.drop{flex:1;height:34px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.drop.on{background:rgba(124,198,255,.20);border-color:rgba(124,198,255,.45)}
.drop svg{width:13px;height:16px;stroke:rgba(255,255,255,.35);fill:none;stroke-width:1.6}
.drop.on svg{stroke:var(--blue);fill:rgba(124,198,255,.35)}
.week{display:flex;gap:6px;margin-top:14px;align-items:flex-end;height:76px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wd .wbar{width:100%;border-radius:6px 6px 3px 3px;background:rgba(255,255,255,.10);min-height:4px;transition:height .3s}
.wd .wbar.ok{background:rgba(205,255,77,.55)}
.wd .wbar.over{background:rgba(255,184,107,.7)}
.wd small{font-size:10px;color:var(--muted);letter-spacing:.02em}
/* ---------- accordion ---------- */
details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:#AEB5BD;display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:7px;height:7px;border-right:1.6px solid #7A8189;border-bottom:1.6px solid #7A8189;transform:rotate(45deg);transition:transform .2s;margin-right:2px;margin-top:-3px}
details[open] summary::after{transform:rotate(-135deg);margin-top:2px}
details .dbody{padding-top:12px;font-size:13px;line-height:1.6;color:#B9C0C8}
details .dbody ol,.dbody ul{margin:0;padding-left:18px}
details .dbody li{margin-bottom:8px}
details .dbody li:last-child{margin-bottom:0}
.note{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.55;color:#A9B0B8;margin-top:12px}
.note b{color:#DDE3E8;font-weight:600}
/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:7px 18px calc(7px + env(safe-area-inset-bottom));background:rgba(8,9,11,.82);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border-top:1px solid rgba(255,255,255,.06)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 5px;border-radius:15px;color:#6F767E;font-size:10.5px;font-weight:650;letter-spacing:.03em;border:0;background:none;font-family:inherit;cursor:pointer;transition:color .2s}
.tab.active{color:var(--accent)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ---------- university schedule ---------- */
.daycards{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.daycard{background:linear-gradient(180deg,#121417,#0C0D0F);border:1px solid var(--line);border-radius:24px;padding:16px 16px 6px}
.daycard.today{border-color:rgba(205,255,77,.26);background:linear-gradient(180deg,rgba(205,255,77,.09),rgba(205,255,77,.025))}
.dc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 2px 10px}
.dc-head .lbl{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.daycard.next .dc-head .lbl{color:var(--muted)}
.dc-head b{display:block;font-size:18px;font-weight:600;letter-spacing:-.025em;margin-top:6px;line-height:1.1}
.dc-head .d{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.dc-count{font-size:11.5px;color:#C2C9D0;background:rgba(255,255,255,.06);border-radius:999px;padding:5px 10px;font-weight:600;flex:0 0 auto;margin-top:2px}
.lessons{display:flex;flex-direction:column}
.lesson{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:11px 2px;border-top:1px solid rgba(255,255,255,.06)}
.lesson:first-child{border-top:0}
.ltime{font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.2;padding-top:1px}
.ltime span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}
.lmain{min-width:0}
.lmain b{display:block;font-size:14px;font-weight:600;letter-spacing:-.012em;line-height:1.32}
.lmeta{display:flex;flex-wrap:wrap;align-items:center;gap:3px 7px;margin-top:5px;font-size:11.5px;color:var(--muted);line-height:1.4}
.lmeta .tag{color:#AEB6BE;background:rgba(255,255,255,.055);border-radius:6px;padding:1px 6px;font-size:10px;font-weight:650;letter-spacing:.03em;text-transform:uppercase}
.lroom{color:#C4CCD3;font-weight:550}
.dc-empty{padding:4px 2px 14px;font-size:13px;color:var(--muted);line-height:1.5}
.dc-foot{font-size:10.5px;color:#6E767E;line-height:1.45;padding:9px 2px 9px;border-top:1px solid rgba(255,255,255,.05)}
/* full schedule overlay */
.scpager{position:sticky;top:-18px;z-index:3;display:flex;align-items:center;gap:8px;padding:0 0 12px;background:linear-gradient(180deg,var(--bg) 72%,rgba(7,8,10,.86))}
.scpager .wk{flex:1;text-align:center;min-width:0}
.scpager .wk b{display:block;font-size:14px;font-weight:600;letter-spacing:-.015em}
.scpager .wk span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.pgbtn{width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);display:grid;place-items:center;cursor:pointer}
.pgbtn:active{transform:scale(.94)}
.pgbtn:disabled{opacity:.3;pointer-events:none}
.pgbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scday{margin-bottom:16px}
.scday-h{display:flex;align-items:center;gap:7px;padding:0 2px 8px}
.scday-h b{font-size:14px;font-weight:600;letter-spacing:-.01em}
.scday-h span{font-size:11.5px;color:var(--muted)}
.scday-h .nowtag{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0A0C06;background:var(--accent);border-radius:999px;padding:3px 7px}
.scitem{background:#0E1013;border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-bottom:7px}
.scitem:last-child{margin-bottom:0}
.scitem .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.scitem .t{display:block;font-size:12.5px;color:#C6CDD4;font-weight:600}
.scitem .ty{flex:0 1 auto;min-width:0;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scitem>b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin-top:6px}
.scitem .te{font-size:12.5px;color:#B6BEC6;line-height:1.4;margin-top:5px}
.scitem .rm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--muted);margin-top:6px}
.scitem .rm .tag{color:#AEB6BE;background:rgba(255,255,255,.055);border-radius:6px;padding:1px 6px;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.scnote{font-size:11px;color:#6E767E;line-height:1.5;margin:2px 2px 14px}
.sweek{border:1px solid var(--line);border-radius:16px;background:#0E1013;margin-bottom:8px;padding:0 14px}
.sweek>summary{padding:14px 0;font-size:13.5px;color:#D6DDE3}
.sweek>summary em{font-style:normal;font-size:11px;color:var(--muted);font-weight:500;margin-left:auto;padding-right:12px}
.sweek.past>summary{color:#8B939B}
.sweek .dbody{padding:0 0 14px;font-size:13px}
.sweek .scday{margin-bottom:12px}
.sweek .scitem{padding:10px 11px}
.sweek .scitem>b{font-size:13.5px;margin-top:4px}
.sweek .scitem .te{font-size:11.5px}
.sweek .scitem .rm{font-size:11.5px}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;transform:translateY(101%);transition:transform .38s cubic-bezier(.22,.9,.24,1)}
.overlay.open{transform:none}
.ov-head{padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.06);flex:0 0 auto}
.ov-head .ttl{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ov-head .ttl span{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.pbar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:10px}
.pbar>i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .35s ease}
.ov-body{flex:1;overflow-y:auto;padding:18px 18px 20px;width:100%;max-width:520px;margin:0 auto;-webkit-overflow-scrolling:touch}
.ov-foot{flex:0 0 auto;padding:10px 18px calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;width:100%}
.ov-foot .row2{display:flex;gap:8px}
/* workout card */
.wcard{background:linear-gradient(180deg,#121417,#0C0D0F);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;height:25px;padding:0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:650;letter-spacing:.03em;text-transform:uppercase}
.wcard h2{font-size:24px;line-height:1.12;letter-spacing:-.03em;margin:12px 0 8px;font-weight:600}
.wmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.wmeta span{font-size:11.5px;font-weight:600;color:#BFC6CD;background:rgba(255,255,255,.05);border-radius:999px;padding:5px 10px}
.pips{display:flex;gap:5px;margin-top:16px}
.pip{height:4px;flex:1;max-width:34px;border-radius:3px;background:rgba(255,255,255,.10)}
.pip.done{background:var(--accent)}
.bigtimer{font-size:58px;font-weight:300;letter-spacing:-.05em;line-height:1;text-align:center;padding:22px 0 6px;font-variant-numeric:tabular-nums;color:#fff}
.bigtimer.live{color:var(--accent)}
.thint{text-align:center;font-size:12px;color:var(--muted);padding-bottom:16px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 16px}
.field{background:#0A0B0D;border:1px solid var(--line);border-radius:15px;padding:9px 13px}
.field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;margin-bottom:3px}
.field input{width:100%;background:none;border:0;color:var(--text);font:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;padding:0;outline:none}
.field input::placeholder{color:#4C5359;font-weight:500}
/* rest overlay */
.restov{position:fixed;inset:0;z-index:60;background:radial-gradient(70% 45% at 50% 12%,rgba(205,255,77,.13),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;pointer-events:none;transition:opacity .25s;padding:24px}
.restov.open{opacity:1;pointer-events:auto}
.restlbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:650}
.ringwrap{position:relative;width:228px;height:228px;margin:8px 0}
.ringwrap svg{transform:rotate(-90deg);display:block}
.ringbg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:5}
.ringfg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ringnum{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:300;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.nextup{font-size:13px;color:#B9C0C8;text-align:center;min-height:20px;margin-top:2px}
.nextup b{color:#fff;font-weight:600}
.restact{display:flex;gap:8px;margin-top:22px;width:100%;max-width:340px}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:65;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#101215;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .34s cubic-bezier(.22,.9,.24,1);max-height:90vh;overflow-y:auto;max-width:520px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(255,255,255,.16);margin:4px auto 16px}
.sheet h3{font-size:19px;letter-spacing:-.02em;margin:0 0 4px;font-weight:600}
.sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.inp{width:100%;height:48px;background:#0A0B0D;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:0 14px;font:inherit;font-size:15px;outline:none;transition:border-color .2s}
.inp:focus{border-color:rgba(205,255,77,.5)}
.inp::placeholder{color:#565D64}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.grid4 .inp{padding:0 10px;text-align:center;font-size:14px}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;margin:14px 0 6px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;margin:0 -18px;padding-left:18px;padding-right:18px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:0 0 auto;height:34px;padding:0 13px;border-radius:11px;background:rgba(255,255,255,.055);border:1px solid var(--line);color:#C6CDD4;font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap}
.chipbtn:active{background:rgba(205,255,77,.16);color:#DDFF8A}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1B1F24;border:1px solid var(--line);color:#fff;font-size:13px;padding:12px 18px;border-radius:14px;z-index:90;opacity:0;pointer-events:none;transition:.28s;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- reminder banner ---------- */
.remind{position:fixed;left:0;right:0;top:0;z-index:92;transform:translateY(-130%);transition:transform .4s cubic-bezier(.22,.9,.24,1);padding:calc(10px + env(safe-area-inset-top)) 14px 0;pointer-events:none}
.remind.on{transform:none;pointer-events:auto}
.remind-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;background:#141A0F;border:1px solid rgba(205,255,77,.34);border-radius:18px;padding:10px 10px 10px 14px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.remind-tx{flex:1;min-width:0}
.remind-tx b{display:block;font-size:13px;font-weight:650;letter-spacing:-.01em}
.remind-tx span{display:block;font-size:11.5px;color:#9FAA95;margin-top:2px}
.remind-x{width:32px;height:32px;flex:0 0 auto;border:0;background:rgba(255,255,255,.06);border-radius:10px;color:#B7BEB3;font-size:19px;line-height:1;cursor:pointer}
.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.6;color:#C9D0D7}
.steps li{margin-bottom:10px}
.steps b{color:#F2F4F1;font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-of-type{border-bottom:0}
.switch .lb{font-size:14px;font-weight:550}
.switch .lb span{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.tg{width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.12);border:0;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s}
.tg.on{background:var(--accent)}
.tg.on::after{transform:translateX(20px)}
/* ---------- auth ---------- */
.auth{position:fixed;inset:0;z-index:80;background:radial-gradient(70% 45% at 50% 8%,rgba(205,255,77,.10),transparent 65%),var(--bg);display:none;overflow-y:auto;padding:24px}
.auth.on{display:block}
.auth-in{max-width:400px;margin:0 auto;padding-top:calc(38px + env(safe-area-inset-top))}
.brand{font-size:12px;letter-spacing:.28em;color:var(--accent);font-weight:700;text-transform:uppercase}
.auth h2{font-size:30px;line-height:1.08;letter-spacing:-.035em;margin:14px 0 8px;font-weight:600}
.auth p.lead{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0 0 24px}
.auth .inp{margin-bottom:8px}
.aerr{min-height:18px;font-size:12px;color:#FF8A8A;margin:2px 2px 10px}
.alogout{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.uname{font-size:15px;font-weight:600}
.uname span{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
/* ---------- photos ---------- */
.viz{margin:2px 0 4px}
.vizbody{border:1px solid var(--line);background:#0A0B0D;border-radius:18px;padding:8px;margin-top:8px}
.viztog{background:none;border:0;color:#79818A;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:4px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.viztog:active{color:var(--accent)}
.viztog svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.pics{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pics.one{grid-template-columns:minmax(0,1fr)}
.pics.one .pic{aspect-ratio:16/9}
.pic{margin:0;min-width:0;position:relative;border-radius:13px;overflow:hidden;background:#15181C;aspect-ratio:3/2}
.pic img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.pic img.done{opacity:1}
.pic figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#DDE3E9;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.src{font-size:10px;color:#5F6770;margin:8px 2px 2px;text-align:right}
.pics.fail{display:none}
.pics.fail + .src{display:none}
.photoerr{display:none;font-size:12px;color:#8E959D;padding:6px 4px 8px}
.pics.fail ~ .photoerr{display:block}
.lbx{position:fixed;inset:0;z-index:95;background:rgba(6,7,9,.97);display:none;align-items:center;justify-content:center;padding:12px}
.lbx.on{display:flex}
.lbx img{max-width:100%;max-height:86vh;border-radius:16px;display:block}
.lbx .lbt{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;font-size:12px;color:#8E959D;letter-spacing:.06em;text-transform:uppercase}

</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div>
      <div class="eyebrow" id="topDate">—</div>

</div>

<nav class="tabs">

  </div>
</nav>

<!-- Schedule overlay -->
<div class="overlay" id="sched">
  <div class="ov-head">
    <button class="icon-btn" data-act="sched-close" aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>

    </div>
  </div>
  <div class="ov-body" id="scBody"></div>
</div>

<!-- Workout overlay -->
<div class="overlay" id="workout">
  <div class="ov-head">
    <button class="icon-btn" data-act="close-workout" aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div style="flex:1">
      <div class="ttl" id="wkTitle">Тренировка<span id="wkSub">—</span></div>
      <div class="pbar"><i id="wkBar"></i></div>
    </div>
  </div>
  <div class="ov-body" id="wkBody"></div>
  <div class="ov-foot" id="wkFoot"></div>
</div>

<!-- Rest overlay -->
<div class="restov" id="rest">
  <div class="restlbl">Отдых</div>
  <div class="ringwrap">
    <svg width="228" height="228" viewBox="0 0 228 228">
      <circle class="ringbg" cx="114" cy="114" r="104"></circle>
      <circle class="ringfg" id="ringFg" cx="114" cy="114" r="104" stroke-dasharray="653.45" stroke-dashoffset="0"></circle>
    </svg>
    <div class="ringnum" id="restNum">1:30</div>
  </div>

  <div class="restact">

    <button class="btn btn-lime btn-sm" data-act="rest-skip" style="width:100%">Пропустить</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<!-- Reminder banner -->
<div class="remind" id="remind">
  <div class="remind-in">

  </div>
</div>

<!-- Auth -->

  </div>
</div>

<input type="file" id="impFile" accept=".json,application/json" style="display:none">

<!-- Photo lightbox -->
<div class="lbx" id="lbx"><span class="lbt">Закрыть</span><img id="lbxImg" alt="Техника упражнения"></div>

function photoUrls(id){
  const key = PHOTOS[id];
  if(!key) return null;
  const list = [PHOTO_CDN + key + '/0.jpg', PHOTO_CDN + key + '/1.jpg'];
  return ONE_FRAME[id] ? list.slice(0, 1) : list;
}
function photosFor(id){
  const u = photoUrls(id);
  if(!u) return '';
  const one = u.length === 1;
  const fig = (src, cap) => `<figure class="pic" data-act="zoom-photo" data-src="${src}">
        <img src="${src}" alt="${cap}" decoding="async" onload="this.classList.add('done')" onerror="this.parentNode.parentNode.classList.add('fail')">
        <figcaption>${cap}</figcaption>
      </figure>`;
  return `<div class="pics${one ? ' one' : ''}">
      ${fig(u[0], one ? 'Положение' : 'Старт')}
      ${one ? '' : fig(u[1], 'Рабочая фаза')}
    </div>
    <div class="photoerr">Фото не загрузились — нужен интернет. Техника текстом ниже.</div>
    <div class="src">Фото: free-exercise-db · public domain</div>`;
}
function prefetchPhotos(id){
  const u = photoUrls(id);
  if(!u) return;
  u.forEach(src => { const i = new Image(); i.src = src; });
}
function zoomPhoto(src){

function defaultState(){
  return {
    tab:'training',
    settings:{weekdayTime:'19:00', weekendTime:'11:00', sound:true, diagrams:true, remind:true},
    targets:{...DEFAULT_TARGETS},
    days:{}, sessions:[], weights:{}, rev:0
  };
}

const USERS_KEY = 'form_users_v1';
const SESSION_KEY = 'form_session_v1';
let currentUser = null;
let state = defaultState();

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* --- cookie-зеркало: страховка, если браузер почистит localStorage --- */
function cookieSet(name, val, days){
  try{
    const exp = new Date(Date.now() + days*864e5).toUTCString();
    document.cookie = name + '=' + val + '; expires=' + exp + '; path=/; SameSite=Lax';
  }catch(e){}
}
function cookieGet(name){
  try{
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }catch(e){ return ''; }
}
function cookieDel(name){ try{ document.cookie = name + '=; max-age=0; path=/'; }catch(e){} }

function storageWorks(){
  try{
    localStorage.setItem('form_probe', '1');
    localStorage.removeItem('form_probe');
    return true;
  }catch(e){ return false; }
}
function setSession(login){
  lsSet(SESSION_KEY, login);
  cookieSet('form_session', encodeURIComponent(login), 3650);
}
function clearSession(){
  lsSet(SESSION_KEY, '');
  cookieDel('form_session');
}

function normalize(s){
  const base = defaultState();
  if(!s || typeof s !== 'object') return base;
  return {...base, ...s, settings:{...base.settings, ...(s.settings||{})}, targets:{...base.targets, ...(s.targets||{})}};
}
function userKey(login){ return 'form_data_' + login; }
function acctKey(login){ return 'form_acct_' + login; }

/* Список аккаунтов собирается из трёх мест: основной ключ, личная копия
   аккаунта и cookie-зеркало. Так вход не ломается, даже если браузер
   вычистил один из слоёв. */
function getUsers(){
  let map = {};
  try{ map = JSON.parse(lsGet(USERS_KEY) || '{}') || {}; }catch(e){ map = {}; }

  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('form_acct_') === 0){
        const login = k.slice(10);
        if(!map[login]){
          try{
            const rec = JSON.parse(localStorage.getItem(k));
            if(rec && rec.hash) map[login] = rec;
          }catch(e){}
        }
      }
    }
  }catch(e){}

  if(!Object.keys(map).length){
    try{
      const mirror = cookieGet('form_users_mirror');
      if(mirror) map = JSON.parse(mirror) || map;
    }catch(e){}
  }
  return map;
}
function setUsers(u){
  const json = JSON.stringify(u);
  lsSet(USERS_KEY, json);
  cookieSet('form_users_mirror', encodeURIComponent(json), 3650);
}
function getAcct(login){
  try{ return JSON.parse(lsGet(acctKey(login)) || 'null'); }catch(e){ return null; }
}
function setAcct(login, rec){
  lsSet(acctKey(login), JSON.stringify(rec));
}
function loadStateFor(login){
  try{ return normalize(JSON.parse(lsGet(userKey(login)) || 'null')); }catch(e){ return defaultState(); }
}
function saveLocal(){
  if(!currentUser) return;
  state.rev = Date.now();
  lsSet(userKey(currentUser), JSON.stringify(state));
}
function save(){
  if(!currentUser) return;
  saveLocal();
  queueCloudSync();
}

/* ============================================================
   ОБЛАКО — Supabase
   Один логин, один прогресс: при входе состояние подтягивается,
   после каждого изменения — сохраняется обратно.
   ============================================================ */
const CLOUD = {
  url: '',      // https://<project>.supabase.co
  key: '',      // publishable / anon key
  table: 'progress',
  login: 'vargonik'
};
const CLOUD_ON = () => !!(CLOUD.url && CLOUD.key);
let cloudTimer = null, cloudBusy = false, cloudState = 'off', cloudAt = 0;

function cloudHeaders(extra){
  return {apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key, 'Content-Type': 'application/json', ...(extra||{})};
}
async function cloudGet(){
  const url = CLOUD.url + '/rest/v1/' + CLOUD.table +
    '?login=eq.' + encodeURIComponent(CLOUD.login) + '&select=rev,data&limit=1';
  const r = await fetch(url, {headers: cloudHeaders(), cache: 'no-store'});
  if(!r.ok) throw new Error('cloud ' + r.status);
  const rows = await r.json();
  return Array.isArray(rows) && rows[0] ? rows[0] : null;
}
async function cloudPut(){
  if(!state.rev) state.rev = Date.now();
  const body = JSON.stringify([{
    login: CLOUD.login,
    rev: state.rev,
    data: state,
    updated_at: new Date().toISOString()
  }]);
  const r = await fetch(CLOUD.url + '/rest/v1/' + CLOUD.table + '?on_conflict=login', {
    method: 'POST',
    headers: cloudHeaders({Prefer: 'resolution=merge-duplicates,return=minimal'}),
    body
  });
  if(!r.ok) throw new Error('cloud ' + r.status);
}

function cloudLabel(){
  if(!CLOUD_ON()) return 'облако не подключено';
  if(cloudState === 'busy') return 'синхронизация…';
  if(cloudState === 'err') return 'нет связи — сохранено на устройстве';
  if(cloudState === 'ok' && cloudAt){
    const d = new Date(cloudAt);
    return 'сохранено в облаке в ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  return 'ожидание синхронизации';
}
function paintCloud(){
  const el = $('#cloudLine');
  if(el) el.textContent = cloudLabel();
}
function queueCloudSync(){
  if(!CLOUD_ON() || currentUser !== CLOUD.login) return;
  clearTimeout(cloudTimer);
  cloudState = 'busy'; paintCloud();
  cloudTimer = setTimeout(() => { syncNow(); }, 1200);
}

function stateIsEmpty(s){
  return (!s || !s.sessions || !s.sessions.length) && (!s || !s.days || !Object.keys(s.days).length);
}
/* Перед тем как заменить локальные данные облачными, кладём копию
   в запас: в настройках её можно вернуть, если что-то пошло не так. */
function snapshotLocal(){
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf('form_bak_') === 0) keys.push(k);
    }
    keys.sort();
    while(keys.length >= 3){ localStorage.removeItem(keys.shift()); }
    lsSet('form_bak_' + Date.now(), JSON.stringify(state));
  }catch(e){}
}

async function syncNow(initial){
  if(!CLOUD_ON() || currentUser !== CLOUD.login){ cloudState = 'off'; paintCloud(); return; }
  if(cloudBusy) return;
  cloudBusy = true; cloudState = 'busy'; paintCloud();
  try{
    const remote = await cloudGet();
    const rRev = (remote && remote.rev) || 0;
    const lRev = state.rev || 0;
    if(remote && remote.data && rRev > lRev){
      if(!stateIsEmpty(state)) snapshotLocal();
      state = normalize(remote.data);
      state.rev = rRev;
      saveLocal0();
      render();
      if(initial) toast('Прогресс загружен из облака');
    } else if(!remote || !remote.data){
      // В облаке ещё пусто. Пустое состояние с нового устройства
      // не отправляем — иначе оно затрёт прогресс с другого телефона.
      if(!stateIsEmpty(state)){
        if(!state.rev) state.rev = Date.now();
        await cloudPut();
        saveLocal0();
      }
    } else if(lRev > rRev){
      if(!state.rev) state.rev = Date.now();
      await cloudPut();
      saveLocal0();
    } else {
      state.rev = rRev || state.rev;
      saveLocal0();
    }
    cloudState = 'ok'; cloudAt = Date.now();
  }catch(e){
    cloudState = 'err';
  }
  cloudBusy = false;
  paintCloud();
}
function saveLocal0(){
  if(!currentUser) return;
  lsSet(userKey(currentUser), JSON.stringify(state));
}

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec/60)}:${pad(sec%60)}`; }
function dayData(key = dateKey()){
  if(!state.days[key]) state.days[key] = {meals:[], water:0};
  return state.days[key];
}
function totals(d){
  return d.meals.reduce((a,m)=>({k:a.k+m.k, p:a.p+m.p, f:a.f+m.f, c:a.c+m.c}), {k:0,p:0,f:0,c:0});
}
function exList(prog){ return prog.ex.map(o => ({...EX[o.id], ...o})); }
function totalSets(list){ return list.reduce((a,e)=>a+(e.sets||1),0); }
function programById(id){ return PROGRAMS[id] ? {...PROGRAMS[id], ex:exList(PROGRAMS[id])} : null; }

const WHEN = ['в воскресенье','в понедельник','во вторник','в среду','в четверг','в пятницу','в субботу'];

function nextScheduled(){
  const now = new Date();
  for(let i=1;i<=7;i++){
    const d = new Date(now); d.setDate(d.getDate()+i);
    const p = WEEK_PLAN[d.getDay()];

const SD_DOW = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const SD_MAX = Math.max(...Object.keys(SCHED.weeks).map(Number));
const SV = { week: 1, mode: 'week' };

function sdStart(){ const [y,m,d] = SCHED.from.split('-').map(Number); return new Date(y, m-1, d); }
function sdAdd(date, days){ const d = new Date(date); d.setDate(d.getDate()+days); return d; }
function sdWeekIndex(date){
  const a = sdStart();
  const b = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return Math.floor(Math.round((b - a) / 864e5) / 7) + 1;
}
function sdClampWeek(n){ return Math.min(SD_MAX, Math.max(1, n)); }
function sdDateOf(week, dow){ return sdAdd(sdStart(), (week-1)*7 + (dow-1)); }
function sdDayNum(date){ return date.getDay() || 7; }
function sdItems(week, dow){
  const w = SCHED.weeks[week];
  return (w && w[dow]) ? w[dow] : [];
}
function sdDots(n){
  const a = n % 10, b = n % 100;
  if(a === 1 && b !== 11) return 'пара';
  if(a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'пары';
  return 'пар';
}
function sdShortFio(f){
  const p = String(f || '').trim().split(/\s+/);
  if(p.length < 3) return String(f || '');
  return p[0] + ' ' + p[1][0] + '. ' + p[2][0] + '.';
}
function sdType(t){
  t = String(t || '');
  if(/лекц/i.test(t)) return 'лекция';
  if(/лабор/i.test(t)) return 'лаборатория';
  if(/практи/i.test(t)) return 'практика';
  if(/семинар/i.test(t)) return 'семинар';
  if(/зач[её]т/i.test(t)) return 'зачёт';
  if(/экзам/i.test(t)) return 'экзамен';
  return t;
}
function sdTypeShort(t){
  const v = sdType(t);
  return v === 'лекция' ? 'лек.' : v === 'лаборатория' ? 'лаб.' : v === 'практика' ? 'практ.' : v === 'семинар' ? 'сем.' : v === 'зачёт' ? 'зач.' : v === 'экзамен' ? 'экз.' : v;
}
function sdTimeParts(slot){
  const p = (SCHED.times[slot-1] || '').split('–');
  return [p[0] || '', p[1] || ''];
}
function sdRoom(room){
  const r = String(room || '');
  return /^\d/.test(r) ? 'ауд. ' + r : r;
}
function sdDateLabel(date){ return date.getDate() + ' ' + MONTHS[date.getMonth()]; }
function sdWeekRange(n){
  const f = d => String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0');
  return f(sdDateOf(n,1)) + ' – ' + f(sdDateOf(n,7));
}
function sdCount(n){
  const w = SCHED.weeks[n];
  return w ? Object.keys(w).reduce((a,k) => a + sdPairs(w[k]), 0) : 0;
}
function sdPairs(items){ return new Set(items.map(it => it[0])).size; }

function sdLessonRow(it){
  const [a,b] = sdTimeParts(it[0]);
  const meta = ['<span class="tag">' + escapeHtml(sdTypeShort(it[2])) + '</span>'];
  if(it[3]) meta.push('<span>' + escapeHtml(sdShortFio(it[3])) + '</span>');

    <div class="lmain"><b>${escapeHtml(it[1])}</b><div class="lmeta">${meta.join('')}</div></div>
  </div>`;
}

function sdFullItem(it){
  const [a,b] = sdTimeParts(it[0]);
  const meta = [];
  if(it[2]) meta.push('<span class="tag">' + escapeHtml(it[2]) + '</span>');

}

function sdDayBlock(n, dow){
  const items = sdItems(n, dow);
  if(!items.length) return '';
  const date = sdDateOf(n, dow);
  const now = new Date();
  const isToday = date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
  return `<div class="scday">
    <div class="scday-h"><b>${SD_DOW[dow-1]}</b><span>${sdDateLabel(date)}</span>${isToday ? '<span class="nowtag">сегодня</span>' : ''}</div>
    ${items.map(sdFullItem).join('')}
  </div>`;
}

function sdDayCard(date, kind){
  const week = sdWeekIndex(date), dow = sdDayNum(date);
  const inSem = week >= 1 && week <= SD_MAX;
  const items = inSem ? sdItems(week, dow) : [];
  const pairs = sdPairs(items);
  return `<div class="daycard ${kind === 'today' ? 'today' : 'next'}">
    <div class="dc-head">
      <div>
        <div class="lbl">${kind === 'today' ? 'Сегодня' : 'Завтра'}</div>
        <b>${SD_DOW[dow-1] || 'Воскресенье'}</b>
        <span class="d">${sdDateLabel(date)}</span>
      </div>
      <span class="dc-count">${pairs ? pairs + ' ' + sdDots(pairs) : 'нет пар'}</span>
    </div>
    ${items.length
      ? '<div class="lessons">' + items.map(sdLessonRow).join('') + '</div>'
      : '<div class="dc-empty">' + (inSem ? 'Занятий нет — свободный день.' : 'Каникулы, занятий нет.') + '</div>'}
  </div>`;
}

function viewSchedule(){
  const now = new Date();
  const week = sdWeekIndex(now);
  const inSem = week >= 1 && week <= SD_MAX;
  return `
  <div class="daycards">
    ${sdDayCard(now, 'today')}
    ${sdDayCard(sdAdd(now, 1), 'next')}
  </div>
  <button class="btn btn-ghost" style="margin-top:10px;height:46px;font-size:14px" data-act="sched-full">Посмотреть расписание целиком</button>

  </div>`;
}

function r1(v){ return Math.round(v*10)/10; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   WORKOUT ENGINE
   ============================================================ */
let W = null, tHandle = null;

function startWorkout(programId){
  const prog = programById(programId);
  if(!prog) return;
  const setsTotal = totalSets(prog.ex);
  W = {
    programId, prog, ex:prog.ex, i:0, s:0, phase:'idle',
    startedAt:Date.now(), setStart:0, restEnd:0, restTotal:0,
    log:[], reps:{}, weights:{...state.weights}
  };
  $('#wkTitle').innerHTML = `${prog.name}<span id="wkSub">0 из ${setsTotal} подходов</span>`;
  $('#workout').classList.add('open');
  $('#workout').scrollTop = 0;
  renderW();
  clearInterval(tHandle);
  tHandle = setInterval(tick, 120);
  beep(520, .06);
  requestWakeLock();
}

function completedSets(){
  let n = 0;
  for(let k=0;k<W.i;k++) n += W.ex[k].sets;
  return n + W.s;
}

function renderW(){
  if(!W) return;
  const total = totalSets(W.ex);

  if(W.phase === 'done'){ renderFinish(); return; }

  const ex = W.ex[W.i];
  if(!ex){ renderFinish(); return; }
  const done = completedSets();
  $('#wkBar').style.width = (done/total*100) + '%';
  const sub = document.getElementById('wkSub');
  if(sub) sub.textContent = `${done} из ${total} подходов`;

  const pips = Array.from({length:ex.sets},(_,k)=>`<div class="pip ${k<W.s?'done':''}"></div>`).join('');
  const restText = ex.rest ? `отдых ${ex.rest} с` : 'без отдыха';
  const repsInit = W.reps[ex.id] ?? (ex.mode === 'time' ? ex.seconds : defaultReps(ex.reps));
  const diag = photosFor(ex.id);
  const vizOn = state.settings.diagrams !== false;
  if(vizOn) prefetchPhotos(W.ex[W.i+1] ? W.ex[W.i+1].id : '');

  $('#wkBody').innerHTML = `
    <div class="wcard">
      <span class="chip">${ex.muscle}</span>
      <h2>${ex.name}</h2>
      <div class="wmeta">
        <span>Подход ${Math.min(W.s+1, ex.sets)} из ${ex.sets}</span>
        <span>${ex.reps}</span>
        <span>${restText}</span>
      </div>
      <div class="pips">${pips}</div>
      <div class="bigtimer ${W.phase==='set'?'live':''}" id="setTimer">${W.phase==='set' ? (ex.mode==='time'? mmss(ex.seconds - elapsedSet()) : mmss(elapsedSet())) : (ex.mode==='time' ? mmss(ex.seconds) : '0:00')}</div>
      <div class="thint" id="setHint">${W.phase==='set' ? (ex.mode==='time' ? 'Держи положение, дыши ровно' : 'Выполняй подход в спокойном темпе') : (ex.mode==='time' ? 'Таймер пойдёт при старте' : 'Нажми «Начать подход», когда готов')}</div>
      ${ex.mode === 'reps' ? `
      <div class="inputs">
        ${ex.bw ? '' : `<div class="field"><label>Вес, кг</label><input type="number" inputmode="decimal" step="0.5" id="inWeight" value="${W.weights[ex.id] ?? ''}" placeholder="—"></div>`}
        <div class="field"><label>Повторы</label><input type="number" inputmode="numeric" id="inReps" value="${repsInit}" min="0"></div>
      </div>` : `<div style="height:10px"></div>`}
      ${diag ? `<div class="viz">
        <button class="viztog" data-act="toggle-viz">
          <svg viewBox="0 0 24 24"><path d="${vizOn ? 'M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z' : 'M3 3l18 18M9.9 5.6A9.6 9.6 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.3 4M6.3 7.4A17 17 0 0 0 2 12s3.6 6.5 10 6.5a9.7 9.7 0 0 0 4-.85'}"/><circle cx="12" cy="12" r="2.6" ${vizOn ? '' : 'style="display:none"'}></circle></svg>
          ${vizOn ? 'Скрыть фото' : 'Показать фото'}
        </button>
        ${vizOn ? `<div class="vizbody">${diag}</div>` : ''}
      </div>` : ''}
      <details ${W.s===0?'open':''}>
        <summary>Техника выполнения</summary>
        <div class="dbody">
          <ol>${ex.cues.map(c=>`<li>${c}</li>`).join('')}</ol>
        </div>
      </details>
      <details>
        <summary>Ошибки и вес</summary>
        <div class="dbody">
          <div style="margin-bottom:8px"><span class="muted">Частые ошибки:</span> ${ex.mistakes}</div>
          <div style="margin-bottom:8px"><span class="muted">Стартовый вес:</span> ${ex.load || '—'}</div>
          <div><span class="muted">Прогрессия:</span> ${ex.progress || '—'}</div>
        </div>
      </details>
    </div>`;

  $('#wkFoot').innerHTML = W.phase === 'set'
    ? `<button class="btn btn-lime" data-act="end-set">Завершить подход</button>`
    : `<button class="btn btn-lime" data-act="start-set">Начать подход</button>`;

  const wInp = document.getElementById('inWeight');
  const rInp = document.getElementById('inReps');
  if(wInp) wInp.oninput = e => { W.weights[ex.id] = e.target.value ? +e.target.value : null; };
  if(rInp) rInp.oninput = e => { W.reps[ex.id] = e.target.value ? +e.target.value : null; };
}

function defaultReps(str){
  if(!str) return 10;
  const m = String(str).match(/\d+/);
  return m ? +m[0] : 10;
}
function elapsedSet(){ return (Date.now() - W.setStart) / 1000; }

function startSet(){
  const ex = W.ex[W.i];
  W.phase = 'set'; W.setStart = Date.now();
  renderW(); beep(680,.05);
}
function endSet(auto){
  if(!W || W.phase !== 'set') return;
  const ex = W.ex[W.i];
  const secs = Math.max(1, Math.round(elapsedSet()));
  const reps = ex.mode === 'time' ? 0 : (W.reps[ex.id] ?? defaultReps(ex.reps));
  const weight = ex.bw ? 0 : (W.weights[ex.id] || 0);
  if(weight) state.weights[ex.id] = weight;
  W.log.push({ex:ex.id, name:ex.name, set:W.s+1, reps, weight, secs});
  save();
  beep(880,.09);
  W.s++;
  if(W.s >= ex.sets){
    W.s = 0; W.i++;
    if(W.i >= W.ex.length){ finishSession(); return; }
    // следующее упражнение всегда ждёт нажатия «Начать подход» —
    // таймер не должен идти, пока человек не встал в положение
    W.phase = 'idle';
    save();
    renderW(); scrollTop();
    return;
  }
  startRest(ex);
}

function startRest(prevEx){
  const ex = W.ex[W.i] || prevEx;
  const dur = Math.max(10, (prevEx && prevEx.rest) || (ex && ex.rest) || 60);
  W.phase = 'rest'; W.restTotal = dur; W.restEnd = Date.now() + dur*1000;
  const nx = W.ex[W.i];
  $('#restNext').innerHTML = nx ? `Дальше: <b>${nx.name}</b> · подход ${W.s+1} из ${nx.sets}` : '';
  $('#restNum').textContent = mmss(dur);
  $('#ringFg').style.strokeDashoffset = '0';
  $('#rest').classList.add('open');
  updateRest();
}
function updateRest(){
  const left = Math.max(0, (W.restEnd - Date.now())/1000);
  const num = document.getElementById('restNum');
  const ring = document.getElementById('ringFg');
  if(num) num.textContent = mmss(left);
  if(ring){
    const C = 2*Math.PI*104;
    ring.style.strokeDashoffset = String(C * (1 - left / W.restTotal));
  }
}
function endRest(){
  if(!W || W.phase !== 'rest') return;
  $('#rest').classList.remove('open');
  W.phase = 'idle';
  renderW(); scrollTop();
}
function scrollTop(){ const b = $('#wkBody'); if(b) b.scrollTop = 0; }

function tick(){
  if(!W) return;
  if(W.phase === 'set'){
    const ex = W.ex[W.i];
    const el = document.getElementById('setTimer');
    if(!el) return;
    if(ex.mode === 'time'){
      const left = ex.seconds - elapsedSet();
      el.textContent = mmss(Math.max(0, left));
      if(left <= 0) endSet(true);
    } else {
      el.textContent = mmss(elapsedSet());
    }
  } else if(W.phase === 'rest'){
    const left = (W.restEnd - Date.now())/1000;
    updateRest();
    if(left <= 0){ beep(760,.12); setTimeout(()=>beep(1010,.14), 150); endRest(); }
  }
}

function finishSession(){
  W.phase = 'done';
  $('#wkBar').style.width = '100%';
  const sub = document.getElementById('wkSub');
  if(sub) sub.textContent = 'Готово';
  $('#wkFoot').innerHTML = `<button class="btn btn-lime" data-act="save-session">Сохранить и закрыть</button>`;
  renderFinish();
}
function renderFinish(){
  const minutes = Math.max(1, Math.round((Date.now() - W.startedAt)/60000));
  const volume = W.log.reduce((a,l)=>a + (l.weight||0)*l.reps, 0);
  const sets = W.log.length;
  const chest = W.log.some(l => ['chest-press','pec-deck','pushup'].includes(l.ex));
  $('#wkBody').innerHTML = `
    <div class="wcard" style="text-align:center;padding:28px 18px">
      <div style="font-size:40px;line-height:1">💪</div>
      <h2 style="margin-top:14px">Тренировка завершена</h2>
      <p class="small muted" style="margin:6px 0 0">${W.prog.name} · ${W.prog.focus}</p>
      <div class="stats" style="margin-top:20px;text-align:left">
        <div class="stat"><b>${minutes}</b><span>минут</span></div>
        <div class="stat"><b>${sets}</b><span>подходов</span></div>
        <div class="stat"><b>${volume ? Math.round(volume) : '—'}</b><span>кг объёма</span></div>
      </div>
      ${chest ? `<div class="note" style="margin-top:14px;text-align:left">Грудь сегодня получила нагрузку. Завтра — белок и сон, мышцы растут именно там.</div>` : ''}
      <div class="note" style="margin-top:8px;text-align:left">Не забудь: 30–40 г белка в течение пары часов и 2–2,5 л воды за день.</div>
    </div>`;
  $('#wkFoot').innerHTML = `<button class="btn btn-lime" data-act="save-session">Сохранить и закрыть</button>`;
}

function saveSession(){
  if(!W) return;
  const minutes = Math.max(1, Math.round((Date.now() - W.startedAt)/60000));
  const volume = W.log.reduce((a,l)=>a + (l.weight||0)*l.reps, 0);
  state.sessions.push({
    ts: Date.now(), date: dateKey(), programId: W.programId,
    programName: W.prog.name, minutes, sets: W.log.length,
    volume, log: W.log
  });
  save();
  closeWorkout();
  render();
  toast('Тренировка сохранена. Отдыхай!');
}
function closeWorkout(){
  $('#workout').classList.remove('open');
  $('#rest').classList.remove('open');
  clearInterval(tHandle); tHandle = null;
  W = null;
  releaseWakeLock();
}

/* wake lock */
let wl = null;
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
function releaseWakeLock(){ try{ wl && wl.release(); }catch(e){} wl = null; }

/* audio */
let actx = null;
function beep(freq = 800, dur = .1){
  if(!state.settings.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.16, actx.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + .02);
  }catch(e){}
}

/* ============================================================
   AUTH — один логин, без регистрации
   ============================================================ */
const OWNER_LOGIN = 'vargonik';

function showAuth(){
  const el = $('#auth');
  el.classList.add('on');
  el.scrollTop = 0;
  $('#aErr').textContent = '';
  $('#aLogin').value = '';
}
function hideAuth(){ $('#auth').classList.remove('on'); }

/* Если под vargonik прогресса ещё нет — забираем самый полный
   из старых локальных аккаунтов, чтобы ничего не потерялось. */
function seedLegacyState(){
  let best = null, bestScore = -1;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('form_data_') !== 0) continue;
      const login = k.slice(10);
      if(login === OWNER_LOGIN) continue;
      try{
        const s = normalize(JSON.parse(localStorage.getItem(k)));
        const score = (s.sessions||[]).length * 1e9 +
          Object.keys(s.days||{}).length * 1e6 +
          ((s.rev || 0) % 1e6) / 1e6;
        if(score > bestScore){ bestScore = score; best = s; }
      }catch(e){}
    }
  }catch(e){}
  if(!best){
    try{ const legacy = lsGet(LS_KEY); if(legacy) best = normalize(JSON.parse(legacy)); }catch(e){}
  }
  return best || defaultState();
}

function loginAsOwner(){
  const stored = lsGet(userKey(OWNER_LOGIN));
  currentUser = OWNER_LOGIN;
  if(stored){
    state = loadStateFor(OWNER_LOGIN);
  } else {
    state = seedLegacyState();
    saveLocal0();   // rev не трогаем: если в облаке есть свежее, оно победит
  }
  setSession(OWNER_LOGIN);
  const users = getUsers();
  users[OWNER_LOGIN] = users[OWNER_LOGIN] || {owner:true, created:Date.now()};
  setUsers(users);
  setAcct(OWNER_LOGIN, users[OWNER_LOGIN]);
  hideAuth();
  render();
  scheduleReminder();
  syncNow(true);
}

function doAuth(){
  const login = ($('#aLogin').value || '').trim().toLowerCase();
  const err = $('#aErr');
  err.textContent = '';
  if(!login){ err.textContent = 'Введи логин'; return; }
  if(login !== OWNER_LOGIN){ err.textContent = 'Такого логина нет'; return; }
  const first = !lsGet(userKey(OWNER_LOGIN));
  loginAsOwner();
  toast(first ? 'Готово. Прогресс теперь в облаке' : 'С возвращением');
}

function logout(){
  closeSheet();
  closeWorkout();
  clearSession();
  currentUser = null;
  state = defaultState();
  showAuth();
  toast('Вышел. Войди снова — прогресс на месте');
}

function exportBackup(){
  const data = {app:'form', version:1, user:currentUser, ts:Date.now(), state};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'form-backup-' + dateKey() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Копия скачана');
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const data = JSON.parse(fr.result);
      const src = data && data.state ? data.state : data;
      state = normalize(src);
      save(); render(); closeSheet();
      toast('Данные загружены');
    }catch(e){ toast('Не получилось прочитать файл'); }
  };
  fr.readAsText(file);
}

/* ============================================================
   ICS EXPORT
   ============================================================ */
const SITE_BASE = (location.protocol === 'https:' || location.protocol === 'http:')
  ? location.origin + location.pathname.replace(/[^/]*$/, '')
  : '';
const ICS_HOSTED = SITE_BASE ? SITE_BASE + 'trenirovki.ics' : '';

function subscribeCalendar(){
  if(!ICS_HOSTED){
    exportICS();
    toast('Файл скачан — открой его на iPhone');
    return;
  }
  // webcal:// открывает Календарь iPhone и предлагает подписаться
  location.href = ICS_HOSTED.replace(/^https?:\/\//, 'webcal://');
}

function nextDateForDow(dow){
  const d = new Date(); d.setHours(0,0,0,0);
  const diff = (dow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d;
}
function fmtICS(d){
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function exportICS(){
  const s = state.settings;
  const rows = [
    {dow:1, id:'upperA', time:s.weekdayTime},
    {dow:3, id:'lowerA', time:s.weekdayTime},
    {dow:5, id:'upperB', time:s.weekdayTime},
    {dow:0, id:'lowerB', time:s.weekendTime}
  ];
  const codes = ['SU','MO','TU','WE','TH','FR','SA'];
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Form//Training//RU\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:Тренировки\r\n';
  rows.forEach(r=>{
    const p = PROGRAMS[r.id];
    const list = exList(p).filter(e => !e.id.startsWith('w-'));
    const d = nextDateForDow(r.dow);
    const [hh, mm] = r.time.split(':').map(Number);
    d.setHours(hh, mm, 0, 0);
    const end = new Date(d.getTime() + 60*60000);
    const desc = list.map((e,i)=>`${i+1}. ${e.name} — ${e.sets}×${e.reps}`).join('\\n');
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:${r.id}-${r.dow}@form-app\r\n`;
    ics += `DTSTAMP:${stamp}\r\n`;
    ics += `DTSTART:${fmtICS(d)}\r\n`;
    ics += `DTEND:${fmtICS(end)}\r\n`;
    ics += `RRULE:FREQ=WEEKLY;BYDAY=${codes[r.dow]}\r\n`;
    ics += `SUMMARY:Тренировка · ${p.name}\r\n`;
    ics += `DESCRIPTION:${desc}\r\n`;
    ics += 'LOCATION:Дом\r\n';
    ics += 'BEGIN:VALARM\r\nTRIGGER:-PT15M\r\nACTION:DISPLAY\r\nDESCRIPTION:Тренировка через 15 минут\r\nEND:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trenirovki.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Файл календаря скачан');
}

}
function isIOS(){
  return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

  }, 3500);

/* ============================================================
   НАПОМИНАНИЯ
   ============================================================ */
let remTimers = [];

function planTimeOf(plan){
  return plan.slot === 'weekday' ? state.settings.weekdayTime : state.settings.weekendTime;
}
function todayPlanId(){
  const p = WEEK_PLAN[new Date().getDay()];
  return p ? p.id : null;
}
function scheduleReminder(){
  remTimers.forEach(clearTimeout);
  remTimers = [];
  if(!state.settings.remind) return;
  const now = Date.now();
  for(let k=0;k<8;k++){
    const d = new Date();
    d.setDate(d.getDate() + k);
    const plan = WEEK_PLAN[d.getDay()];
    if(!plan) continue;
    const [h, m] = String(planTimeOf(plan)).split(':').map(Number);
    if(!isFinite(h)) continue;
    d.setHours(h, m || 0, 0, 0);
    const at = d.getTime();
    const delay = (at - 15*60000) - now;
    if(delay > 1000 && delay < 8*864e5){
      remTimers.push(setTimeout(() => fireReminder(at, plan.id), delay));
    }
  }
}
function fireReminder(at, progId){
  const prog = programById(progId);
  if(!prog) return;
  const d = new Date(at);
  const when = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const title = 'Через 15 минут тренировка';
  const body = `${prog.name} · ${when}`;
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification(title, {
        body: `${body}. ${prog.focus}`,
        icon: 'icon-192.png',
        badge: 'icon-192.png',
        tag: 'form-training',
        renotify: true
      });
      n.onclick = () => { try{ window.focus(); }catch(e){} startWorkout(progId); n.close(); };
    }catch(e){}
  }
  showRemindBanner(title, body, progId);
}
function showRemindBanner(title, body, progId){
  const el = $('#remind');
  if(!el) return;
  $('#remindTitle').textContent = title;
  $('#remindBody').textContent = body;
  const btn = $('#remindStart');
  btn.dataset.prog = progId || '';
  el.classList.add('on');
  beep(720, .08);
}
function hideRemindBanner(){ const el = $('#remind'); if(el) el.classList.remove('on'); }
function askNotifications(){
  if(!('Notification' in window)){ toast('Уведомления недоступны — включи подписку на календарь'); return; }
  Notification.requestPermission().then(p => {
    state.settings.remind = p === 'granted';
    save();
    if(state.settings.remind){ scheduleReminder(); toast('Напоминания включены'); }
    else toast('Разрешение не выдано');
    if($('#sheet').classList.contains('open')) settingsSheet();
  }).catch(()=>{});
}

/* ============================================================
   TOAST
   ============================================================ */
let toastT = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('on'), 2400);
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'tab'){
    state.tab = el.dataset.tab; save(); render(); window.scrollTo(0,0);
  }
  else if(act === 'settings'){ settingsSheet(); }
  else if(act === 'close-sheet'){ closeSheet(); }
  else if(act === 'start'){ closeSheet(); startWorkout(el.dataset.prog); }
  else if(act === 'pick-program'){ pickProgramSheet(); }
  else if(act === 'close-workout'){ if(confirmLeave()) closeWorkout(); }
  else if(act === 'sched-full'){ openSchedule(); }
  else if(act === 'sched-close'){ closeSchedule(); }
  else if(act === 'sched-prev'){ if(SV.week > 1){ SV.week--; renderSched(); $('#scBody').scrollTop = 0; } }
  else if(act === 'sched-next'){ if(SV.week < SD_MAX){ SV.week++; renderSched(); $('#scBody').scrollTop = 0; } }
  else if(act === 'sched-mode'){
    SV.mode = SV.mode === 'all' ? 'week' : 'all';
    renderSched(); $('#scBody').scrollTop = 0;
  }
  else if(act === 'start-set'){ startSet(); }
  else if(act === 'end-set'){ endSet(); }
  else if(act === 'rest-skip'){ endRest(); }
  else if(act === 'rest-15'){
    const v = +(el.dataset.v || 15);
    W.restEnd += v*1000;
    W.restTotal = Math.max(W.restTotal, (W.restEnd - Date.now())/1000);
    updateRest();
  }
  else if(act === 'save-session'){ saveSession(); }
  else if(act === 'add-food'){ foodSheet(); }
  else if(act === 'quick-food'){
    const f = FOODS[+el.dataset.i];
    if(!f) return;
    const nameEl = $('#fName');
    if(nameEl.value.trim()){
      nameEl.value = nameEl.value + ' + ' + f.n;
      $('#fK').value = ((+$('#fK').value||0) + f.k).toFixed(0);
      $('#fP').value = ((+$('#fP').value||0) + f.p).toFixed(1);
      $('#fF').value = ((+$('#fF').value||0) + f.f).toFixed(1);
      $('#fC').value = ((+$('#fC').value||0) + f.c).toFixed(1);
    } else {
      nameEl.value = f.n;
      $('#fK').value = f.k; $('#fP').value = f.p; $('#fF').value = f.f; $('#fC').value = f.c;
    }
    el.style.background = 'rgba(205,255,77,.18)';
  }
  else if(act === 'save-food'){ saveFood(); }
  else if(act === 'del-meal'){
    const d = dayData();
    d.meals.splice(+el.dataset.i, 1);
    save(); render();
  }
  else if(act === 'water'){
    const d = dayData();
    const i = +el.dataset.i;
    d.water = (d.water === i+1) ? i : i+1;
    save(); render();
  }
  else if(act === 'toggle-sound'){
    state.settings.sound = !state.settings.sound;
    save();
    el.classList.toggle('on', state.settings.sound);
    if(state.settings.sound) beep(880,.08);
  }
  else if(act === 'toggle-diagrams'){
    state.settings.diagrams = state.settings.diagrams === false;
    save();
    el.classList.toggle('on', state.settings.diagrams !== false);
    if(W) renderW();
    toast(state.settings.diagrams !== false ? 'Фото включены' : 'Фото скрыты');
  }
  else if(act === 'toggle-viz'){
    state.settings.diagrams = !(state.settings.diagrams !== false);
    save(); renderW();
  }
  else if(act === 'zoom-photo'){ zoomPhoto(el.dataset.src); }
  else if(act === 'export-ics'){ exportICS(); }
  else if(act === 'sync-now'){
    syncNow();
    setTimeout(() => toast(cloudState === 'ok' ? 'Синхронизировано с облаком' : cloudLabel()), 900);
  }
  else if(act === 'subscribe-ics'){ subscribeCalendar(); }
  else if(act === 'install-help'){ installHelp(); }
  else if(act === 'toggle-remind'){
    if(!state.settings.remind){ askNotifications(); }
    else {
      state.settings.remind = false;
      save(); scheduleReminder();
      el.classList.remove('on');
      toast('Напоминания выключены');
    }
  }
  else if(act === 'remind-start'){
    hideRemindBanner();
    const prog = el.dataset.prog || (todayPlanId() || 'upperA');
    closeSheet(); startWorkout(prog);
  }
  else if(act === 'remind-close'){ hideRemindBanner(); }
  else if(act === 'backup-save'){ exportBackup(); }
  else if(act === 'backup-load'){ $('#impFile').click(); }
  else if(act === 'auth-submit'){ doAuth(); }
  else if(act === 'logout'){ logout(); }
  else if(act === 'reset-day'){
    state.days[dateKey()] = {meals:[], water:0};
    save(); closeSheet(); render(); toast('Питание за сегодня очищено');
  }
  else if(act === 'reset-all'){
    if(confirm('Удалить мои тренировки, питание и настройки? Аккаунт останется.')){
      state = defaultState();
      save(); closeSheet(); render(); toast('Прогресс сброшен');
    }
  }
});

function confirmLeave(){
  if(!W) return true;
  if(W.phase === 'done') return true;
  return confirm('Прервать тренировку? Прогресс этой сессии не сохранится.');
}

document.addEventListener('change', e=>{
  const id = e.target.id;
  if(id === 'sWeekday' || id === 'sWeekend'){
    const v = e.target.value;
    if(!v) return;
    if(id === 'sWeekday') state.settings.weekdayTime = v; else state.settings.weekendTime = v;
    save(); render(); scheduleReminder(); toast('Время сохранено');
  }
  if(['tK','tP','tF','tC'].includes(id)){
    const map = {tK:'kcal', tP:'p', tF:'f', tC:'c'};
    state.targets[map[id]] = Math.max(0, +e.target.value || 0);
    save(); render();
  }
});

$('#backdrop').addEventListener('click', closeSheet);
$('#lbx').addEventListener('click', e => e.currentTarget.classList.remove('on'));
const loginInput = document.getElementById('aLogin');
if(loginInput) loginInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doAuth(); } });
document.addEventListener('change', e=>{
  if(e.target.id === 'impFile' && e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
});

/* boot */
(function boot(){
  const sess = (lsGet(SESSION_KEY) || cookieGet('form_session') || '').toLowerCase();
  if(sess === OWNER_LOGIN){
    currentUser = OWNER_LOGIN;
    state = loadStateFor(OWNER_LOGIN);
    setSession(OWNER_LOGIN);
    hideAuth();
    syncNow(true);
  } else {
    showAuth();
    if(!storageWorks()){
      const e = $('#aErr');
      if(e) e.textContent = 'Браузер запрещает сохранение данных. Открой сайт не в приватном режиме.';
    }
  }
  render();
  scheduleReminder();
  maybePromptInstall();

  // таймеры браузер замораживает в фоне — после возврата пересчитываем
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') scheduleReminder();
  });

  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
